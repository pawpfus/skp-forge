<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SKP FORGE — LAPORAN BULANAN</title>
<meta name="theme-color" content="#0e1114" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2314171a'/%3E%3Crect x='4' y='4' width='56' height='56' fill='none' stroke='%238b959e' stroke-width='2'/%3E%3Ctext x='32' y='43' font-family='Arial Narrow,Impact,sans-serif' font-size='31' font-weight='bold' text-anchor='middle' fill='%23f2610c'%3ESF%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="vendor/fonts.css">

<style>
  /* ===================================================================
     TEMA: BENGKEL BAJA
     Pelat baja disikat, garis gambar kerja, label stensil, oranye
     keselamatan. Tanpa pendar, tanpa siku kurung HUD — kesannya
     perkakas bengkel, bukan layar fiksi ilmiah.
     =================================================================== */
  :root{
    color-scheme:dark;
    /* nama --ember-hi / --spark / --danger / --text-dim dipakai juga oleh
       skrip status, jadi namanya dipertahankan */
    --ember:#f2610c; --ember-hi:#ff7a2e; --spark:#e8b21f; --danger:#e2483c;
    --steel:#8b959e;
    --bg:#0a0d0f; --plate:#1a1e22; --plate-hi:#232930; --slot:#0a0d0f;
    --line:#252b31; --edge:#39414a; --bevel:rgba(255,255,255,0.055);
    --text:#dfe4e8; --text-dim:#8b959e;
    --pad:20px;
    /* pita bahaya & sikatan pelat dipakai berulang */
    --hazard:repeating-linear-gradient(135deg,var(--ember) 0 9px,#15181b 9px 18px);
    --brushed:repeating-linear-gradient(90deg,rgba(255,255,255,0.016) 0 1px,transparent 1px 4px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    background:var(--brushed),linear-gradient(180deg,#12161a 0,#0b0e10 520px,#090b0d 100%) fixed;
    color:var(--text);padding:0 16px 72px;
    font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:14px;line-height:1.5;font-feature-settings:"tnum" 1;
    -webkit-font-smoothing:antialiased;
  }
  /* pita bahaya melintang di puncak halaman */
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:5px;
    background:var(--hazard);opacity:0.9;z-index:60;pointer-events:none;}

  /* ---------- papan nama mesin ---------- */
  header{position:relative;max-width:880px;margin:34px auto 20px;display:flex;align-items:center;gap:16px;
    padding:16px 20px;background:var(--brushed),linear-gradient(180deg,var(--plate-hi),#141719);
    border:1px solid var(--edge);
    box-shadow:inset 0 1px 0 var(--bevel),inset 0 -1px 0 rgba(0,0,0,0.5),0 2px 0 rgba(0,0,0,0.45);}
  header::after{content:'';position:absolute;left:-1px;right:-1px;bottom:-4px;height:3px;background:var(--ember);}
  header .dot{width:32px;height:32px;flex:none;background:var(--hazard);
    border:1px solid #050708;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.07);}
  header h1{font-family:'Oswald',Impact,'Arial Narrow',sans-serif;font-weight:600;font-size:30px;
    letter-spacing:0.085em;margin:0;line-height:1;color:#f0f4f7;
    text-shadow:0 2px 0 rgba(0,0,0,0.75);}
  header small{display:block;font-size:10.5px;letter-spacing:0.26em;color:#8d979f;
    margin-top:7px;text-transform:uppercase;}

  /* ---------- pelat panel ---------- */
  .panel{position:relative;max-width:880px;margin:0 auto 20px;padding:var(--pad);
    background:var(--brushed),linear-gradient(180deg,var(--plate) 0,#15181b 100%);
    border:1px solid var(--edge);
    box-shadow:inset 0 1px 0 var(--bevel),0 2px 0 rgba(0,0,0,0.45),0 16px 34px rgba(0,0,0,0.3);}
  /* baut di keempat sudut, menggantikan siku kurung */
  .corner{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 34% 28%,#69737c,#39414a 55%,#1b1f23 100%);
    box-shadow:0 1px 0 rgba(255,255,255,0.07),inset 0 0 0 1px rgba(0,0,0,0.55);}
  .corner::after{content:'';position:absolute;left:2px;right:2px;top:50%;height:1px;
    background:rgba(0,0,0,0.65);transform:translateY(-0.5px) rotate(38deg);}
  .corner.tl{top:8px;left:8px;} .corner.tr{top:8px;right:8px;}
  .corner.bl{bottom:8px;left:8px;} .corner.br{bottom:8px;right:8px;}

  /* judul panel = strip label melintang pelat */
  .panel h2{display:flex;align-items:center;gap:11px;margin:calc(var(--pad) * -1) calc(var(--pad) * -1) 18px;
    padding:12px 18px 12px 16px;background:linear-gradient(180deg,#22272c,#171b1e);
    border-bottom:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--bevel);
    font-family:'Oswald',sans-serif;font-weight:500;font-size:12.5px;letter-spacing:0.19em;
    text-transform:uppercase;color:#c8d0d7;}
  .panel h2::after{content:'';flex:1;height:5px;margin-left:2px;
    background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 7px);}
  .panel h2 .step{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;flex:none;
    background:var(--ember);color:#150a02;font-weight:600;font-size:12px;letter-spacing:0;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,0.28);}

  /* ---------- area jatuhkan berkas ---------- */
  #dropzone{position:relative;padding:38px 16px;text-align:center;cursor:pointer;background:var(--slot);
    border:1px solid var(--edge);outline:1px dashed #454e58;outline-offset:-9px;
    box-shadow:inset 0 2px 10px rgba(0,0,0,0.55);transition:background .14s,outline-color .14s,border-color .14s;}
  #dropzone b{display:block;font-family:'Oswald',sans-serif;font-weight:500;font-size:17px;
    letter-spacing:0.3em;color:#c2ccd4;text-indent:0.3em;}
  #dropzone small{display:block;margin-top:8px;font-size:10px;letter-spacing:0.2em;
    text-transform:uppercase;color:#697380;}
  #dropzone:hover,#dropzone.over{background:#0d1215;border-color:var(--ember);outline-color:var(--ember);}
  #dropzone:hover b,#dropzone.over b{color:var(--ember-hi);}
  #dropzone::before,#dropzone::after{content:'';position:absolute;width:11px;height:11px;pointer-events:none;
    border:solid #454e57;border-width:0;}
  #dropzone::before{top:5px;left:5px;border-top-width:1px;border-left-width:1px;}
  #dropzone::after{bottom:5px;right:5px;border-bottom-width:1px;border-right-width:1px;}

  /* ---------- tabel daftar berkas ---------- */
  #file-list{overflow-x:auto;margin-top:16px;}
  #file-list:empty{margin-top:0;}
  #file-list table{min-width:600px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{padding:9px 11px;text-align:left;vertical-align:top;}
  th{font-family:'Oswald',sans-serif;font-weight:500;font-size:10px;letter-spacing:0.16em;
    text-transform:uppercase;color:#98a2ab;background:#12161a;
    border-top:1px solid var(--line);border-bottom:2px solid var(--edge);white-space:nowrap;}
  td{border-bottom:1px solid #1e2327;color:#cfd6db;}
  tbody tr:last-child td,tr:last-child td{border-bottom:1px solid var(--line);}
  #file-list tr:hover td{background:rgba(242,97,12,0.045);}
  td .src{color:var(--spark);font-weight:500;}
  td .ok{color:var(--ember-hi);font-weight:500;} td .warn{color:var(--spark);} td .err{color:var(--danger);}

  /* ---------- kendali ---------- */
  .controls{display:flex;flex-wrap:wrap;gap:16px 14px;align-items:flex-end;}
  .controls label{display:flex;flex-direction:column;gap:7px;
    font-family:'Oswald',sans-serif;font-size:9.5px;font-weight:500;letter-spacing:0.19em;
    text-transform:uppercase;color:#7d878f;}
  .controls label.wide{flex:1 1 330px;}
  .controls label.wide input{width:100%;}
  select,input[type=number],input[type=text]{background:var(--slot);border:1px solid #272d33;color:var(--text);
    font-family:'Barlow',sans-serif;font-size:14px;padding:10px 11px;outline:none;min-width:154px;
    box-shadow:inset 0 2px 5px rgba(0,0,0,0.6);border-radius:0;}
  select{appearance:none;-webkit-appearance:none;padding-right:30px;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,#8b959e 50%),linear-gradient(135deg,#8b959e 50%,transparent 50%);
    background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  select:focus,input:focus{border-color:var(--ember);
    box-shadow:inset 0 2px 5px rgba(0,0,0,0.6),inset 3px 0 0 var(--ember);}
  input::placeholder{color:#5b646c;}
  select option{background:#15191d;color:var(--text);}

  /* tombol = sakelar pelat */
  button{font-family:'Oswald',sans-serif;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;
    cursor:pointer;border-radius:0;color:var(--text);
    background:linear-gradient(180deg,#2a3036,#1b2024);border:1px solid var(--edge);
    box-shadow:inset 0 1px 0 var(--bevel),0 2px 0 #080a0c;transition:background .12s,border-color .12s,color .12s;}
  button:hover{background:linear-gradient(180deg,#333a41,#20262b);border-color:#4c555f;}
  button:active{transform:translateY(2px);box-shadow:inset 0 1px 0 var(--bevel);}
  button:disabled{opacity:0.32;cursor:not-allowed;transform:none;}
  #btn-generate{font-size:14px;letter-spacing:0.22em;padding:13px 34px;color:#180c03;
    background:linear-gradient(180deg,#ff8a3a,#df550a);border-color:#8f3c08;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.34),inset 0 -2px 0 rgba(0,0,0,0.2),0 3px 0 #6f2f06;}
  #btn-generate:hover:not(:disabled){background:linear-gradient(180deg,#ffa05c,#ef6512);border-color:#a2450a;}
  #btn-generate:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.28);}
  #btn-generate::before{content:'\25B8';margin-right:11px;font-size:12px;opacity:0.75;}

  /* baris pembacaan status */
  #status{margin-top:18px;font-size:12.5px;color:var(--text-dim);min-height:15px;}
  #status:not(:empty){padding:11px 13px;background:var(--slot);border:1px solid var(--line);
    border-left:3px solid currentColor;box-shadow:inset 0 2px 6px rgba(0,0,0,0.5);}

  /* tombol lampiran di dalam tabel */
  .lamp-btn,.del-btn,.row-del{font-family:'Oswald',sans-serif;font-weight:500;font-size:10px;
    letter-spacing:0.12em;padding:5px 9px;white-space:nowrap;}
  .lamp-btn.done{border-color:var(--ember);color:var(--ember-hi);
    background:linear-gradient(180deg,#2e2119,#1f1712);}
  .del-btn,.row-del{color:#a9737a;border-color:#3a2f31;background:linear-gradient(180deg,#262a2e,#1a1e21);}
  .del-btn:hover,.row-del:hover{color:#fff;border-color:var(--danger);
    background:linear-gradient(180deg,#8d3129,#6d241e);}

  /* ---------- peti data lampiran ---------- */
  #lamp-modal{position:fixed;inset:0;background:rgba(6,8,10,0.9);z-index:70;
    display:flex;align-items:center;justify-content:center;padding:18px;}
  #lamp-modal[hidden]{display:none;}
  .lamp-box{position:relative;width:min(1140px,100%);max-height:92vh;display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--plate),#141719);border:1px solid var(--edge);
    box-shadow:inset 0 1px 0 var(--bevel),0 26px 60px rgba(0,0,0,0.6);}
  .lamp-box::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--hazard);opacity:0.8;}
  .lamp-head{display:flex;align-items:flex-start;gap:14px;padding:17px 18px 14px;
    background:linear-gradient(180deg,#22272c,#181c20);border-bottom:1px solid var(--edge);}
  .lamp-head h3{font-family:'Oswald',sans-serif;font-weight:500;font-size:13px;letter-spacing:0.17em;
    text-transform:uppercase;color:#d3dae0;margin:0 0 5px;}
  .lamp-head .sub{font-size:11.5px;color:var(--text-dim);line-height:1.6;word-break:break-word;}
  .lamp-x{background:transparent;border:1px solid var(--line);color:var(--text-dim);
    font-size:13px;padding:4px 10px;margin-left:auto;flex:none;box-shadow:none;}
  .lamp-x:hover{color:#fff;border-color:var(--danger);background:#7c2a23;}
  .lamp-grid-wrap{overflow:auto;padding:14px 18px;flex:1;background:#101315;
    box-shadow:inset 0 3px 10px rgba(0,0,0,0.45);}
  #lamp-grid{width:100%;border-collapse:collapse;font-size:12px;}
  #lamp-grid th{position:sticky;top:0;z-index:1;background:#191e22;color:#98a2ab;
    font-family:'Oswald',sans-serif;font-weight:500;font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase;
    padding:8px 8px;border:1px solid var(--line);border-bottom:2px solid var(--edge);
    text-align:left;min-width:96px;vertical-align:bottom;}
  #lamp-grid td{border:1px solid #1c2125;padding:2px;vertical-align:top;background:#14181b;}
  #lamp-grid td.rownum{font-family:'Oswald',sans-serif;color:#6f7a83;text-align:center;
    padding:7px 4px;font-size:10.5px;min-width:30px;background:#191e22;}
  #lamp-grid td.auto{color:var(--spark);padding:7px 8px;white-space:nowrap;font-size:11.5px;
    background:#191510;border-color:#2c2620;}
  #lamp-grid textarea{width:100%;min-width:104px;background:var(--slot);border:1px solid transparent;
    color:var(--text);font-family:'Barlow',sans-serif;font-size:12px;padding:6px 7px;
    outline:none;resize:vertical;line-height:1.45;border-radius:0;
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.5);}
  #lamp-grid textarea:focus{border-color:var(--ember);box-shadow:inset 0 1px 3px rgba(0,0,0,0.5),inset 2px 0 0 var(--ember);}
  .lamp-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 18px;
    background:linear-gradient(180deg,#1c2125,#15191c);border-top:1px solid var(--edge);}
  .lamp-foot button{font-size:11px;padding:9px 15px;}
  .lamp-foot .primary{color:#180c03;background:linear-gradient(180deg,#ff8a3a,#df550a);border-color:#8f3c08;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.34),0 2px 0 #6f2f06;}
  .lamp-foot .primary:hover{background:linear-gradient(180deg,#ffa05c,#ef6512);border-color:#a2450a;}
  /* baris 1: perkakas — pemisah — batal/simpan; baris 2: keterangan penuh */
  .lamp-foot .spacer{flex:1;order:2;}
  #lamp-cancel,#lamp-save{order:3;}
  .lamp-hint{order:4;flex:1 1 100%;font-size:11px;color:var(--text-dim);line-height:1.55;
    padding-top:2px;border-top:1px solid var(--line);margin-top:2px;}
  .lamp-hint:empty{display:none;}
  .lamp-periode{display:flex;align-items:center;gap:8px;
    font-family:'Oswald',sans-serif;font-size:9.5px;font-weight:500;letter-spacing:0.15em;
    text-transform:uppercase;color:#7d878f;}
  .lamp-periode[hidden]{display:none;}
  .lamp-periode select,.lamp-periode input{font-size:12px;padding:7px 9px;min-width:0;}
  .lamp-periode select{min-width:118px;padding-right:28px;} .lamp-periode input{width:82px;}

  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-track{background:#0c0f11;}
  ::-webkit-scrollbar-thumb{background:#2e353c;border:2px solid #0c0f11;}
  ::-webkit-scrollbar-thumb:hover{background:#3d454e;}

  @media (max-width:640px){
    body{padding:0 11px 56px;}
    header{margin:26px auto 18px;padding:14px 15px;gap:13px;}
    header h1{font-size:21px;}
    .panel{--pad:15px;}
    .panel h2{font-size:11px;letter-spacing:0.15em;padding:11px 14px;}
    .corner{width:8px;height:8px;top:6px;left:6px;}
    .corner.tr{left:auto;right:6px;} .corner.bl{top:auto;bottom:6px;} .corner.br{top:auto;bottom:6px;left:auto;right:6px;}
    .controls label,.controls label.wide{flex:1 1 100%;}
    select,input[type=number],input[type=text]{min-width:0;width:100%;}
    #btn-generate{width:100%;}
    #dropzone{padding:30px 12px;} #dropzone b{font-size:14px;letter-spacing:0.22em;}
    .lamp-box{max-height:96vh;} .lamp-grid-wrap{padding:9px;} .lamp-foot{padding:11px;gap:8px;}
    .lamp-periode{flex:1 1 100%;}
  }
</style>
</head>
<body>

<header>
  <span class="dot"></span>
  <div>
    <h1>SKP FORGE</h1>
    <small>Laporan Bulanan &middot; Penyuluh Pertanian</small>
  </div>
</header>

<div class="panel">
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <h2><span class="step">1</span> Masukkan laporan bulan lalu (.docx)</h2>
  <div id="dropzone">
    <b>SERET / KETUK</b>
    <small>berkas tidak dikirim ke mana pun</small>
  </div>
  <input type="file" id="file-input" accept=".docx" multiple style="display:none">
  <div id="file-list"></div>
</div>

<div class="panel">
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <h2><span class="step">2</span> Pilih periode laporan baru</h2>
  <div class="controls">
    <label>JENIS
      <select id="sel-jenis">
        <option value="bulanan" selected>BULANAN</option>
        <option value="triwulan">TRIWULAN</option>
      </select>
    </label>
    <label id="lbl-bulan">BULAN
      <select id="sel-bulan"></select>
    </label>
    <label id="lbl-triwulan" style="display:none">TRIWULAN
      <select id="sel-triwulan">
        <option value="0">I (JAN&ndash;MAR)</option>
        <option value="1">II (APR&ndash;JUN)</option>
        <option value="2">III (JUL&ndash;SEP)</option>
        <option value="3">IV (OKT&ndash;DES)</option>
      </select>
    </label>
    <label>TAHUN
      <input type="number" id="sel-tahun" min="2024" max="2099">
    </label>
    <label>NAMA DESA (OPSIONAL)
      <input type="text" id="sel-desa" placeholder="sesuai dokumen" autocomplete="off">
    </label>
    <label class="wide">TAUTAN DRIVE (OPSIONAL)
      <input type="text" id="sel-link" placeholder="sesuai dokumen" autocomplete="off" spellcheck="false">
    </label>
    <label>VARIASI NARASI
      <select id="sel-narasi">
        <option value="asli">ASLI (TANPA PERUBAHAN)</option>
        <option value="A">VARIASI A</option>
        <option value="B">VARIASI B</option>
        <option value="C">VARIASI C</option>
        <option value="acak" selected>ACAK A/B/C PER FILE</option>
      </select>
    </label>
    <button id="btn-generate" disabled>Buat</button>
  </div>
  <div id="status"></div>
</div>

<div id="lamp-modal" hidden>
  <div class="lamp-box">
    <div class="lamp-head">
      <div>
        <h3 id="lamp-title">LAMPIRAN</h3>
        <div class="sub" id="lamp-sub"></div>
      </div>
      <button class="lamp-x" id="lamp-close">&#10005;</button>
    </div>
    <div class="lamp-grid-wrap"><table id="lamp-grid"></table></div>
    <div class="lamp-foot">
      <button id="lamp-impor">Unggah data lampiran</button>
      <input type="file" id="lamp-impor-file" accept=".pdf,.docx,.xlsx,.csv" style="display:none">
      <button id="lamp-add">+ BARIS</button>
      <button id="lamp-reset">KEMBALIKAN ASLI</button>
      <span class="lamp-periode" id="lamp-periode" hidden>BULAN KOLOM TANGGAL
        <select id="lamp-bulan"></select>
        <input type="number" id="lamp-tahun" min="2024" max="2099">
      </span>
      <span class="lamp-hint" id="lamp-hint"></span>
      <span class="spacer"></span>
      <button id="lamp-cancel">BATAL</button>
      <button id="lamp-save" class="primary">SIMPAN</button>
    </div>
  </div>
</div>

<script>
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI_EN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const lastDay = (y, m) => new Date(y, m + 1, 0).getDate(); // m = 0-11
const escHtml = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// teks polos dokumen: tag dibuang tanpa pemisah supaya kata yang terbelah
// antar-run menyatu kembali, tetapi batas paragraf/tab/baris tetap jadi spasi
// agar kata paragraf berbeda tidak berdempet ("Otting" + "LAMPIRAN")
const flatText = xml => xml
  .replace(/<\/w:p>|<w:p[^>]*\/>|<w:tab\/>|<w:br\/>/g, ' ')
  .replace(/<[^>]+>/g, '');

// ===== deteksi bulan & tahun sumber dari isi dokumen (fallback: nama file) =====
// Deteksi jalan di teks polos: angka hex di atribut markup (rsid dsb.) tidak
// ikut terhitung sebagai "tahun".
function detectSource(xml, filename){
  const flat = flatText(xml);
  const up = flat.toUpperCase();
  let mIdx = -1, year = null;
  for(let i = 0; i < 12; i++){
    if(up.includes('BULAN ' + BULAN[i].toUpperCase())){ mIdx = i; break; }
  }
  if(mIdx < 0){
    for(let i = 0; i < 12; i++) if(filename.toLowerCase().includes(BULAN[i].toLowerCase())){ mIdx = i; break; }
  }
  const most = freq => {
    let best = null, bn = 0;
    Object.keys(freq).forEach(y => { if(freq[y] > bn){ bn = freq[y]; best = y; } });
    return best ? parseInt(best, 10) : null;
  };
  if(mIdx >= 0){
    // tahun yang paling sering menyertai nama bulan (tahan terhadap angka
    // tahun lain di teks, mis. kutipan undang-undang)
    const freq = {};
    for(const m of flat.matchAll(new RegExp(BULAN[mIdx] + '\\s+(20\\d\\d)', 'gi')))
      freq[m[1]] = (freq[m[1]] || 0) + 1;
    year = most(freq);
  }
  if(year === null){
    const freq = {};
    (flat.match(/20\d\d/g) || []).forEach(y => freq[y] = (freq[y] || 0) + 1);
    year = most(freq);
  }
  return (mIdx >= 0 && year) ? { mIdx, year } : null;
}

// ===== transformasi isi document.xml dari periode sumber ke periode target =====
// Urutan penting: operasi baris tabel & tanggal dd/mm/yyyy memakai tanggal
// SUMBER, jadi harus jalan sebelum nama bulan/tahun ditukar.
// Tabel harian (lampiran LTT): jumlah baris <w:tr> dan tanggal dd/mm/yyyy (Www)
// dipindahkan dari periode src ke periode dst. Dipisah dari transformXml supaya
// bulan tabel dapat ditetapkan sendiri, terlepas dari periode laporan.
function setTabelHarian(xml, src, dst){
  const sLast = lastDay(src.year, src.mIdx), dLast = lastDay(dst.year, dst.mIdx);
  const sMM = String(src.mIdx + 1).padStart(2, '0'), dMM = String(dst.mIdx + 1).padStart(2, '0');
  if(sMM === dMM && src.year === dst.year) return xml;
  const dateTag = dd => String(dd).padStart(2, '0') + '/' + sMM + '/' + src.year;
  // cari awal tag baris; '<w:tr' saja juga cocok dengan '<w:trPr' — pastikan
  // karakter berikutnya spasi atau '>'
  function trStart(before){
    let i = before;
    while((i = xml.lastIndexOf('<w:tr', i - 1)) >= 0){
      const c = xml[i + 5];
      if(c === ' ' || c === '>') return i;
    }
    return -1;
  }
  function trBounds(needle){
    const at = xml.indexOf(needle);
    if(at < 0) return null;
    const start = trStart(at);
    const end = xml.indexOf('</w:tr>', at);
    if(start < 0 || end < 0) return null;
    return { start, end: end + 7 };
  }
  if(dLast < sLast){
    for(let dd = dLast + 1; dd <= sLast; dd++){
      const b = trBounds(dateTag(dd));
      if(b) xml = xml.slice(0, b.start) + xml.slice(b.end);
    }
  } else if(dLast > sLast){
    const b = trBounds(dateTag(sLast));
    if(b){
      const rowTpl = xml.slice(b.start, b.end);
      let extra = '';
      for(let dd = sLast + 1; dd <= dLast; dd++)
        extra += rowTpl.split(dateTag(sLast)).join(dateTag(dd));
      xml = xml.slice(0, b.end) + extra + xml.slice(b.end);
    }
  }
  return xml.replace(/(\d{2})\/(\d{2})\/(\d{4})(\s*\((?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\))?/g,
    (all, dd, mm, yyyy, wd) => {
      if(mm !== sMM || parseInt(yyyy, 10) !== src.year) return all;
      const d = parseInt(dd, 10);
      if(d < 1 || d > dLast) return all;
      const nw = wd ? ' (' + HARI_EN[new Date(dst.year, dst.mIdx, d).getDay()] + ')' : '';
      return dd + '/' + dMM + '/' + dst.year + nw;
    });
}

// lewatiTabel: tabel harian sudah diatur sendiri (bulan tabel dipilih pengguna)
function transformXml(xml, src, dst, lewatiTabel){
  const sName = BULAN[src.mIdx], dName = BULAN[dst.mIdx];
  const sLast = lastDay(src.year, src.mIdx), dLast = lastDay(dst.year, dst.mIdx);

  // -- 1&2. tabel harian: jumlah baris + tanggal dd/mm/yyyy --
  if(!lewatiTabel) xml = setTabelHarian(xml, src, dst);

  // -- 3. nama bulan & tahun: lintas-run (nama bulan bisa terbelah antar-run) --
  xml = swapRunText(xml, sName, dName);
  xml = swapRunText(xml, sName.toUpperCase(), dName.toUpperCase());
  // sebagian dokumen menulis bulan menempel tahun tanpa spasi ("Juni2026"),
  // sehingga batas kata di sisi kanan tidak terbentuk
  [[sName, dName], [sName.toUpperCase(), dName.toUpperCase()]].forEach(([s, d]) => {
    xml = swapRunRegex(xml, new RegExp('\\b' + s + '(?=\\d)', 'g'), d);
  });
  if(src.year !== dst.year){
    xml = swapRunText(xml, String(src.year), String(dst.year));
    [[dName, dName], [dName.toUpperCase(), dName.toUpperCase()]].forEach(([s, d]) => {
      xml = swapRunRegex(xml, new RegExp(s + String(src.year), 'g'), d + String(dst.year));
    });
  }

  // -- 4. hari terakhir periode (01-30 -> 01-31, "Pitu Riawa, 30 ..." -> 31).
  // Word memecah teks jadi run kecil — bahkan angkanya bisa terbelah ("3"|"0"),
  // jadi pola dicari di teks GABUNGAN per-paragraf, lalu kedua digitnya
  // diganti karakter-per-karakter lewat peta indeks gabungan→run. Panjang
  // selalu 2 digit (28–31) sehingga struktur run tidak berubah.
  if(sLast !== dLast){
    const sStr = String(sLast), dStr = String(dLast);
    const finders = [
      new RegExp('01\\s*[-–]\\s*' + sStr + '(?=\\s+' + dName + ')', 'g'),
      new RegExp('s/d\\s+' + sStr + '(?=\\s+' + dName + ')', 'g'),
      new RegExp(',\\s*' + sStr + '(?=\\s+' + dName + '\\s+' + dst.year + ')', 'g')
    ];
    xml = xml.replace(/<w:p[ >][\s\S]*?<\/w:p>/g, para => {
      const runs = [];
      let joined = '';
      for(const m of para.matchAll(/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>/g)){
        runs.push({ t: m[1], at: joined.length });
        joined += m[1];
      }
      const hits = [];
      finders.forEach(re => {
        let m; re.lastIndex = 0;
        while((m = re.exec(joined))) hits.push(m.index + m[0].length - sStr.length);
      });
      if(!hits.length) return para;
      hits.forEach(pos => {
        for(let i = 0; i < dStr.length; i++){
          const g = pos + i;
          const r = runs.find(q => g >= q.at && g < q.at + q.t.length);
          if(r) r.t = r.t.slice(0, g - r.at) + dStr[i] + r.t.slice(g - r.at + 1);
        }
      });
      let k = 0;
      return para.replace(/(<w:t(?:\s[^>]*)?>)([\s\S]*?)(<\/w:t>)/g,
        (a, o, t, c) => o + runs[k++].t + c);
    });
  }

  return xml;
}

// Tiap tipe punya 3 variasi (A/B/C) untuk: Latar Belakang (2 paragraf pertama;

// tabel 5.1 Permasalahan (2 baris) & 5.2 Upaya (2 baris).

const VARIAN_TIPE = [
  { key: 'ltt',    re: /Luas\s+Tambah\s+Tanam/i,                  label: 'LTT PADI' },
  { key: 'benih',  re: /Penyediaan\s+Benih|Produksi\s+Ternak/i,   label: 'BENIH & TERNAK' },
  { key: 'alsintan', re: /Alat\s*&?\s*Mesin|Alsintan/i,           label: 'ALSINTAN' },
  { key: 'rdkk',   re: /RDKK/i,                                   label: 'RDKK' },
  { key: 'irpom',  re: /Irpom|Perpompaan|Perpipaan/i,             label: 'IRPOM' },
  { key: 'kelompencapir', re: /Kelompencapir|Penderasan/i,        label: 'KELOMPENCAPIR' },

const escXml = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const fillB = (s, dst, desa) => s.split('{B}').join(dst.label || ('Bulan ' + BULAN[dst.mIdx] + ' ' + dst.year))
                                 .split('{D}').join(desa || 'Otting');

// ===== deteksi & penggantian nama desa =====
// deteksi: "Desa X" yang paling sering muncul pada teks dokumen
function detectDesa(xml){
  const freq = {};
  const text = flatText(xml);
  for(const m of text.matchAll(/\bDesa\s+([A-Z][A-Za-z-]+)/g))
    freq[m[1]] = (freq[m[1]] || 0) + 1;
  let best = null, bn = 0;
  Object.keys(freq).forEach(d => { if(freq[d] > bn){ bn = freq[d]; best = d; } });
  return best;
}

// mesin ganti teks lintas-run: Word bisa memecah kata jadi beberapa run,
// jadi pencarian dilakukan pada teks GABUNGAN per paragraf lalu hasilnya
// ditulis balik ke run (panjang isi <w:t> boleh berubah). Dipakai untuk
// nama desa, nama bulan, tahun, dan label periode triwulan.
function swapRunRegex(xml, re, to){
  const ins = escXml(to);
  return xml.replace(/<w:p[ >][\s\S]*?<\/w:p>/g, para => {
    const runs = [];
    let joined = '';
    for(const m of para.matchAll(/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>/g)){
      runs.push({ t: m[1], at: joined.length, len0: m[1].length });
      joined += m[1];
    }
    const hits = [];
    let m2; re.lastIndex = 0;
    while((m2 = re.exec(joined))){
      hits.push({ pos: m2.index, len: m2[0].length });
      if(!m2[0].length) re.lastIndex++;
    }
    if(!hits.length) return para;
    // proses dari belakang: edit terdahulu selalu di posisi lebih akhir,
    // jadi indeks (koordinat teks asli) untuk hit berikutnya tetap sahih
    hits.reverse().forEach(h => {
      const end = h.pos + h.len;
      let placed = false;
      runs.forEach(r => {
        const a = Math.max(h.pos, r.at), b = Math.min(end, r.at + r.len0);
        if(a >= b) return;
        r.t = r.t.slice(0, a - r.at) + (placed ? '' : ins) + r.t.slice(b - r.at);
        placed = true;
      });
    });
    let k = 0;
    return para.replace(/(<w:t(?:\s[^>]*)?>)([\s\S]*?)(<\/w:t>)/g,
      (a, o, t, c) => o + runs[k++].t + c);
  });
}
function swapRunText(xml, from, to){
  if(!from || !to || from === to) return xml;
  const esc = from.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return swapRunRegex(xml, new RegExp('\\b' + esc + '\\b', 'g'), to);
}
const replaceDesa = (xml, from, to) => swapRunText(xml, from, to);

// ===== TAUTAN DRIVE pada halaman lampiran =====
// Tautan tersimpan dua kali: sebagai teks yang tampil di dalam <w:hyperlink>
// dan sebagai Target relasi pada word/_rels/document.xml.rels. Keduanya harus
// diganti, kalau tidak teksnya berubah tetapi klik-nya masih ke alamat lama.
const RE_TAUTAN = /(?:https?:\/\/|www\.)[^\s<>"']+/i;
function detectTautan(xml){
  const dalamHyperlink = [];
  for(const m of xml.matchAll(/<w:hyperlink[\s\S]*?<\/w:hyperlink>/g))
    dalamHyperlink.push(unescXml(cellText(m[0])));
  const semua = dalamHyperlink.concat(paraTeks(xml));
  for(const t of semua){
    const u = t.match(RE_TAUTAN);
    if(u) return u[0].replace(/[.,;)]+$/, '');
  }
  return null;
}
function replaceTautan(xml, from, to){
  if(!from || !to || from === to) return xml;
  return swapRunRegex(xml, new RegExp(from.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), to);
}
// Target pada file .rels tersimpan sebagai atribut XML (& jadi &amp;)
function replaceTautanRels(rels, from, to){
  if(!rels || !from || !to || from === to) return rels;
  return rels.replace(/Target="([^"]*)"/g,
    (utuh, t) => unescXml(t) === from ? 'Target="' + escXml(to) + '"' : utuh);
}

// ===== LAPORAN TRIWULAN: gabung tabel harian + label periode =====
const ROMAWI = ['I', 'II', 'III', 'IV'];
const labelTriwulan = q => 'Triwulan ' + ROMAWI[q.qIdx] + ' Tahun ' + q.year;

// rentang baris <w:tr> pertama s/d terakhir yang memuat tanggal dd/mm/yyyy
function dailyRowSpan(xml){
  const re = /\d{2}\/\d{2}\/\d{4}/g;
  let first = -1, last = -1, m;
  while((m = re.exec(xml))){ if(first < 0) first = m.index; last = m.index; }
  if(first < 0) return null;
  let start = first;
  while((start = xml.lastIndexOf('<w:tr', start - 1)) >= 0){
    const c = xml[start + 5];
    if(c === ' ' || c === '>') break;
  }
  const end = xml.indexOf('</w:tr>', last);
  return (start >= 0 && end >= 0) ? { start, end: end + 7 } : null;
}

// sisipkan baris harian bulan-bulan sebelumnya (urut) di depan baris dokumen dasar
function mergeDailyRows(baseXml, otherXmls){
  const span = dailyRowSpan(baseXml);
  if(!span) return baseXml;
  let rows = '';
  otherXmls.forEach(ox => {
    const s = dailyRowSpan(ox);
    if(s) rows += ox.slice(s.start, s.end);
  });
  return rows ? baseXml.slice(0, span.start) + rows + baseXml.slice(span.start) : baseXml;
}

// ubah label periode dokumen bulanan menjadi triwulan (dokumen dasar =
// laporan bulan terakhir triwulan yang tersedia)
function transformXmlTriwulan(xml, src, q){
  const sName = BULAN[src.mIdx], SNAME = sName.toUpperCase();
  const m1 = q.qIdx * 3, m3 = m1 + 2;
  const qLast = lastDay(q.year, m3);
  const R = ROMAWI[q.qIdx];
  // judul sampul & frasa "Bulan X (Tahun)"
  xml = swapRunRegex(xml, new RegExp('BULAN\\s+' + SNAME + '\\s+' + src.year, 'g'), 'TRIWULAN ' + R + ' TAHUN ' + q.year);
  xml = swapRunRegex(xml, new RegExp('BULAN\\s+' + SNAME + '\\b', 'g'), 'TRIWULAN ' + R);
  xml = swapRunRegex(xml, new RegExp('Bulan\\s+' + sName + '\\s+' + src.year, 'g'), 'Triwulan ' + R + ' Tahun ' + q.year);
  xml = swapRunRegex(xml, new RegExp('Bulan\\s+' + sName + '\\b', 'g'), 'Triwulan ' + R);
  // waktu pelaksanaan: "01-30 Juni 2026" / "01 s/d 30 Juni 2026"
  xml = swapRunRegex(xml, new RegExp('01\\s*[-–]\\s*\\d{1,2}\\s+' + sName, 'g'),
    '01 ' + BULAN[m1] + ' - ' + qLast + ' ' + BULAN[m3]);
  xml = swapRunRegex(xml, new RegExp('01\\s+s/d\\s+\\d{1,2}\\s+' + sName, 'g'),
    '01 ' + BULAN[m1] + ' s/d ' + qLast + ' ' + BULAN[m3]);
  // tanggal tanda tangan ", 30 Juni 2026"
  xml = swapRunRegex(xml, new RegExp(',\\s*\\d{1,2}\\s+' + sName + '\\s+' + src.year, 'g'),
    ', ' + qLast + ' ' + BULAN[m3] + ' ' + q.year);
  // sisa nama bulan sumber -> bulan akhir triwulan; tahun bila berbeda
  xml = swapRunText(xml, sName, BULAN[m3]);
  xml = swapRunText(xml, SNAME, BULAN[m3].toUpperCase());
  if(src.year !== q.year) xml = swapRunText(xml, String(src.year), String(q.year));
  return xml;
}

function transformNameTriwulan(name, src, q){
  const t = 'Triwulan ' + ROMAWI[q.qIdx];
  let n = name.split(BULAN[src.mIdx]).join(t)
              .split(BULAN[src.mIdx].toUpperCase()).join(t.toUpperCase())
              .split(BULAN[src.mIdx].toLowerCase()).join(t);
  if(src.year !== q.year) n = n.split(String(src.year)).join(String(q.year));
  return n;
}

// ganti seluruh isi teks satu paragraf, format (pPr + rPr run pertama) dipertahankan
function replaceParaText(paraXml, text){
  // paragraf kosong ditulis Word sebagai tag swa-tutup <w:p .../>
  const kosong = paraXml.match(/^<w:p([^>]*?)\/>$/);
  if(kosong) return '<w:p' + kosong[1] + '><w:r><w:t xml:space="preserve">' +
    escXml(text) + '</w:t></w:r></w:p>';
  const open = (paraXml.match(/^<w:p[^>]*>/) || ['<w:p>'])[0];
  const pPr = (paraXml.match(/<w:pPr>[\s\S]*?<\/w:pPr>/) || [''])[0];
  const after = pPr ? paraXml.slice(paraXml.indexOf(pPr) + pPr.length) : paraXml.slice(open.length);
  const runRPr = (after.match(/<w:r(?:\s[^>]*)?><w:rPr>[\s\S]*?<\/w:rPr>/) || [''])[0]
    .replace(/^<w:r(?:\s[^>]*)?>/, '');
  return open + pPr + '<w:r>' + runRPr + '<w:t xml:space="preserve">' + escXml(text) + '</w:t></w:r></w:p>';
}

// terapkan satu paket variasi ke document.xml (dipanggil SEBELUM transformXml)
function applyVariant(xml, v, dst, desa){
  // --- tabel 5.1 & 5.2: ganti isi sel baris data (kolom 2-4; kolom 1 nomor) ---
  function paraList(){
    const list = [];
    for(const m of xml.matchAll(/<w:p[ >][\s\S]*?<\/w:p>/g)){
      const t = [...m[0].matchAll(/<w:t[^>]*>([\s\S]*?)<\/w:t>/g)].map(q => q[1]).join('').trim();
      list.push({ xml: m[0], at: m.index, text: t.replace(/\s+/g, ' ') });
    }
    return list;
  }
  function replaceTable(headRe, rows){
    const list = paraList();
    const h = list.find(p => headRe.test(p.text));
    if(!h) return;
    const tblStart = xml.indexOf('<w:tbl>', h.at);
    if(tblStart < 0) return;
    const tblEnd = xml.indexOf('</w:tbl>', tblStart);
    let tbl = xml.slice(tblStart, tblEnd + 8);
    let done = 0;
    for(const tr of [...tbl.matchAll(/<w:tr[ >][\s\S]*?<\/w:tr>/g)]){
      const trText = tr[0].replace(/<[^>]+>/g, '');
      if(/No\./.test(trText)) continue; // baris header
      if(done >= rows.length) break;
      const cells = [...tr[0].matchAll(/<w:tc>[\s\S]*?<\/w:tc>/g)];
      let newTr = tr[0];
      rows[done].forEach((txt, ci) => {
        const cell = cells[ci + 1];
        if(!cell) return;
        const pm = cell[0].match(/<w:p[ >][\s\S]*?<\/w:p>/);
        if(!pm) return;
        newTr = newTr.replace(cell[0], cell[0].replace(pm[0], replaceParaText(pm[0], fillB(txt, dst, desa))));
      });
      tbl = tbl.replace(tr[0], newTr);
      done++;
    }
    xml = xml.slice(0, tblStart) + tbl + xml.slice(tblEnd + 8);
  }
  replaceTable(/^5\.1\s*Permasalahan/, v.masalah);
  replaceTable(/^5\.2\s*Upaya/, v.upaya);

  // --- paragraf narasi antar-heading (in-place, jumlah paragraf tetap) ---
  function replaceBody(headRe, texts, skipFirst){
    const list = paraList();
    const hi = list.findIndex(p => headRe.test(p.text));
    if(hi < 0) return;
    const edits = [];
    let replaced = 0, skip = skipFirst || 0;
    for(let i = hi + 1; i < list.length && replaced < texts.length; i++){
      const t = list[i].text;
      if(!t) continue;
      if(/^\d+\.\s|^\d+\.\d+\s*[A-Z]|^LAMPIRAN/i.test(t)) break; // heading/lampiran berikutnya
      if(skip > 0){ skip--; continue; }
      edits.push({ at: list[i].at, len: list[i].xml.length,
        xml: replaceParaText(list[i].xml, fillB(texts[replaced], dst, desa)) });
      replaced++;
    }
    edits.sort((a, b) => b.at - a.at)
      .forEach(e => { xml = xml.slice(0, e.at) + e.xml + xml.slice(e.at + e.len); });
  }
  replaceBody(/^1\.1\s*Latar Belakang/, v.lb);
  replaceBody(/^1\.2\s*Tujuan/, v.tujuan, 1); // lewati kalimat pembuka tujuan
  replaceBody(/^4\.1\s*Kesimpulan/, v.kesimpulan);
  replaceBody(/^4\.2\s*Saran/, v.saran);
  return xml;
}

// ===== LAMPIRAN (halaman landscape): baca & tulis tabel datanya =====
// Tiap laporan punya satu section landscape berisi tabel data spesifik
// (LTT: realisasi harian, Alsintan: inventaris, Irpom: sarana, dst).
// Sebagian laporan lampirannya hanya gambar — tidak ada yang bisa diisi.
const cellsOfTr = tr => [...tr.matchAll(/<w:tc>[\s\S]*?<\/w:tc>/g)].map(m => m[0]);
const cellText = tc => [...tc.matchAll(/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>/g)]
  .map(m => m[1]).join('').replace(/\s+/g, ' ').trim();
const unescXml = t => t.replace(/&lt;/g, '<').replace(/&gt;/g, '>')
  .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');

// section landscape berakhir pada paragraf yang memuat sectPr-nya
function landscapeRange(xml){
  const sects = [...xml.matchAll(/<w:sectPr[\s\S]*?<\/w:sectPr>/g)];
  const land = sects.find(s => /w:orient="landscape"/.test(s[0]));
  if(!land) return null;
  const prev = sects.filter(s => s.index < land.index).pop();
  const endP = xml.indexOf('</w:p>', land.index);
  return { start: prev ? prev.index + prev[0].length : 0,
           end: endP >= 0 ? endP + 6 : land.index };
}

function findLampiran(xml){
  const rg = landscapeRange(xml);
  if(!rg) return null;
  const sec = xml.slice(rg.start, rg.end);
  const tm = sec.match(/<w:tbl>[\s\S]*?<\/w:tbl>/);
  if(!tm) return null;
  const trs = [...tm[0].matchAll(/<w:tr[ >][\s\S]*?<\/w:tr>/g)].map(m => m[0]);
  // baris header = baris awal bertanda tblHeader atau seluruh teksnya tebal
  let head = 0;
  while(head < trs.length && (/<w:tblHeader/.test(trs[head]) || /<w:b\/>|<w:b /.test(trs[head]))) head++;
  if(head >= trs.length) head = Math.min(1, trs.length - 1);
  const rows = trs.slice(head).map(tr => cellsOfTr(tr).map(c => unescXml(cellText(c))));
  if(!rows.length) return null;
  const cols = rows[0].length;
  // kolom tanggal dd/mm/yyyy dikelola otomatis oleh transformasi periode
  const dateCols = [];
  for(let c = 0; c < cols; c++){
    const n = rows.filter(r => /^\d{2}\/\d{2}\/\d{4}/.test(r[c] || '')).length;
    if(n && n * 2 >= rows.length) dateCols.push(c);
  }
  // label kolom: baris header terakhir, kosong -> baris header pertama
  // (kolom bergabung diuraikan lewat gridSpan agar posisinya pas)
  const expand = tr => {
    const out = [];
    cellsOfTr(tr).forEach(c => {
      const g = c.match(/<w:gridSpan w:val="(\d+)"/);
      const t = unescXml(cellText(c));
      for(let i = 0, n = g ? parseInt(g[1], 10) : 1; i < n; i++) out.push(i === 0 ? t : '');
    });
    return out;
  };
  const h1 = head ? expand(trs[0]) : [];
  const hL = head ? expand(trs[head - 1]) : [];
  const labels = [];
  for(let c = 0; c < cols; c++) labels.push(hL[c] || h1[c] || ('KOLOM ' + (c + 1)));
  // judul lampiran (paragraf "LAMPIRAN : ...") untuk ditampilkan di editor
  const jm = sec.match(/<w:p[ >][\s\S]*?<\/w:p>/g) || [];
  let judul = '';
  for(const p of jm){
    const t = cellText(p);
    if(/^LAMPIRAN\s*:/i.test(t)){ judul = unescXml(t); break; }
  }
  return { head, cols, rows, dateCols, labels, judul,
           tblStart: rg.start + tm.index, tblEnd: rg.start + tm.index + tm[0].length };
}

// ===== BACA TEKS PDF (hasil ekspor Word) =====
// Teks PDF Word tersimpan sebagai string literal pada operator Tj/TJ, jadi
// bisa dibaca tanpa pustaka besar: stream di-inflate, penggal teks dipungut
// beserta koordinatnya, lalu dirakit kembali menjadi baris.
const WINANSI = { 0x91:'‘', 0x92:'’', 0x93:'“', 0x94:'”',
  0x95:'•', 0x96:'–', 0x97:'—', 0xA0:' ', 0xB0:'°' };
// taksiran lebar huruf (kelipatan ukuran font) untuk menebak jarak antarpenggal
const LEBAR = c => {
  if('iljt.,;:\'!|[]() '.includes(c)) return 0.28;
  if('mwMW@'.includes(c)) return 0.85;
  if(c >= 'A' && c <= 'Z') return 0.66;
  return 0.5;
};
const lebarTeks = (t, uk) => { let w = 0; for(const c of t) w += LEBAR(c) * uk; return w; };

async function inflateBytes(bytes){
  for(const fmt of ['deflate', 'deflate-raw']){
    try {
      const ds = new DecompressionStream(fmt);
      const buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
      return new Uint8Array(buf);
    } catch(e){ /* coba format berikutnya */ }
  }
  return null;
}

function bacaStringPdf(s, i){
  let out = '', dalam = 1;
  i++;
  while(i < s.length && dalam > 0){
    const c = s[i];
    if(c === '\\'){
      const n = s[i + 1];
      if(n >= '0' && n <= '7'){
        let okt = '', k = i + 1;
        while(k < s.length && okt.length < 3 && s[k] >= '0' && s[k] <= '7'){ okt += s[k]; k++; }
        const kode = parseInt(okt, 8);
        out += WINANSI[kode] || (kode >= 32 && kode < 127 ? String.fromCharCode(kode) : '');
        i = k; continue;
      }
      const peta = { n:'\n', r:'\r', t:'\t', b:'', f:'', '(':'(', ')':')', '\\':'\\' };
      out += peta[n] !== undefined ? peta[n] : n;
      i += 2; continue;
    }
    if(c === '('){ dalam++; out += c; i++; continue; }
    if(c === ')'){ dalam--; if(dalam === 0){ i++; break; } out += c; i++; continue; }
    const kode = c.charCodeAt(0);
    out += kode > 127 ? (WINANSI[kode] || '') : c;
    i++;
  }
  return { teks: out, akhir: i };
}

function penggalPdf(isi){
  const keluar = [];
  let tm = [1,0,0,1,0,0], baris = [1,0,0,1,0,0], ukuran = 10, leading = 0;
  const angka = [];
  let pending = [], i = 0;
  const kirim = () => {
    const t = pending.join('');
    pending = [];
    if(t.trim()) keluar.push({ x: tm[4], y: tm[5], teks: t, uk: Math.abs(ukuran * tm[0]) || ukuran });
  };
  while(i < isi.length){
    const c = isi[i];
    if(c === '('){ const r = bacaStringPdf(isi, i); pending.push(r.teks); i = r.akhir; continue; }
    if(c === '<' && isi[i + 1] !== '<'){
      const e = isi.indexOf('>', i);
      if(e > 0){
        const hex = isi.slice(i + 1, e).replace(/\s+/g, '');
        let t = '';
        for(let k = 0; k + 1 < hex.length; k += 2){
          const kode = parseInt(hex.substr(k, 2), 16);
          t += kode >= 32 && kode < 127 ? String.fromCharCode(kode) : (WINANSI[kode] || '');
        }
        pending.push(t); i = e + 1; continue;
      }
    }
    const num = /^[-+]?[\d.]+/.exec(isi.slice(i, i + 24));
    if(num && /[\s\[]/.test(isi[i - 1] || ' ')){
      const v = parseFloat(num[0]);
      angka.push(v);
      if(pending.length && v < -120) pending.push(' ');   // geseran besar = spasi
      i += num[0].length; continue;
    }
    const op = /^(TJ|Tj|T\*|Td|TD|Tm|TL|Tf|BT|ET|'|")/.exec(isi.slice(i, i + 3));
    if(op && /[\s\]>)]/.test(isi[i - 1] || ' ')){
      const o = op[1];
      if(o === 'Tj' || o === 'TJ') kirim();
      else if(o === "'" || o === '"'){ baris = baris.slice(); baris[5] -= leading; tm = baris.slice(); kirim(); }
      else if(o === 'Tm'){ const a = angka.slice(-6); if(a.length === 6){ tm = a.slice(); baris = a.slice(); } }
      else if(o === 'Td' || o === 'TD'){
        const a = angka.slice(-2);
        if(a.length === 2){
          if(o === 'TD') leading = -a[1];
          baris = baris.slice(); baris[4] += a[0]; baris[5] += a[1];
          tm = baris.slice();
        }
      }
      else if(o === 'T*'){ baris = baris.slice(); baris[5] -= leading; tm = baris.slice(); }
      else if(o === 'TL'){ leading = angka[angka.length - 1] || 0; }
      else if(o === 'Tf'){ ukuran = angka[angka.length - 1] || 10; }
      else if(o === 'BT'){ tm = [1,0,0,1,0,0]; baris = tm.slice(); }
      angka.length = 0;
      i += o.length; continue;
    }
    i++;
  }
  return keluar;
}

function rakitBarisPdf(penggal){
  const grup = [];
  penggal.forEach(p => {
    const g = grup.find(q => Math.abs(q.y - p.y) < 3.5);
    if(g) g.item.push(p); else grup.push({ y: p.y, item: [p] });
  });
  grup.sort((a, b) => b.y - a.y);
  return grup.map(g => {
    g.item.sort((a, b) => a.x - b.x);
    let out = '', akhirX = null;
    g.item.forEach(p => {
      if(akhirX !== null && p.x - akhirX > p.uk * 0.16 && !/\s$/.test(out) && !/^\s/.test(p.teks)) out += ' ';
      out += p.teks;
      akhirX = p.x + lebarTeks(p.teks, p.uk);
    });
    return out.replace(/\s+/g, ' ').trim();
  }).filter(t => t);
}

// PDF -> array baris teks
async function pdfBaris(arrayBuffer){
  const b = new Uint8Array(arrayBuffer);
  let raw = '';
  for(let i = 0; i < b.length; i += 32768)
    raw += String.fromCharCode.apply(null, b.subarray(i, Math.min(i + 32768, b.length)));
  // batas objek diambil dari awal objek berikutnya — data biner bisa saja
  // memuat kata "endobj" sehingga pencarian penanda tidak selalu aman
  const kepala = [];
  const reObj = /(\d+)\s+0\s+obj\b/g;
  let m;
  while((m = reObj.exec(raw))) kepala.push({ no: parseInt(m[1], 10), awal: m.index, bodi: m.index + m[0].length });
  const objek = kepala.map((k, i) => ({ no: k.no,
    isi: raw.slice(k.bodi, i + 1 < kepala.length ? kepala[i + 1].awal : raw.length) }));
  objek.sort((a, b2) => a.no - b2.no);
  const baris = [];
  for(const o of objek){
    const i = o.isi.indexOf('stream');
    if(i < 0) continue;
    const dict = o.isi.slice(0, i);
    if(/\/Subtype\s*\/Image|\/DCTDecode|\/Type\s*\/(Font|XRef|ObjStm|Metadata)/.test(dict)) continue;
    let j = i + 6;
    if(o.isi[j] === '\r') j++;
    if(o.isi[j] === '\n') j++;
    // panjang tepat dari /Length; DecompressionStream menolak sisa byte di
    // belakang, jadi penanda endstream saja tidak cukup (ada \r\n penutup)
    const len = (dict.match(/\/Length\s+(\d+)(?!\s+\d+\s+R)/) || [])[1];
    let e;
    if(len){
      e = j + parseInt(len, 10);
    } else {
      e = o.isi.indexOf('endstream', j);
      if(e < 0) continue;
      while(e > j && (o.isi[e - 1] === '\n' || o.isi[e - 1] === '\r')) e--;
    }
    const mentah = o.isi.slice(j, e);
    const bytes = new Uint8Array(mentah.length);
    for(let k = 0; k < mentah.length; k++) bytes[k] = mentah.charCodeAt(k) & 255;
    const keluar = await inflateBytes(bytes);
    if(!keluar) continue;
    let teks = '';
    for(let k = 0; k < keluar.length; k += 32768)
      teks += String.fromCharCode.apply(null, keluar.subarray(k, Math.min(k + 32768, keluar.length)));
    if(!/\bBT\b/.test(teks) || !(/\bTJ\b/.test(teks) || /\bTj\b/.test(teks))) continue;
    baris.push(...rakitBarisPdf(penggalPdf(teks)));
  }
  return baris;
}

// ===== IMPOR LAPORAN DISEMINASI =====
// Laporan Diseminasi Informasi berisi blok berulang "LAPORAN KEGIATAN
// DISEMINASI INFORMASI PERTANIAN" — satu blok satu kegiatan. Isinya dipanen
// menjadi baris tabel rincian pada Laporan Pelaksanaan Tugas & Fungsi.
const paraTeks = xml => [...xml.matchAll(/<w:p[ >][\s\S]*?<\/w:p>/g)]
  .map(m => unescXml([...m[0].matchAll(/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>/g)]
    .map(q => q[1]).join('')).replace(/\s+/g, ' ').trim())
  .filter(t => t);

// tabel rincian diseminasi dikenali dari judul kolomnya, bukan nama file
function isTabelDiseminasi(labels){
  const ada = re => labels.some(l => re.test(l));
  return ada(/materi/i) && ada(/metode/i) && ada(/peserta/i);
}

// menerima baris teks (paragraf .docx atau baris hasil baca PDF)
function parseDiseminasi(paras){
  if(typeof paras === 'string') paras = paraTeks(paras);
  const awal = [];
  paras.forEach((t, i) => { if(/^LAPORAN KEGIATAN DISEMINASI/i.test(t)) awal.push(i); });
  if(!awal.length) return [];
  // label pada PDF berawalan nomor/huruf ("3. Materi Diseminasi : ...")
  const NOMOR = '(?:\\d+\\.\\s*|[a-z]\\.\\s*)?';
  const ambil = (blok, label) => {
    const re = new RegExp('^' + NOMOR + label + '\\s*:\\s*', 'i');
    for(const t of blok) if(re.test(t)) return t.replace(re, '').trim();
    return '';
  };
  // baris penutup blok: "Pitu Riawa, 8 Juni 2026" / "Mengetahui," / "NIP. ..."
  const penutup = t => /^[A-Za-z .'-]+,\s*\d{1,2}\s+\S+\s+\d{4}$/.test(t) ||
    /^(Mengetahui|Koordinator|NIP\.)/i.test(t);
  const reHasil = new RegExp('^' + NOMOR + 'Hasil Kegiatan\\s*:\\s*', 'i');
  const hasilDari = blok => {
    let i = blok.findIndex(t => reHasil.test(t));
    if(i < 0) return '';
    const masalah = [], solusi = [];
    let mode = null;
    const potong = (t, re, bak) => { const r = t.replace(re, '').trim(); if(r) bak.push(r); };
    for(let k = i; k < blok.length; k++){
      let t = blok[k];
      if(k === i) t = t.replace(reHasil, '').trim();
      if(!t) continue;
      if(penutup(t)) break;
      if(/^Masalah\s*:/i.test(t)){ mode = 'm'; potong(t, /^Masalah\s*:\s*/i, masalah); continue; }
      if(/^Solusi\s*:/i.test(t)){ mode = 's'; potong(t, /^Solusi\s*:\s*/i, solusi); continue; }
      (mode === 's' ? solusi : masalah).push(t);
    }
    const gab = a => a.join(' ').replace(/\s+/g, ' ').trim();
    const m = gab(masalah), s = gab(solusi);
    return (m ? 'Masalah: ' + m : '') + (s ? (m ? ' ' : '') + 'Solusi: ' + s : '');
  };
  return awal.map((mulai, idx) => {
    const blok = paras.slice(mulai, awal[idx + 1] !== undefined ? awal[idx + 1] : paras.length);
    return {
      tanggal: ambil(blok, 'Waktu Pelaksanaan').replace(/^[A-Za-z]+,\s*/, '').trim(),
      materi: ambil(blok, 'Materi Diseminasi') || ambil(blok, 'Materi'),
      lokasi: ambil(blok, 'Tempat/Lokasi') || ambil(blok, 'Lokasi'),
      metode: ambil(blok, 'Metode'),
      peserta: ambil(blok, 'Peserta'),
      hasil: hasilDari(blok)
    };
  }).filter(k => k.materi || k.tanggal);
}

// ===== IMPOR TABEL UMUM (untuk lampiran laporan lain) =====
// .docx: tabel pertama yang berisi data; .xlsx: lembar pertama; .csv: teks.
function tabelDariDocx(xml){
  for(const t of xml.matchAll(/<w:tbl>[\s\S]*?<\/w:tbl>/g)){
    const trs = [...t[0].matchAll(/<w:tr[ >][\s\S]*?<\/w:tr>/g)].map(m => m[0]);
    if(trs.length < 2) continue;
    const rows = trs.map(tr => cellsOfTr(tr).map(c => unescXml(cellText(c))));
    if(rows.some(r => r.some(v => v))) return rows;
  }
  return null;
}

const kolomXlsx = ref => {                       // "BC12" -> indeks 0-based
  const h = (ref.match(/^[A-Z]+/) || ['A'])[0];
  let n = 0;
  for(const c of h) n = n * 26 + (c.charCodeAt(0) - 64);
  return n - 1;
};
async function tabelDariXlsx(zip){
  const shared = [];
  const ss = zip.file('xl/sharedStrings.xml');
  if(ss){
    const x = await ss.async('string');
    for(const si of x.matchAll(/<si>([\s\S]*?)<\/si>/g))
      shared.push(unescXml([...si[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(q => q[1]).join('')));
  }
  const nama = Object.keys(zip.files).filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort();
  if(!nama.length) return null;
  const sheet = await zip.file(nama[0]).async('string');
  const rows = [];
  for(const row of sheet.matchAll(/<row[^>]*>([\s\S]*?)<\/row>/g)){
    const sel = [];
    for(const c of row[1].matchAll(/<c([^>]*)>([\s\S]*?)<\/c>/g)){
      const ref = (c[1].match(/r="([A-Z]+\d+)"/) || [])[1];
      const tipe = (c[1].match(/t="([^"]+)"/) || [])[1];
      const v = (c[2].match(/<v>([\s\S]*?)<\/v>/) || [])[1];
      const isT = (c[2].match(/<t[^>]*>([\s\S]*?)<\/t>/) || [])[1];
      let teks = isT !== undefined ? unescXml(isT) : (v === undefined ? '' : v);
      if(tipe === 's' && v !== undefined) teks = shared[parseInt(v, 10)] || '';
      sel[ref ? kolomXlsx(ref) : sel.length] = teks;
    }
    for(let i = 0; i < sel.length; i++) if(sel[i] === undefined) sel[i] = '';
    rows.push(sel);
  }
  return rows.filter(r => r.some(v => String(v).trim())).length ? rows : null;
}

function tabelDariCsv(teks){
  const rows = [];
  let sel = '', baris = [], kutip = false;
  const pemisah = (teks.split('\n')[0].split(';').length > teks.split('\n')[0].split(',').length) ? ';' : ',';
  for(let i = 0; i < teks.length; i++){
    const c = teks[i];
    if(kutip){
      if(c === '"' && teks[i + 1] === '"'){ sel += '"'; i++; }
      else if(c === '"') kutip = false;
      else sel += c;
      continue;
    }
    if(c === '"'){ kutip = true; continue; }
    if(c === pemisah){ baris.push(sel); sel = ''; continue; }
    if(c === '\n'){ baris.push(sel); rows.push(baris); baris = []; sel = ''; continue; }
    if(c !== '\r') sel += c;
  }
  if(sel || baris.length){ baris.push(sel); rows.push(baris); }
  return rows.map(r => r.map(v => v.trim())).filter(r => r.some(v => v));
}

// samakan kolom sumber dengan kolom tabel tujuan lewat kemiripan judulnya
function petakanTabel(rows, labels){
  const bersih = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const kepala = rows[0].map(bersih);
  const punyaKepala = kepala.filter(h => h && /[a-z]/.test(h)).length >= Math.max(2, Math.floor(labels.length / 2));
  const data = punyaKepala ? rows.slice(1) : rows;
  const peta = labels.map((l, li) => {
    if(!punyaKepala) return li;                       // tanpa judul: ikut urutan
    const t = bersih(l);
    let idx = kepala.findIndex(h => h && (h === t));
    if(idx < 0) idx = kepala.findIndex(h => h && (h.includes(t) || t.includes(h)));
    if(idx < 0){
      const kata = t.split(' ').filter(w => w.length > 3);
      idx = kepala.findIndex(h => h && kata.some(w => h.includes(w)));
    }
    return idx;
  });
  return data.filter(r => r.some(v => String(v).trim())).map((r, i) => labels.map((l, li) => {
    if(/^no\.?$/i.test(l.trim()) && peta[li] < 0) return String(i + 1);
    const k = peta[li];
    return k >= 0 && r[k] !== undefined ? String(r[k]).trim() : '';
  }));
}

// susun kegiatan hasil impor mengikuti urutan & jumlah kolom tabel tujuan
function barisDiseminasi(kegiatan, labels){
  return kegiatan.map((k, i) => labels.map(l => {
    if(/^no\.?$/i.test(l.trim())) return String(i + 1);
    if(/tanggal|waktu/i.test(l)) return k.tanggal;
    if(/materi|kegiatan|uraian/i.test(l)) return k.materi;
    if(/lokasi|tempat/i.test(l)) return k.lokasi;
    if(/metode/i.test(l)) return k.metode;
    if(/peserta/i.test(l)) return k.peserta;
    if(/hasil|masalah|solusi/i.test(l)) return k.hasil;
    return '';
  }));
}

// satu pintu impor: pilih pembaca sesuai jenis berkas, hasilkan baris tabel
// yang sudah sejajar dengan kolom lampiran laporan tujuan
async function bacaBerkasLampiran(file, labels){
  const nama = file.name.toLowerCase();
  if(nama.endsWith('.pdf')){
    const baris = await pdfBaris(await file.arrayBuffer());
    if(!baris.length) throw new Error('teks PDF tidak terbaca (kemungkinan hasil pindaian/gambar) — pakai berkas Word-nya');
    const keg = parseDiseminasi(baris);
    if(keg.length) return { rows: barisDiseminasi(keg, labels), jumlah: keg.length, jenis: 'kegiatan diseminasi' };
    throw new Error('isi PDF tidak dikenali sebagai Laporan Diseminasi — untuk tabel lain pakai .docx/.xlsx/.csv');
  }
  if(nama.endsWith('.docx')){
    const zip = await JSZip.loadAsync(file);
    const doc = zip.file('word/document.xml');
    if(!doc) throw new Error('bukan dokumen Word yang sah');
    const xml = await doc.async('string');
    const keg = parseDiseminasi(xml);
    if(keg.length) return { rows: barisDiseminasi(keg, labels), jumlah: keg.length, jenis: 'kegiatan diseminasi' };
    const tabel = tabelDariDocx(xml);
    if(tabel){
      const rows = petakanTabel(tabel, labels);
      if(rows.length) return { rows, jumlah: rows.length, jenis: 'baris tabel' };
    }
    throw new Error('tidak ada tabel atau kegiatan diseminasi yang terbaca dari dokumen itu');
  }
  if(nama.endsWith('.xlsx')){
    const tabel = await tabelDariXlsx(await JSZip.loadAsync(file));
    if(!tabel) throw new Error('lembar kerja kosong atau tidak terbaca');
    const rows = petakanTabel(tabel, labels);
    if(!rows.length) throw new Error('tidak ada baris data pada lembar pertama');
    return { rows, jumlah: rows.length, jenis: 'baris tabel' };
  }
  if(nama.endsWith('.csv') || nama.endsWith('.txt')){
    const tabel = tabelDariCsv(await file.text());
    if(!tabel.length) throw new Error('berkas CSV kosong');
    const rows = petakanTabel(tabel, labels);
    if(!rows.length) throw new Error('tidak ada baris data pada CSV');
    return { rows, jumlah: rows.length, jenis: 'baris tabel' };
  }
  throw new Error('jenis berkas belum didukung — pakai .pdf, .docx, .xlsx, atau .csv');
}

// tulis teks ke satu sel (paragraf pertama dipakai, sisanya dikosongkan);
// bentuk swa-tutup dicoba lebih dulu agar tak tertelan pola paragraf biasa
function setCellText(tc, text){
  const ps = [...tc.matchAll(/<w:p[^>]*\/>|<w:p[ >][\s\S]*?<\/w:p>/g)];
  if(!ps.length) return tc;
  let out = '', last = 0;
  ps.forEach((p, i) => {
    out += tc.slice(last, p.index) + replaceParaText(p[0], i === 0 ? text : '');
    last = p.index + p[0].length;
  });
  return out + tc.slice(last);
}

// tulis data editor ke tabel lampiran (dipanggil SEBELUM transformasi tanggal)
// tabel bertanggal: jumlah baris ditentukan periode, isi ditimpa per indeks.
// tabel biasa: jumlah baris mengikuti editor (baris tambahan meniru baris terakhir)
function applyLampiran(xml, lamp){
  const f = findLampiran(xml);
  if(!f || !lamp || !lamp.rows) return xml;
  const tbl = tulisTabel(xml.slice(f.tblStart, f.tblEnd), f.head, lamp.rows, lamp.dateCols);
  return xml.slice(0, f.tblStart) + tbl + xml.slice(f.tblEnd);
}

// ===== penulis tabel & paragraf umum (dipakai integrasi diseminasi) =====
// susun ulang baris data satu tabel; baris tambahan meniru baris terakhir
function tulisTabel(tbl, head, rows, autoCols){
  const trMs = [...tbl.matchAll(/<w:tr[ >][\s\S]*?<\/w:tr>/g)];
  const trs = trMs.map(m => m[0]);
  const data = trs.slice(head);
  if(!data.length || !rows.length) return tbl;
  const auto = new Set(autoCols || []);
  const tulis = (tr, vals) => {
    const ms = [...tr.matchAll(/<w:tc>[\s\S]*?<\/w:tc>/g)];
    let out = '', last = 0;
    ms.forEach((m, i) => {
      out += tr.slice(last, m.index);
      out += (auto.has(i) || vals[i] == null) ? m[0] : setCellText(m[0], vals[i]);
      last = m.index + m[0].length;
    });
    return out + tr.slice(last);
  };
  const tpl = data[data.length - 1];
  const baru = auto.size
    ? data.map((tr, i) => rows[i] ? tulis(tr, rows[i]) : tr)
    : rows.map((vals, i) => tulis(i < data.length ? data[i] : tpl, vals));
  const from = trMs[0].index, to = trMs[trMs.length - 1].index + trs[trs.length - 1].length;
  return tbl.slice(0, from) + trs.slice(0, head).join('') + baru.join('') + tbl.slice(to);
}

// tabel pertama sesudah paragraf berjudul headRe
function tabelSetelahJudul(xml, headRe){
  for(const m of xml.matchAll(/<w:p[ >][\s\S]*?<\/w:p>/g)){
    if(!headRe.test(cellText(m[0]))) continue;
    const s = xml.indexOf('<w:tbl>', m.index);
    if(s < 0) return null;
    const e = xml.indexOf('</w:tbl>', s);
    if(e < 0) return null;
    const tbl = xml.slice(s, e + 8);
    const trs = [...tbl.matchAll(/<w:tr[ >][\s\S]*?<\/w:tr>/g)].map(q => q[0]);
    let head = 0;
    while(head < trs.length && (/<w:tblHeader/.test(trs[head]) || /<w:b\/>|<w:b /.test(trs[head]))) head++;
    // tabel bernomor pada laporan ini selalu berjudul: minimal satu baris kepala
    if(head >= trs.length || head === 0) head = Math.min(1, trs.length - 1);
    return { start: s, end: e + 8, head };
  }
  return null;
}

function gantiTabelSetelahJudul(xml, headRe, rows){
  const t = tabelSetelahJudul(xml, headRe);
  if(!t || !rows.length) return xml;
  return xml.slice(0, t.start) + tulisTabel(xml.slice(t.start, t.end), t.head, rows) + xml.slice(t.end);
}

// ganti paragraf-paragraf isi setelah satu judul (jumlah mengikuti texts)
function gantiParagrafSetelahJudul(xml, headRe, texts, skipFirst){
  const list = [];
  for(const m of xml.matchAll(/<w:p[ >][\s\S]*?<\/w:p>/g))
    list.push({ xml: m[0], at: m.index, text: cellText(m[0]) });
  const hi = list.findIndex(p => headRe.test(p.text));
  if(hi < 0) return xml;
  const edits = [];
  let ganti = 0, lewat = skipFirst || 0;
  for(let i = hi + 1; i < list.length && ganti < texts.length; i++){
    const t = list[i].text;
    if(!t) continue;
    if(/^\d+\.\s|^\d+\.\d+\s*[A-Z]|^LAMPIRAN/i.test(t)) break;
    if(lewat > 0){ lewat--; continue; }
    edits.push({ at: list[i].at, len: list[i].xml.length, xml: replaceParaText(list[i].xml, texts[ganti]) });
    ganti++;
  }
  edits.sort((a, b) => b.at - a.at)
    .forEach(e => { xml = xml.slice(0, e.at) + e.xml + xml.slice(e.at + e.len); });
  return xml;
}

// ===== INTEGRASI LAPORAN DISEMINASI KE SELURUH ISI LAPORAN =====
// Dari daftar kegiatan yang diunggah, seluruh bagian Laporan Pelaksanaan
// Tugas & Fungsi disusun ulang agar sejalan: target, capaian, kesimpulan,
// saran, permasalahan, upaya pemecahan, dan output.
function kegiatanDariBaris(rows, labels){
  const cari = re => labels.findIndex(l => re.test(l));
  const iTgl = cari(/tanggal|waktu/i), iMat = cari(/materi|kegiatan|uraian/i),
        iLok = cari(/lokasi|tempat/i), iMet = cari(/metode/i),
        iPes = cari(/peserta/i), iHas = cari(/hasil|masalah|solusi/i);
  const ambil = (r, i) => (i >= 0 && r[i] != null) ? String(r[i]).trim() : '';
  return rows.filter(r => r.some(v => String(v || '').trim())).map(r => {
    const hasil = ambil(r, iHas);
    const pm = hasil.match(/Masalah\s*:\s*([\s\S]*?)(?:\s*Solusi\s*:|$)/i);
    const ps = hasil.match(/Solusi\s*:\s*([\s\S]*)$/i);
    return { tanggal: ambil(r, iTgl), materi: ambil(r, iMat), lokasi: ambil(r, iLok),
             metode: ambil(r, iMet), peserta: ambil(r, iPes), hasil,
             masalah: pm ? pm[1].trim() : '', solusi: ps ? ps[1].trim() : '' };
  });
}

const STOP_MATERI = /\b(pendampingan|pengawalan|pelaksanaan|kegiatan|program|sosialisasi|informasi|dan|di|ke|pada)\b/g;
function kelompokKegiatan(keg){
  const kunci = m => m.toLowerCase().replace(/[^a-z0-9\s]/g, ' ')
    .replace(STOP_MATERI, ' ').replace(/\s+/g, ' ').trim();
  const grup = [];
  keg.forEach(k => {
    const kk = kunci(k.materi);
    if(!kk) return;
    const g = grup.find(q => q.kunci === kk || q.kunci.includes(kk) || kk.includes(q.kunci));
    if(g){ g.item.push(k); if(k.materi.length < g.label.length) g.label = k.materi; }
    else grup.push({ kunci: kk, label: k.materi, item: [k] });
  });
  return grup;
}

const unikRapi = a => [...new Set(a.map(s => String(s || '').trim()).filter(s => s))];
const daftarKata = a => a.length <= 1 ? (a[0] || '')
  : a.slice(0, -1).join(', ') + ' dan ' + a[a.length - 1];
const awalKecil = s => s ? s.charAt(0).toLowerCase() + s.slice(1) : s;
const kalimatPertama = s => {
  const t = String(s || '').trim();
  const m = t.match(/^[\s\S]{0,140}?[.;]/);
  return (m ? m[0] : t).replace(/[.;]\s*$/, '').trim();
};

function integrasiDiseminasi(xml, keg, labelPeriode){
  keg = keg.filter(k => k.materi || k.tanggal);
  if(!keg.length) return xml;
  const N = keg.length;
  const grup = kelompokKegiatan(keg);
  const B = labelPeriode;

  // --- 2.1 Target & 2.5 Capaian ---
  const barisTarget = [['1',
    'Kegiatan diseminasi informasi pertanian melalui kunjungan lapangan, diskusi, dan pertemuan dengan petani dan pemangku kepentingan',
    'Jumlah kegiatan diseminasi informasi pertanian terlaksana', String(N), 'Kegiatan']];
  const barisCapaian = [['1', 'Kegiatan diseminasi informasi pertanian',
    N + ' kegiatan', N + ' kegiatan', '100%', 'Terlaksana']];
  if(grup.length > 1) grup.forEach((g, i) => {
    const no = String(i + 2);
    barisTarget.push([no, g.label, 'Jumlah kegiatan ' + awalKecil(g.label) + ' terlaksana',
      String(g.item.length), 'Kegiatan']);
    barisCapaian.push([no, g.label, g.item.length + ' kegiatan', g.item.length + ' kegiatan',
      '100%', 'Terlaksana']);
  });
  xml = gantiTabelSetelahJudul(xml, /^2\.1\s*Target/i, barisTarget);
  xml = gantiTabelSetelahJudul(xml, /^2\.5\s*Capaian/i, barisCapaian);

  // --- 4.1 Kesimpulan (3 paragraf, mengikuti gaya laporan) ---
  const rincian = keg.map((k, i) => '(' + (i + 1) + ') ' + awalKecil(k.materi) +
    (k.peserta ? ' bersama ' + awalKecil(k.peserta) : '') +
    (k.lokasi ? ' di ' + k.lokasi : '')).join('; ');
  const masalahRingkas = unikRapi(keg.map(k => awalKecil(kalimatPertama(k.masalah))));
  const kesimpulan = [
    'Pelaksanaan tugas dan fungsi penyuluhan pertanian selama ' + B + ' telah terlaksana sesuai dengan rencana kerja yang ditetapkan, dengan capaian realisasi sebesar 100% untuk seluruh indikator target kegiatan diseminasi informasi pertanian,',
    'Selama ' + B + ', penyuluh pertanian telah melaksanakan ' + N + ' kegiatan diseminasi informasi pertanian yang mencakup: ' + rincian + ',',
    masalahRingkas.length
      ? 'Permasalahan utama yang ditemukan sepanjang periode ini mencakup ' + daftarKata(masalahRingkas) +
        '. Seluruh permasalahan tersebut telah direspons dengan upaya pemecahan sebagaimana diuraikan pada bagian 5.2.'
      : 'Seluruh kegiatan terlaksana tanpa hambatan berarti dan terdokumentasi pada lampiran laporan ini.'
  ];
  xml = gantiParagrafSetelahJudul(xml, /^4\.1\s*Kesimpulan/i, kesimpulan);

  // --- 4.2 Saran (2 paragraf) ---
  const solusiAda = unikRapi(keg.map(k => kalimatPertama(k.solusi)));
  const saran = [
    solusiAda.length
      ? 'Upaya ' + awalKecil(solusiAda[0]) + ' perlu terus dilanjutkan dan diintensifkan pada periode berikutnya,'
      : 'Kegiatan diseminasi informasi pertanian perlu terus dilanjutkan dan diintensifkan pada periode berikutnya,',
    'Kegiatan ' + daftarKata(grup.map(g => awalKecil(g.label))) +
      ' perlu dilanjutkan dengan penguatan koordinasi antara BPP Pitu Riawa, dinas terkait, dan kelompok tani agar pelaksanaannya lebih efektif dan datanya lebih akurat.'
  ];
  xml = gantiParagrafSetelahJudul(xml, /^4\.2\s*Saran/i, saran);

  // --- 5.1 Permasalahan & 5.2 Upaya (satu baris per kegiatan yang berkendala) ---
  const berkendala = keg.filter(k => k.masalah);
  if(berkendala.length){
    xml = gantiTabelSetelahJudul(xml, /^5\.1\s*Permasalahan/i,
      berkendala.map((k, i) => [String(i + 1), k.materi, k.masalah, '']));
    xml = gantiTabelSetelahJudul(xml, /^5\.2\s*Upaya/i,
      berkendala.map((k, i) => [String(i + 1), kalimatPertama(k.masalah), k.solusi,
        unikRapi(['Penyuluh Pertanian', k.peserta]).join(', ')]));
  }

  // --- 5.3 Output ---
  const output = [['1', 'Kegiatan diseminasi informasi terlaksana',
    'Diseminasi informasi pertanian mencakup ' + daftarKata(grup.map(g => awalKecil(g.label))),
    String(N), 'Kegiatan']];
  if(grup.length > 1) grup.forEach((g, i) => {
    const metode = unikRapi(g.item.map(k => awalKecil(k.metode)));
    const lokasi = unikRapi(g.item.map(k => k.lokasi));
    output.push([String(i + 2), g.label + ' terlaksana',
      (metode.length ? daftarKata(metode).replace(/^./, c => c.toUpperCase()) + ' ' : '') +
        awalKecil(g.label) + (lokasi.length ? ' di ' + daftarKata(lokasi) : ''),
      String(g.item.length), 'Kegiatan']);
  });
  output.push([String(output.length + 1), 'Laporan kegiatan',
    'Laporan tertulis pelaksanaan tugas dan fungsi penyuluhan pertanian ' + B + ' sesuai kaidah karya ilmiah',
    '1', 'Dokumen laporan']);
  xml = gantiTabelSetelahJudul(xml, /^5\.3\s*OUTPUT/i, output);
  return xml;
}

// ===== INTEGRASI DATA LAMPIRAN KE ISI LAPORAN (selain diseminasi) =====
// Angka pada data yang diunggah dipakai menyusun ulang target, capaian,
// kesimpulan, permasalahan, upaya, dan output laporan yang bersangkutan.
// Yang tidak terbaca dari data dibiarkan apa adanya — tidak dikarang.
function angkaId(v){
  const t = String(v == null ? '' : v).replace(/[±~]/g, '').trim();
  if(!t || /^-+$/.test(t)) return null;
  const m = t.match(/-?\d[\d.,]*/);
  if(!m) return null;
  let s = m[0].replace(/[.,]$/, '');
  if(/,\d{1,3}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');   // 1.234,56
  else s = s.replace(/[.,](?=\d{3}\b)/g, '').replace(/,/g, '.');        // 7.398
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
function fmtId(n){
  if(n == null) return '';
  const bulat = Math.abs(n - Math.round(n)) < 1e-9;
  const s = bulat ? String(Math.round(n)) : n.toFixed(2);
  const [a, b] = s.split('.');
  return a.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (b ? ',' + b : '');
}
const selIsi = v => { const t = String(v == null ? '' : v).trim(); return /^-+$/.test(t) ? '' : t; };
const kolIdx = (labels, re) => labels.findIndex(l => re.test(String(l || '')));
const daftarBatas = (a, n) => a.length <= n + 2 ? daftarKata(a)
  : a.slice(0, n).join(', ') + ', dan ' + (a.length - n) + ' lainnya';
// "±1000" -> "±1.000" (tanda kira-kira dipertahankan)
const rapiJml = raw => {
  const n = angkaId(raw);
  return n == null ? String(raw || '') : (/[±~]/.test(String(raw)) ? '±' : '') + fmtId(n);
};

// baca isi baris data satu tabel bernomor
function bacaTabelSetelahJudul(xml, headRe){
  const t = tabelSetelahJudul(xml, headRe);
  if(!t) return null;
  const tbl = xml.slice(t.start, t.end);
  return [...tbl.matchAll(/<w:tr[ >][\s\S]*?<\/w:tr>/g)].map(m => m[0]).slice(t.head)
    .map(tr => cellsOfTr(tr).map(c => unescXml(cellText(c))));
}
const barisTerisi = rows => (rows || []).filter(r => r.some(v => String(v || '').trim()));
const nomori = rows => { rows.forEach((r, i) => { r[0] = String(i + 1); }); return rows; };

// baris data menimpa baris lama yang sepadan; bila tak ada, ditambahkan
function selaraskanBaris(xml, headRe, kol, cocokRe, baris){
  const rows = barisTerisi(bacaTabelSetelahJudul(xml, headRe));
  if(!rows.length) return xml;
  const i = rows.findIndex(r => cocokRe.test(String(r[kol] || '')));
  if(i >= 0) rows[i] = baris.slice(); else rows.push(baris.slice());
  return gantiTabelSetelahJudul(xml, headRe, nomori(rows));
}

// baris temuan dari data diletakkan di awal tabel, baris lama tetap ada
function sisipBarisAwal(xml, headRe, baris){
  if(!baris.length) return xml;
  const rows = barisTerisi(bacaTabelSetelahJudul(xml, headRe));
  if(!rows.length) return xml;
  return gantiTabelSetelahJudul(xml, headRe,
    nomori(baris.map(r => r.slice()).concat(rows)));
}

// perbarui deskripsi/volume baris output yang sepadan
function selaraskanOutput(xml, spec){
  const rows = barisTerisi(bacaTabelSetelahJudul(xml, /^5\.3\s*OUTPUT/i));
  if(!rows.length) return xml;
  let ubah = false;
  spec.forEach(s => {
    const i = rows.findIndex(r => s.cocok.test(String(r[1] || '')));
    if(i < 0) return;
    if(s.jenis) rows[i][1] = s.jenis;
    if(s.deskripsi) rows[i][2] = s.deskripsi;
    if(s.volume != null) rows[i][3] = String(s.volume);
    if(s.satuan) rows[i][4] = s.satuan;
    ubah = true;
  });
  return ubah ? gantiTabelSetelahJudul(xml, /^5\.3\s*OUTPUT/i, nomori(rows)) : xml;
}

const PELAKSANA_DINAS = 'Penyuluh Pertanian, Kelompok Tani, Dinas Pertanian';

// Tiap jenis laporan meringkas tabel lampirannya sendiri menjadi bahan isi
// laporan: baris target/capaian, paragraf kesimpulan, pasangan baris
// permasalahan–upaya, dan penyesuaian output.
const RINGKAS = {
  ltt(rows, labels, B, D){
    const kat = labels.map((l, i) => ({ l: String(l).split('/')[0].trim(), i }))

      out.upaya.push(['1', 'Nihilnya realisasi tambah tanam pada periode laporan',
        'Mengidentifikasi lahan yang siap olah bersama kelompok tani, mengawal percepatan olah tanah setelah panen, serta menyusun jadwal tanam bersama agar penambahan luas tanam dapat direalisasikan pada periode berikutnya.',

function integrasiData(xml, tipeKey, lamp, B, desa){
  const R = RINGKAS[tipeKey];
  if(!R || !lamp || !lamp.rows || !lamp.rows.length) return xml;
  let d = null;
  try { d = R(lamp.rows, lamp.labels, B, desa || 'Otting'); } catch(e){ return xml; }
  if(!d) return xml;
  if(d.target) xml = selaraskanBaris(xml, /^2\.1\s*Target/i, d.target.kol, d.target.cocok, d.target.baris);
  if(d.capaian) xml = selaraskanBaris(xml, /^2\.5\s*Capaian/i, d.capaian.kol, d.capaian.cocok, d.capaian.baris);
  if(d.kesimpulan && d.kesimpulan.length) xml = gantiParagrafSetelahJudul(xml, /^4\.1\s*Kesimpulan/i, d.kesimpulan);
  if(d.saran && d.saran.length) xml = gantiParagrafSetelahJudul(xml, /^4\.2\s*Saran/i, d.saran);
  if(d.masalah && d.masalah.length && d.upaya && d.upaya.length){
    xml = sisipBarisAwal(xml, /^5\.1\s*Permasalahan/i, d.masalah);
    xml = sisipBarisAwal(xml, /^5\.2\s*Upaya/i, d.upaya);
  }
  if(d.output && d.output.length) xml = selaraskanOutput(xml, d.output);
  return xml;
}

function transformName(name, src, dst){
  let n = name.split(BULAN[src.mIdx]).join(BULAN[dst.mIdx])
              .split(BULAN[src.mIdx].toUpperCase()).join(BULAN[dst.mIdx].toUpperCase())
              .split(BULAN[src.mIdx].toLowerCase()).join(BULAN[dst.mIdx].toLowerCase());
  if(src.year !== dst.year) n = n.split(String(src.year)).join(String(dst.year));
  return n;
}

async function addFiles(fileList){
  for(const file of fileList){
    if(!/\.docx$/i.test(file.name)){ setStatus('dilewati (bukan .docx): ' + file.name, 'warn'); continue; }
    try {
      const zip = await JSZip.loadAsync(file);
      const doc = zip.file('word/document.xml');
      if(!doc){ setStatus('bukan dokumen Word yang valid: ' + file.name, 'err'); continue; }
      const xml = await doc.async('string');
      const lamp = findLampiran(xml);
      if(lamp){ lamp.asli = lamp.rows.map(r => r.slice()); lamp.edited = false; }
      files.push({ file, name: file.name, src: detectSource(xml, file.name),
        tipe: detectTipe(file.name), desa: detectDesa(xml), tautan: detectTautan(xml), lamp });
    } catch(e){
      setStatus('gagal membaca ' + file.name + ' — ' + (e.message || e), 'err');
    }
  }
  renderList();
  const det = files.find(f => f.desa);
  if(det) document.getElementById('sel-desa').placeholder = det.desa + ' (terdeteksi)';
  const tau = files.find(f => f.tautan);
  if(tau) document.getElementById('sel-link').placeholder = tau.tautan + ' (terdeteksi)';
  const ok = files.filter(f => f.src).length;
  if(ok) setStatus(ok + ' file siap digenerate.', 'ok');
}

function terapkanPeriodeDraft(lamp, per){
  const kol = lamp.dateCols[0];
  if(kol == null) return;
  const RE = /^(\d{2})\/(\d{2})\/(\d{4})(\s*\((?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\))?/;
  const harian = [], lain = [];
  draft.forEach(r => (RE.test(String(r[kol] || '')) ? harian : lain).push(r));
  if(!harian.length) return;
  const pakaiHari = RE.exec(String(harian[0][kol]))[4] != null;
  const MM = String(per.mIdx + 1).padStart(2, '0');
  const n = lastDay(per.year, per.mIdx);
  // hari tambahan dikosongkan, kecuali kolom yang isinya sama di semua hari
  // (mis. "Kegiatan: Tanam") — itu label tetap, bukan data harian
  const tetap = new Array(lamp.cols).fill('');
  for(let c = 0; c < lamp.cols; c++){
    if(c === kol) continue;
    const v = String(harian[0][c] || '');
    if(harian.every(r => String(r[c] || '') === v)) tetap[c] = v;
  }
  const baru = [];
  for(let d = 1; d <= n; d++){
    const r = harian[d - 1] ? harian[d - 1].slice() : tetap.slice();
    r[kol] = String(d).padStart(2, '0') + '/' + MM + '/' + per.year +
      (pakaiHari ? ' (' + HARI_EN[new Date(per.year, per.mIdx, d).getDay()] + ')' : '');
    baru.push(r);
  }
  draft = baru.concat(lain);
}

function bukaLampiran(i){
  const f = files[i];
  if(!f || !f.lamp) return;
  lampIdx = i;
  draft = f.lamp.rows.map(r => r.slice());
  document.getElementById('lamp-title').textContent = f.lamp.judul || 'LAMPIRAN';
  document.getElementById('lamp-sub').textContent = f.name;
  const auto = f.lamp.dateCols.length;
  const triwulan = selJenis.value === 'triwulan';
  document.getElementById('lamp-add').style.display = auto ? 'none' : '';
  // bulan kolom tanggal hanya berlaku untuk laporan bulanan; pada triwulan
  // tabelnya gabungan tiga bulan sehingga tanggalnya tidak boleh dipaksa
  const aturPeriode = !!auto && !triwulan;
  document.getElementById('lamp-periode').hidden = !aturPeriode;
  if(aturPeriode){
    const per = f.lamp.periode || periodeTarget();
    selLampBulan.value = per.mIdx;
    selLampTahun.value = per.year;
    terapkanPeriodeDraft(f.lamp, per);
  }
  const diseminasi = isTabelDiseminasi(f.lamp.labels);
  const nyambung = diseminasi || (f.tipe && RINGKAS[f.tipe.key]);
  document.getElementById('lamp-impor').hidden = false;
  document.getElementById('lamp-hint').textContent = diseminasi
    ? 'unggah Laporan Diseminasi (.pdf/.docx) — target, capaian, kesimpulan, saran, permasalahan, upaya, dan output ikut diselaraskan'
    : (auto ? (aturPeriode ? 'kolom tanggal (kuning) mengikuti bulan di samping — ubah bila tabelnya untuk bulan lain. '
                           : 'kolom tanggal (kuning) mengikuti periode target otomatis. ')
            : 'unggah data lampiran (.docx/.xlsx/.csv) atau isi manual di bawah. ') +
      (nyambung ? 'Angkanya otomatis diselaraskan ke target, capaian, kesimpulan, permasalahan, upaya, dan output.' : '');
  modal.hidden = false;   // tampilkan dulu: tinggi textarea hanya terukur
  gambarGrid();           // saat elemennya sudah punya layout
}

[selLampBulan, selLampTahun].forEach(el => el.addEventListener('change', () => {
  if(lampIdx < 0) return;
  const th = parseInt(selLampTahun.value, 10);
  if(!(th >= 2024 && th <= 2099)) return;
  terapkanPeriodeDraft(files[lampIdx].lamp, { mIdx: parseInt(selLampBulan.value, 10), year: th });
  gambarGrid();
}));
function gambarGrid(){
  const lamp = files[lampIdx].lamp;
  const auto = new Set(lamp.dateCols);
  let h = '<tr><th></th>' + lamp.labels.map(l => '<th>' + escHtml(l) + '</th>').join('') +
    (auto.size ? '' : '<th></th>') + '</tr>';
  draft.forEach((row, ri) => {
    h += '<tr><td class="rownum">' + (ri + 1) + '</td>';
    for(let c = 0; c < lamp.cols; c++){
      h += auto.has(c)
        ? '<td class="auto">' + escHtml(row[c] || '') + '</td>'
        : '<td><textarea rows="1" data-r="' + ri + '" data-c="' + c + '">' + escHtml(row[c] || '') + '</textarea></td>';
    }
    h += auto.size ? '' : '<td><button class="row-del" data-r="' + ri + '">&#10005;</button></td>';
    h += '</tr>';
  });
  grid.innerHTML = h;
  // tinggi mengikuti isi (dibatasi) supaya teks panjang tidak terpotong
  const tumbuh = t => {
    t.style.height = 'auto';
    t.style.height = Math.max(30, Math.min(t.scrollHeight + 2, 150)) + 'px';
  };
  grid.querySelectorAll('textarea').forEach(t => {
    t.addEventListener('input', () => { draft[+t.dataset.r][+t.dataset.c] = t.value; tumbuh(t); });
    tumbuh(t);
  });
  grid.querySelectorAll('.row-del').forEach(b => b.addEventListener('click', () => {
    if(draft.length <= 1) return;
    draft.splice(+b.dataset.r, 1); gambarGrid();
  }));
}
function tutupLampiran(){ modal.hidden = true; lampIdx = -1; draft = []; }

document.getElementById('lamp-add').addEventListener('click', () => {
  const lamp = files[lampIdx].lamp;
  // nomor urut otomatis bila kolom pertama berisi angka berurutan
  const baris = new Array(lamp.cols).fill('');
  if(draft.length && /^\d+$/.test(draft[draft.length - 1][0] || ''))
    baris[0] = String(parseInt(draft[draft.length - 1][0], 10) + 1);
  draft.push(baris);
  gambarGrid();
  grid.parentElement.scrollTop = grid.parentElement.scrollHeight;
});
// impor kegiatan dari file Laporan Diseminasi Informasi (.docx)
const imporFile = document.getElementById('lamp-impor-file');
document.getElementById('lamp-impor').addEventListener('click', () => imporFile.click());
imporFile.addEventListener('change', async () => {
  const file = imporFile.files[0];
  imporFile.value = '';
  if(!file) return;
  const hint = document.getElementById('lamp-hint');
  const lamp = files[lampIdx].lamp;
  try {
    hint.textContent = 'membaca ' + file.name + ' ...';
    const hasil = await bacaBerkasLampiran(file, lamp.labels);
    // tabel bertanggal: jumlah baris tetap mengikuti tanggal, isi ditimpa
    draft = lamp.dateCols.length
      ? draft.map((r, i) => hasil.rows[i]
          ? r.map((v, c) => lamp.dateCols.includes(c) ? v : (hasil.rows[i][c] || ''))
          : r)
      : hasil.rows;
    gambarGrid();
    hint.textContent = hasil.jumlah + ' ' + hasil.jenis + ' terbaca — periksa lalu tekan SIMPAN';
  } catch(e){
    hint.textContent = 'gagal: ' + (e.message || e);
  }
});
document.getElementById('lamp-reset').addEventListener('click', () => {
  const f = files[lampIdx];
  draft = f.lamp.asli.map(r => r.slice());
  f.lamp.periode = null;
  if(!document.getElementById('lamp-periode').hidden && f.src){
    selLampBulan.value = f.src.mIdx;      // kembali ke bulan dokumen asal
    selLampTahun.value = f.src.year;
  }
  gambarGrid();
});
document.getElementById('lamp-save').addEventListener('click', () => {
  const lamp = files[lampIdx].lamp;
  lamp.rows = draft.map(r => r.slice());
  if(!document.getElementById('lamp-periode').hidden){
    const th = parseInt(selLampTahun.value, 10);
    if(!(th >= 2024 && th <= 2099)){ setStatus('tahun kolom tanggal tidak valid', 'err'); return; }
    lamp.periode = { mIdx: parseInt(selLampBulan.value, 10), year: th };
  }
  lamp.edited = !!lamp.periode || JSON.stringify(lamp.rows) !== JSON.stringify(lamp.asli);
  tutupLampiran();
  renderList();
  setStatus('data lampiran disimpan.', 'ok');
});
document.getElementById('lamp-cancel').addEventListener('click', tutupLampiran);
document.getElementById('lamp-close').addEventListener('click', tutupLampiran);
modal.addEventListener('click', e => { if(e.target === modal) tutupLampiran(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !modal.hidden) tutupLampiran(); });

drop.addEventListener('click', () => input.click());
input.addEventListener('change', () => { addFiles([...input.files]); input.value = ''; });
['dragover','dragenter'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => addFiles([...e.dataTransfer.files]));

let busy = false;
btn.addEventListener('click', async () => {
  if(busy) return;
  busy = true; btn.disabled = true;
  try {
    const jenis = selJenis.value;
    const year = parseInt(selTahun.value, 10);
    if(!(year >= 2024 && year <= 2099)){ setStatus('tahun tidak valid', 'err'); return; }
    const mode = document.getElementById('sel-narasi').value;
    const desaIn = document.getElementById('sel-desa').value.trim();
    const linkIn = document.getElementById('sel-link').value.trim();
    if(linkIn && !RE_TAUTAN.test(linkIn)){
      setStatus('tautan Drive tidak valid — awali dengan https:// atau www.', 'err'); return;
    }
    const out = new JSZip();
    let done = 0, zipName;

    // ganti desa + terapkan variasi narasi pada satu document.xml
    const olahNarasi = (xml, f, dstFill) => {
      const desaFinal = desaIn || f.desa || null;
      if(desaIn && f.desa && desaIn !== f.desa) xml = replaceDesa(xml, f.desa, desaIn);
      if(mode !== 'asli' && f.tipe && VARIANTS[f.tipe.key]){
        const pilih = mode === 'acak' ? ['A','B','C'][Math.floor(Math.random() * 3)] : mode;
        xml = applyVariant(xml, VARIANTS[f.tipe.key][pilih], dstFill, desaFinal);
      }
      return xml;
    };
    // data lampiran ditulis sebelum transformasi tanggal supaya barisnya masih
    // sejajar dengan tabel yang tampil di editor
    // tundaData: tabel harian triwulan baru lengkap setelah digabung, jadi
    // perhitungan angkanya dikerjakan belakangan
    // bulan kolom tanggal ditetapkan dulu supaya jumlah barisnya cocok dengan
    // yang tampil di editor, baru datanya ditulis
    const aturTanggal = (f, tundaData) =>
      !!(f.lamp && f.lamp.edited && f.lamp.periode && f.lamp.dateCols.length && !tundaData);
    const olahLampiran = (xml, f, labelPeriode, tundaData) => {
      if(!f.lamp || !f.lamp.edited) return xml;
      if(aturTanggal(f, tundaData)) xml = setTabelHarian(xml, f.src, f.lamp.periode);
      xml = applyLampiran(xml, f.lamp);
      // laporan pelaksanaan tugas & fungsi: seluruh isinya diselaraskan
      // dengan kegiatan diseminasi yang diunggah
      if(isTabelDiseminasi(f.lamp.labels))
        xml = integrasiDiseminasi(xml, kegiatanDariBaris(f.lamp.rows, f.lamp.labels), labelPeriode);
      // laporan lain: angka pada data lampiran diselaraskan ke isi laporan
      else if(f.tipe && !tundaData)
        xml = integrasiData(xml, f.tipe.key, f.lamp, labelPeriode, desaIn || f.desa || null);
      return xml;
    };
    // tautan Drive: teks di dokumen + Target relasi harus diganti bersamaan
    const olahTautan = async (zip, xml, f) => {
      const lama = f.tautan || detectTautan(xml);
      if(!linkIn || !lama || lama === linkIn) return xml;
      const rel = zip.file('word/_rels/document.xml.rels');
      if(rel) zip.file('word/_rels/document.xml.rels',
        replaceTautanRels(await rel.async('string'), lama, linkIn));
      return replaceTautan(xml, lama, linkIn);
    };
    const bungkus = async (zip, xml, name) => {
      zip.file('word/document.xml', xml);
      const blob = await zip.generateAsync({ type: 'blob',
        compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
      out.file(name, blob);
      done++;
    };

    if(jenis === 'triwulan'){
      const q = { qIdx: parseInt(document.getElementById('sel-triwulan').value, 10), year };
      const mQ = [q.qIdx * 3, q.qIdx * 3 + 1, q.qIdx * 3 + 2];
      const cand = files.filter(f => f.src && f.src.year === q.year && mQ.includes(f.src.mIdx));
      if(!cand.length){
        setStatus('tidak ada file dari ' + BULAN[mQ[0]] + '–' + BULAN[mQ[2]] + ' ' + q.year +
          ' — masukkan 3 laporan bulanan (judul sama) dari triwulan tersebut.', 'warn');
        return;
      }
      // SATU judul saja per generate: judul berbeda tidak boleh dicampur
      // supaya isi laporan triwulan tidak teraduk antarjudul
      const judul = f => f.tipe ? f.tipe.key : f.name.toLowerCase().replace(/\.docx$/, '')
        .replace(new RegExp(BULAN.join('|'), 'gi'), '').replace(/[\d\s.\-_]+/g, ' ').trim();
      const label = f => f.tipe ? f.tipe.label : f.name;
      const juduls = [...new Set(cand.map(judul))];
      if(juduls.length > 1){
        const daftar = [...new Set(cand.map(label))].join(', ');
        setStatus('mode TRIWULAN hanya menerima laporan dengan JUDUL YANG SAMA — terdeteksi campuran: ' +
          daftar + '. Hapus judul lain, proses satu judul per generate.', 'err');
        return;
      }
      // tepat satu file per bulan, dan ketiga bulan triwulan harus lengkap
      const perBulan = {};
      cand.forEach(f => (perBulan[f.src.mIdx] = perBulan[f.src.mIdx] || []).push(f));
      const ganda = Object.keys(perBulan).filter(m => perBulan[m].length > 1);
      if(ganda.length){
        setStatus('ada lebih dari satu file untuk bulan ' +
          ganda.map(m => BULAN[m]).join(', ') + ' — sisakan satu file per bulan.', 'err');
        return;
      }
      const kurang = mQ.filter(m => !perBulan[m]);
      if(kurang.length){
        setStatus('laporan triwulan butuh 3 bulan lengkap (' + mQ.map(m => BULAN[m]).join(', ') +
          ') — belum ada: ' + kurang.map(m => BULAN[m]).join(', ') + '.', 'err');
        return;
      }
      // dokumen bulan terakhir jadi dasar; baris tabel harian dua bulan
      // sebelumnya digabungkan ke dalamnya
      const g = cand.sort((a, b) => a.src.mIdx - b.src.mIdx);
      const base = g[g.length - 1];
      setStatus('memproses triwulan: ' + base.name + ' ...');
      const zip = await JSZip.loadAsync(base.file);
      let xml = await zip.file('word/document.xml').async('string');
      const others = [];
      for(const o of g.slice(0, -1)){
        const oz = await JSZip.loadAsync(o.file);
        let ox = await oz.file('word/document.xml').async('string');
        if(desaIn && o.desa && desaIn !== o.desa) ox = replaceDesa(ox, o.desa, desaIn);
        others.push(ox);
      }
      xml = olahNarasi(xml, base, { label: labelTriwulan(q), year: q.year });
      xml = olahLampiran(xml, base, labelTriwulan(q), true); // baris masih milik bulan dasar
      xml = mergeDailyRows(xml, others);
      // tabel lampiran kini berisi tiga bulan: angka pada isi laporan dihitung
      // dari tabel gabungan agar mewakili satu triwulan penuh
      if(base.lamp && base.lamp.edited && base.tipe && !isTabelDiseminasi(base.lamp.labels)){
        const gab = findLampiran(xml);
        if(gab) xml = integrasiData(xml, base.tipe.key, gab, labelTriwulan(q), desaIn || base.desa || null);
      }
      xml = await olahTautan(zip, xml, base);
      await bungkus(zip, transformXmlTriwulan(xml, base.src, q),
        transformNameTriwulan(base.name, base.src, q));
      zipName = 'Laporan SKP Triwulan ' + ROMAWI[q.qIdx] + ' ' + q.year + '.zip';
    } else {
      const dst = { mIdx: parseInt(selBulan.value, 10), year };
      for(const f of files){
        if(!f.src) continue;
        if(f.src.mIdx === dst.mIdx && f.src.year === dst.year){
          setStatus('bulan target sama dengan bulan asal: ' + f.name, 'warn'); continue;
        }
        setStatus('memproses ' + f.name + ' ...');
        const zip = await JSZip.loadAsync(f.file);
        let xml = await zip.file('word/document.xml').async('string');
        xml = olahLampiran(olahNarasi(xml, f, dst), f, 'Bulan ' + BULAN[dst.mIdx] + ' ' + dst.year);
        xml = await olahTautan(zip, xml, f);
        await bungkus(zip, transformXml(xml, f.src, dst, aturTanggal(f)),
          transformName(f.name, f.src, dst));
      }
      zipName = 'Laporan SKP ' + BULAN[dst.mIdx] + ' ' + dst.year + '.zip';
    }

    if(!done){ setStatus('tidak ada file yang diproses.', 'warn'); return; }
    setStatus('membungkus ZIP ...');
    const zipBlob = await out.generateAsync({ type: 'blob', compression: 'DEFLATE' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(zipBlob);
    a.download = zipName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
    setStatus('✓ ' + done + ' laporan digenerate — periksa & sesuaikan angka realisasinya di Word.', 'ok');
  } catch(e){
    setStatus('gagal: ' + (e.message || e), 'err');
  } finally {
    busy = false; btn.disabled = !files.some(f => f.src);
  }
});

// dipakai pengujian otomatis
window._skp = { detectSource, transformXml, transformName, lastDay,
  detectTipe, applyVariant, VARIANTS, detectDesa, replaceDesa,
  transformXmlTriwulan, transformNameTriwulan, mergeDailyRows, dailyRowSpan, labelTriwulan,
  findLampiran, applyLampiran, landscapeRange, setCellText,
  parseDiseminasi, barisDiseminasi, isTabelDiseminasi,
  pdfBaris, tabelDariDocx, tabelDariXlsx, tabelDariCsv, petakanTabel, bacaBerkasLampiran,
  integrasiDiseminasi, kegiatanDariBaris, kelompokKegiatan, tabelSetelahJudul,
  gantiTabelSetelahJudul, gantiParagrafSetelahJudul, tulisTabel, setTabelHarian,
  integrasiData, RINGKAS, angkaId, fmtId, bacaTabelSetelahJudul, selaraskanBaris,
  sisipBarisAwal, selaraskanOutput,
  detectTautan, replaceTautan, replaceTautanRels };

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

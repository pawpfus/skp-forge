        ('Mendampingi ' + x.nama + ' dalam menindaklanjuti kendala tersebut melalui koordinasi bersama pengurus brigade, kelompok tani pemilik lahan, dan Dinas Pertanian Kabupaten Sidenreng Rappang.'),
        unikRapi(['Penyuluh Pertanian', x.ketua ? 'Ketua ' + x.nama : 'Ketua Brigade Pangan']).join(', ')]);
    });
    return out;
  }
};

function integrasiData(xml, tipeKey, lamp, B, desa){
  const R = RINGKAS[tipeKey];
  if(!R || !lamp || !lamp.rows || !lamp.rows.length) return xml;
  let d = null;
  try { d = R(lamp.rows, lamp.labels, B, desa || 'Otting'); } catch(e){ return xml; }
  if(!d) return xml;
  if(d.target) xml = selaraskanBaris(xml, /^2\.1\s*Target/i, d.target.kol, d.target.cocok, d.target.baris);
  if(d.capaian) xml = selaraskanBaris(xml, /^2\.5\s*Capaian/i, d.capaian.kol, d.capaian.cocok, d.capaian.baris);
  if(d.kesimpulan && d.kesimpulan.length) xml = gantiParagrafSetelahJudul(xml, /^4\.1\s*Kesimpulan/i, d.kesimpulan);
  if(d.saran && d.saran.length) xml = gantiParagrafSetelahJudul(xml, /^4\.2\s*Saran/i, d.saran);
  if(d.masalah && d.masalah.length && d.upaya && d.upaya.length){
    xml = sisipBarisAwal(xml, /^5\.1\s*Permasalahan/i, d.masalah);
    xml = sisipBarisAwal(xml, /^5\.2\s*Upaya/i, d.upaya);
  }
  if(d.output && d.output.length) xml = selaraskanOutput(xml, d.output);
  return xml;
}

function transformName(name, src, dst){
  let n = name.split(BULAN[src.mIdx]).join(BULAN[dst.mIdx])
              .split(BULAN[src.mIdx].toUpperCase()).join(BULAN[dst.mIdx].toUpperCase())
              .split(BULAN[src.mIdx].toLowerCase()).join(BULAN[dst.mIdx].toLowerCase());
  if(src.year !== dst.year) n = n.split(String(src.year)).join(String(dst.year));
  return n;
}

// Baris penutup "TOTAL ..." dijumlahkan ulang dari baris data di atasnya.
// Sel pertamanya kerap menggabungkan beberapa kolom sehingga jumlah selnya
// lebih sedikit — selisih itu dipakai sebagai pergeseran indeks kolom.
function perbaruiBarisTotal(rows, dateCols){
  if(rows.length < 2) return;
  const akhir = rows[rows.length - 1];
  if(!/total/i.test(String(akhir[0] || ''))) return;
  const data = rows.slice(0, -1);
  const geser = data[0].length - akhir.length;
  if(geser < 0) return;
  for(let c = 0; c < data[0].length; c++){
    if(dateCols.indexOf(c) >= 0) continue;
    const t = c - geser;
    if(t <= 0 || t >= akhir.length) continue;
    let jml = 0, ada = false;
    data.forEach(r => { const n = angkaId(r[c]); if(n !== null){ jml += n; ada = true; } });
    if(ada) akhir[t] = angka2(jml);
  }
}

// ===== GABUNG LAMPIRAN TRIWULAN =====
// Tiga laporan bulanan digabung menjadi satu laporan triwulan. Perlakuannya
// berbeda menurut watak tabelnya, mengikuti bentuk laporan triwulan yang
// sudah dipakai selama ini:
//  - tabel PERISTIWA (punya kolom tanggal) — kegiatan harian, daftar konten,
//    rincian kegiatan — barisnya disambung urut bulan;
//  - tabel INVENTARIS (alsintan, irpom, brigade, statistik) mencatat keadaan,
//    bukan kejadian, sehingga yang berlaku adalah keadaan akhir triwulan:
//    dipakai bulan terakhir yang punya datanya.
const sidikTabel = t => (t.labels || []).join('|').toLowerCase().replace(/\s+/g, ' ').trim();
const tabelPeristiwa = t => !!(t.dateCols && t.dateCols.length) ||
  (t.labels || []).some(l => /tanggal/i.test(l));
const barisTotal = r => (r || []).some(c => /^TOTAL\b/i.test(String(c || '').trim()));

// kelompokkan tabel yang sama (dikenali dari judul kolomnya) antar-bulan
function kelompokTabelBulanan(bulanan){
  const grup = [];
  bulanan.forEach((b, i) => (b.tabel || []).forEach(t => {
    const s = sidikTabel(t);
    let g = grup.find(u => u.sidik === s);
    if(!g){ g = { sidik: s, contoh: t, bulan: [] }; grup.push(g); }
    if(!g.bulan[i]) g.bulan[i] = t;
  }));
  return grup;
}

// baris hasil gabungan satu kelompok tabel
function barisTriwulan(g){
  const ada = g.bulan.filter(t => t);
  if(!ada.length) return null;
  if(!tabelPeristiwa(g.contoh)) return ada[ada.length - 1].rows.map(r => r.slice());
  // tabel peristiwa: baris data tiap bulan disambung, baris TOTAL per bulan
  // dibuang dulu lalu dipasang satu di akhir dan dihitung ulang
  let total = null;
  const rows = [];
  // tabel yang baris judulnya tidak ditebalkan membuat judul itu terbaca
  // sebagai data; tanpa penjagaan ini judulnya akan terulang tiap bulan
  const sidikBaris = r => (r || []).map(c => String(c == null ? '' : c).trim()).join('|').toLowerCase();
  const kepala = sidikBaris(g.contoh.labels);
  ada.forEach(t => t.rows.forEach(r => {
    if(barisTotal(r)){ if(!total) total = r.slice(); return; }
    if(rows.length && sidikBaris(r) === kepala) return;
    rows.push(r.slice());
  }));
  if(!rows.length) return null;
  // nomor urut ditulis ulang bila kolom pertama memang nomor
  const berNomor = /^no\.?$/i.test(String((g.contoh.labels || [])[0] || '')) &&
    rows.some(r => /^\d+$/.test(String(r[0] || '').trim()));
  if(berNomor) rows.forEach((r, i) => { r[0] = String(i + 1); });
  if(total){
    rows.push(total);
    perbaruiBarisTotal(rows, g.contoh.dateCols || []);
    // label "TOTAL BULAN INI" tidak lagi tepat untuk tiga bulan
    const i = total.findIndex(c => /^TOTAL\b/i.test(String(c || '').trim()));
    if(i >= 0) total[i] = String(total[i]).replace(/BULAN\s+INI/i, 'TRIWULAN');
  }
  return rows;
}

// tulis baris ke tabel ke-idx; dateCols sengaja kosong supaya jumlah baris
// mengikuti data gabungan, bukan jumlah baris dokumen dasar
function tulisTabelKe(xml, idx, rows){
  const f = daftarTabelData(xml)[idx];
  if(!f || !rows || !rows.length) return xml;
  const tbl = tulisTabel(xml.slice(f.tblStart, f.tblEnd), f.head, rows, []);
  return xml.slice(0, f.tblStart) + tbl + xml.slice(f.tblEnd);
}

// salin tabel utuh dari dokumen bulan lain ke halaman lampiran dokumen dasar
// (dipakai bila bulan dasar belum punya tabel itu sama sekali)
function salinTabelKeLampiran(xml, donorXml, donor){
  const tbl = donorXml.slice(donor.tblStart, donor.tblEnd);
  const titik = titikLampiran(xml);
  const judul = donor.judul ? paraJudulLampiran(donor.judul) : '';
  return xml.slice(0, titik.pos) + judul + tbl + '<w:p/>' + xml.slice(titik.pos);
}

// Rincian kegiatan diseminasi pada laporan triwulan disajikan PER BULAN —
// satu tabel berjudul "Bulan X" untuk tiap bulan, bukan satu tabel panjang.
// Tabel dokumen dasar dipakai sebagai cetakan lalu digandakan.
function tabelPerBulan(xml, idx, g, label){
  const f = daftarTabelData(xml)[idx];
  if(!f) return xml;
  const tpl = xml.slice(f.tblStart, f.tblEnd);
  const berNomor = /^no\.?$/i.test(String((g.contoh.labels || [])[0] || ''));
  let isi = '';
  g.bulan.forEach((t, i) => {
    if(!t) return;
    const rows = t.rows.filter(r => !barisTotal(r)).map(r => r.slice());
    if(!rows.length) return;
    if(berNomor) rows.forEach((r, k) => { r[0] = String(k + 1); });
    isi += paraJudulLampiran(label[i]) + tulisTabel(tpl, f.head, rows, []);
  });
  return isi ? xml.slice(0, f.tblStart) + isi + xml.slice(f.tblEnd) : xml;
}

// bulanan: [{ tabel, xml }] urut bulan, unsur terakhir = dokumen dasar
// label: judul tiap bulan ("Bulan Juli 2026", ...) untuk tabel per bulan
// memulangkan { xml, utama } — utama = tabel data pertama berisi baris
// gabungan ketiga bulan, dipakai menghitung angka pada isi laporan
function gabungLampiranTriwulan(xml, bulanan, label){
  const dasar = bulanan[bulanan.length - 1];
  let utama = null;
  kelompokTabelBulanan(bulanan).forEach(g => {
    const rows = barisTriwulan(g);
    if(!rows) return;
    let idx = (dasar.tabel || []).findIndex(t => sidikTabel(t) === g.sidik);
    if(idx < 0){
      // bulan dasar tidak punya tabel ini — tabelnya disalin dari bulan yang punya
      const iDonor = g.bulan.map((t, i) => t ? i : -1).filter(i => i >= 0).pop();
      xml = salinTabelKeLampiran(xml, bulanan[iDonor].xml, g.bulan[iDonor]);
      idx = daftarTabelData(xml).findIndex(t => sidikTabel(t) === g.sidik);
      if(idx < 0) return;
    }
    xml = (label && isTabelDiseminasi(g.contoh.labels))
      ? tabelPerBulan(xml, idx, g, label)
      : tulisTabelKe(xml, idx, rows);
    if(!utama || idx < utama.idx)
      utama = { idx, labels: g.contoh.labels, rows, dateCols: g.contoh.dateCols || [] };
  });
  return { xml, utama };
}

async function addFiles(fileList){
  for(const file of fileList){
    if(!/\.docx$/i.test(file.name)){ setStatus('dilewati (bukan .docx): ' + file.name, 'warn'); continue; }
    try {
      const zip = await JSZip.loadAsync(file);
      const doc = zip.file('word/document.xml');
      if(!doc){ setStatus('bukan dokumen Word yang valid: ' + file.name, 'err'); continue; }
      const xml = await doc.async('string');
      // semua tabel data yang boleh disunting; laporan tanpa tabel tetap
      // punya editor untuk deskripsinya saja
      const tabel = daftarTabelData(xml);
      tabel.forEach(t => { t.asli = t.rows.map(r => r.slice()); t.edited = false; });
      files.push({ file, name: file.name, src: detectSource(xml, file.name),
        tipe: detectTipe(file.name), desa: detectDesa(xml), tautan: detectTautan(xml),
        tabel, lamp: tabel[0] || null, deskripsi: '', gambar: [] });
    } catch(e){
      setStatus('gagal membaca ' + file.name + ' — ' + (e.message || e), 'err');
    }
  }
  renderList();
  const det = files.find(f => f.desa);
  if(det) document.getElementById('sel-desa').placeholder = det.desa + ' (terdeteksi)';
  const tau = files.find(f => f.tautan);
  if(tau) document.getElementById('sel-link').placeholder = tau.tautan + ' (terdeteksi)';
  const ok = files.filter(f => f.src).length;
  if(ok) setStatus(ok + ' file siap digenerate.', 'ok');
}

// baris bertanggal disusun ulang untuk bulan pilihan: isi hari yang sudah ada
// dipertahankan, hari tambahan dibiarkan kosong, baris non-tanggal (TOTAL)
// tetap di bawah
function terapkanPeriodeDraft(lamp, per){
  const kol = lamp.dateCols[0];
  if(kol == null) return;
  const RE = /^(\d{2})\/(\d{2})\/(\d{4})(\s*\((?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\))?/;
  const harian = [], lain = [];
  draft.forEach(r => (RE.test(String(r[kol] || '')) ? harian : lain).push(r));
  if(!harian.length) return;
  const pakaiHari = RE.exec(String(harian[0][kol]))[4] != null;
  const MM = String(per.mIdx + 1).padStart(2, '0');
  const n = lastDay(per.year, per.mIdx);
  // hari tambahan dikosongkan, kecuali kolom yang isinya sama di semua hari
  // (mis. "Kegiatan: Tanam") — itu label tetap, bukan data harian
  const tetap = new Array(lamp.cols).fill('');
  for(let c = 0; c < lamp.cols; c++){
    if(c === kol) continue;
    const v = String(harian[0][c] || '');
    if(harian.every(r => String(r[c] || '') === v)) tetap[c] = v;
  }
  const baru = [];
  for(let d = 1; d <= n; d++){
    const r = harian[d - 1] ? harian[d - 1].slice() : tetap.slice();
    r[kol] = String(d).padStart(2, '0') + '/' + MM + '/' + per.year +
      (pakaiHari ? ' (' + HARI_EN[new Date(per.year, per.mIdx, d).getDay()] + ')' : '');
    baru.push(r);
  }
  draft = baru.concat(lain);
}

function gambarGrid(){
  const lamp = files[lampIdx].lamp;
  if(!lamp){ grid.innerHTML = ''; return; }
  const auto = new Set(lamp.dateCols);
  let h = '<tr><th></th>' + lamp.labels.map(l => '<th>' + escHtml(l) + '</th>').join('') +
    (auto.size ? '' : '<th></th>') + '</tr>';
  draft.forEach((row, ri) => {
    h += '<tr><td class="rownum">' + (ri + 1) + '</td>';
    for(let c = 0; c < lamp.cols; c++){
      h += auto.has(c)
        ? '<td class="auto">' + escHtml(row[c] || '') + '</td>'
        : '<td><textarea rows="1" data-r="' + ri + '" data-c="' + c + '">' + escHtml(row[c] || '') + '</textarea></td>';
    }
    h += auto.size ? '' : '<td><button class="row-del" data-r="' + ri + '">&#10005;</button></td>';
    h += '</tr>';
  });
  grid.innerHTML = h;
  // tinggi mengikuti isi (dibatasi) supaya teks panjang tidak terpotong
  const tumbuh = t => {
    t.style.height = 'auto';
    t.style.height = Math.max(30, Math.min(t.scrollHeight + 2, 150)) + 'px';
  };
  grid.querySelectorAll('textarea').forEach(t => {
    t.addEventListener('input', () => { draft[+t.dataset.r][+t.dataset.c] = t.value; tumbuh(t); });
    tumbuh(t);
  });
  grid.querySelectorAll('.row-del').forEach(b => b.addEventListener('click', () => {
    if(draft.length <= 1) return;
    draft.splice(+b.dataset.r, 1); gambarGrid();
  }));
}

let busy = false;
btn.addEventListener('click', async () => {
  if(busy) return;
  busy = true; btn.disabled = true;
  try {
    const jenis = selJenis.value;
    const year = parseInt(selTahun.value, 10);
    if(!(year >= 2024 && year <= 2099)){ setStatus('tahun tidak valid', 'err'); return; }
    const mode = document.getElementById('sel-narasi').value;
    const desaIn = document.getElementById('sel-desa').value.trim();
    const linkIn = document.getElementById('sel-link').value.trim();
    if(linkIn && !RE_TAUTAN.test(linkIn)){
      setStatus('tautan Drive tidak valid — awali dengan https:// atau www.', 'err'); return;
    }
    const out = new JSZip();
    let done = 0, zipName;

    // ganti desa + terapkan variasi narasi pada satu document.xml
    const olahNarasi = (xml, f, dstFill) => {
      const desaFinal = desaIn || f.desa || null;
      if(desaIn && f.desa && desaIn !== f.desa) xml = replaceDesa(xml, f.desa, desaIn);
      if(mode !== 'asli' && f.tipe && VARIANTS[f.tipe.key]){
        const pilih = mode === 'acak' ? ['A','B','C'][Math.floor(Math.random() * 3)] : mode;
        xml = applyVariant(xml, VARIANTS[f.tipe.key][pilih], dstFill, desaFinal);
      }
      return xml;
    };
    // data lampiran ditulis sebelum transformasi tanggal supaya barisnya masih
    // sejajar dengan tabel yang tampil di editor
    // tundaData: tabel harian triwulan baru lengkap setelah digabung, jadi
    // perhitungan angkanya dikerjakan belakangan
    // bulan kolom tanggal ditetapkan dulu supaya jumlah barisnya cocok dengan
    // yang tampil di editor, baru datanya ditulis
    const tabelDiisi = f => (f.tabel || []).filter(t => t.edited);
    const aturTanggal = (f, tundaData) => !tundaData &&
      tabelDiisi(f).some(t => t.periode && t.dateCols.length);
    const olahLampiran = (xml, f, labelPeriode, tundaData) => {
      const diisi = tabelDiisi(f);
      if(!diisi.length && !f.deskripsi) return xml;
      // seluruh tabel yang disunting ditulis balik, termasuk laporan
      // statistik yang punya lebih dari satu tabel data
      diisi.forEach(t => {
        if(!tundaData && t.periode && t.dateCols.length) xml = setTabelHarian(xml, f.src, t.periode);
        xml = applyLampiran(xml, t);
      });
      const utama = diisi[0];
      if(utama){
        // laporan pelaksanaan tugas & fungsi: seluruh isinya diselaraskan
        // dengan kegiatan diseminasi yang diunggah
        if(isTabelDiseminasi(utama.labels))
          xml = integrasiDiseminasi(xml, kegiatanDariBaris(utama.rows, utama.labels), labelPeriode);
        // laporan lain: angka pada data lampiran diselaraskan ke isi laporan
        else if(f.tipe && !tundaData)
          xml = integrasiData(xml, f.tipe.key, utama, labelPeriode, desaIn || f.desa || null);
      }
      // deskripsi bebas dari editor masuk ke bagian 3 PELAKSANAAN KEGIATAN
      if(f.deskripsi && !tundaData) xml = terapkanDeskripsi(xml, f.deskripsi);
      return xml;
    };
    // tautan Drive: teks di dokumen + Target relasi harus diganti bersamaan
    const olahTautan = async (zip, xml, f) => {
      const lama = f.tautan || detectTautan(xml);
      if(!linkIn || !lama || lama === linkIn) return xml;
      const rel = zip.file('word/_rels/document.xml.rels');
      if(rel) zip.file('word/_rels/document.xml.rels',
        replaceTautanRels(await rel.async('string'), lama, linkIn));
      return replaceTautan(xml, lama, linkIn);
    };
    const bungkus = async (zip, xml, name) => {
      zip.file('word/document.xml', xml);
      const blob = await zip.generateAsync({ type: 'blob',
        compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
      out.file(name, blob);
      done++;
    };

    if(jenis === 'triwulan'){
      const q = { qIdx: parseInt(document.getElementById('sel-triwulan').value, 10), year };
      const mQ = [q.qIdx * 3, q.qIdx * 3 + 1, q.qIdx * 3 + 2];
      const cand = files.filter(f => f.src && f.src.year === q.year && mQ.includes(f.src.mIdx));
      if(!cand.length){
        setStatus('tidak ada file dari ' + BULAN[mQ[0]] + '–' + BULAN[mQ[2]] + ' ' + q.year +
          ' — masukkan 3 laporan bulanan (judul sama) dari triwulan tersebut.', 'warn');
        return;
      }
      // SATU judul saja per generate: judul berbeda tidak boleh dicampur
      // supaya isi laporan triwulan tidak teraduk antarjudul
      const judul = f => f.tipe ? f.tipe.key : f.name.toLowerCase().replace(/\.docx$/, '')
        .replace(new RegExp(BULAN.join('|'), 'gi'), '').replace(/[\d\s.\-_]+/g, ' ').trim();
      const label = f => f.tipe ? f.tipe.label : f.name;
      const juduls = [...new Set(cand.map(judul))];
      if(juduls.length > 1){
        const daftar = [...new Set(cand.map(label))].join(', ');
        setStatus('mode TRIWULAN hanya menerima laporan dengan JUDUL YANG SAMA — terdeteksi campuran: ' +
          daftar + '. Hapus judul lain, proses satu judul per generate.', 'err');
        return;
      }
      // tepat satu file per bulan, dan ketiga bulan triwulan harus lengkap
      const perBulan = {};
      cand.forEach(f => (perBulan[f.src.mIdx] = perBulan[f.src.mIdx] || []).push(f));
      const ganda = Object.keys(perBulan).filter(m => perBulan[m].length > 1);
      if(ganda.length){
        setStatus('ada lebih dari satu file untuk bulan ' +
          ganda.map(m => BULAN[m]).join(', ') + ' — sisakan satu file per bulan.', 'err');
        return;
      }
      const kurang = mQ.filter(m => !perBulan[m]);
      if(kurang.length){
        setStatus('laporan triwulan butuh 3 bulan lengkap (' + mQ.map(m => BULAN[m]).join(', ') +
          ') — belum ada: ' + kurang.map(m => BULAN[m]).join(', ') + '.', 'err');
        return;
      }
      // dokumen bulan terakhir jadi dasar; isi lampiran ketiga bulan
      // digabungkan ke dalamnya
      const g = cand.sort((a, b) => a.src.mIdx - b.src.mIdx);
      const base = g[g.length - 1];
      setStatus('membaca ' + g.length + ' laporan bulanan: ' +
        g.map(f => BULAN[f.src.mIdx]).join(', ') + ' ...');
      const zip = await JSZip.loadAsync(base.file);
      let xml = await zip.file('word/document.xml').async('string');
      // nama desa pada baris tabel bulan lain ikut diseragamkan
      const samakanDesa = (f, rows) => (!desaIn || !f.desa || desaIn === f.desa) ? rows
        : rows.map(r => r.map(c => String(c == null ? '' : c).split(f.desa).join(desaIn)));
      const bulanan = [];
      for(const o of g){
        const oz = o === base ? zip : await JSZip.loadAsync(o.file);
        let ox = o === base ? xml : await oz.file('word/document.xml').async('string');
        if(o !== base && desaIn && o.desa && desaIn !== o.desa) ox = replaceDesa(ox, o.desa, desaIn);
        bulanan.push({ xml: ox, berkas: o,
          tabel: (o.tabel || []).map(t => Object.assign({}, t, { rows: samakanDesa(o, t.rows) })) });
      }
      xml = olahNarasi(xml, base, { label: labelTriwulan(q), year: q.year });
      xml = olahLampiran(xml, base, labelTriwulan(q), true); // baris masih milik bulan dasar
      // label periode diubah lebih dulu: "Bulan September 2026" pada judul
      // dokumen menjadi "Triwulan III", dan aturan itu tidak boleh mengenai
      // judul bulan maupun tanggal pada lampiran gabungan yang menyusul
      xml = transformXmlTriwulan(xml, base.src, q);
      bulanan[bulanan.length - 1].xml = xml;
      const labelQ = g.map(f => 'Bulan ' + BULAN[f.src.mIdx] + ' ' + f.src.year);
      const hasilQ = gabungLampiranTriwulan(xml, bulanan, labelQ);
      xml = hasilQ.xml;
      // angka pada isi laporan dihitung dari baris gabungan ketiga bulan,
      // bukan dari tabel yang tampil (rincian diseminasi dipecah per bulan)
      const utamaQ = hasilQ.utama;
      if(utamaQ && base.tipe){
        if(isTabelDiseminasi(utamaQ.labels))
          xml = integrasiDiseminasi(xml, kegiatanDariBaris(utamaQ.rows, utamaQ.labels), labelTriwulan(q));
        else
          xml = integrasiData(xml, base.tipe.key, utamaQ, labelTriwulan(q), desaIn || base.desa || null);
      }
      // deskripsi & gambar lampiran ketiga bulan ikut terbawa, urut bulan
      const deskQ = g.map(f => f.deskripsi).filter(t => t).join('\n\n');
      if(deskQ) xml = terapkanDeskripsi(xml, deskQ);
      const gambarQ = g.reduce((a, f) => a.concat(f.gambar || []), []);
      xml = await olahTautan(zip, xml, base);
      await bungkus(zip, await sisipGambarLampiran(zip, xml, gambarQ),
        transformNameTriwulan(base.name, base.src, q));
      zipName = 'Laporan SKP Triwulan ' + ROMAWI[q.qIdx] + ' ' + q.year + '.zip';
    } else {
      const dst = { mIdx: parseInt(selBulan.value, 10), year };
      for(const f of files){
        if(!f.src) continue;
        if(f.src.mIdx === dst.mIdx && f.src.year === dst.year){
          setStatus('bulan target sama dengan bulan asal: ' + f.name, 'warn'); continue;
        }
        setStatus('memproses ' + f.name + ' ...');
        const zip = await JSZip.loadAsync(f.file);
        let xml = await zip.file('word/document.xml').async('string');
        xml = olahLampiran(olahNarasi(xml, f, dst), f, 'Bulan ' + BULAN[dst.mIdx] + ' ' + dst.year);
        xml = await olahTautan(zip, xml, f);
        // gambar disisipkan setelah transformasi tanggal supaya keterangannya
        // tidak ikut diubah oleh penggantian nama bulan
        await bungkus(zip, await sisipGambarLampiran(zip, transformXml(xml, f.src, dst, aturTanggal(f)), f.gambar),
          transformName(f.name, f.src, dst));
      }
      zipName = 'Laporan SKP ' + BULAN[dst.mIdx] + ' ' + dst.year + '.zip';
    }

    if(!done){ setStatus('tidak ada file yang diproses.', 'warn'); return; }
    setStatus('membungkus ZIP ...');
    const zipBlob = await out.generateAsync({ type: 'blob', compression: 'DEFLATE' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(zipBlob);
    a.download = zipName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
    setStatus('✓ ' + done + ' laporan digenerate — periksa & sesuaikan angka realisasinya di Word.', 'ok');
  } catch(e){
    setStatus('gagal: ' + (e.message || e), 'err');
  } finally {
    busy = false; btn.disabled = !files.some(f => f.src);
  }
});

  gantiTabelSetelahJudul, gantiParagrafSetelahJudul, tulisTabel, setTabelHarian,
  integrasiData, RINGKAS, angkaId, fmtId, bacaTabelSetelahJudul, selaraskanBaris,
  sisipBarisAwal, selaraskanOutput,
  detectTautan, replaceTautan, replaceTautanRels,
  narasiDariBaris, tabelDariTeks, sisipParagrafSetelahJudul, terapkanDeskripsi, RE_GAMBAR,
  barisDariBlokOcr, bacaBerkasLampiran, daftarTabelData, tabelBaku, bacaTabel,
  objekPdf, streamPdf, gambarPdf, bacaHalaman, sisipGambarLampiran, saringDerauOcr,
  ruangSect, titikLampiran, kisiGambar, keteranganGambar, siapkanGambar, ukuranGambar,
  sidikTabel, tabelPeristiwa, kelompokTabelBulanan, barisTriwulan, tulisTabelKe,
  salinTabelKeLampiran, gabungLampiranTriwulan, tabelPerBulan, perbaruiBarisTotal,
  bukuXlsx, lembarLtt, blokDesaLtt, harianLtt, tabelDariBukuLtt, barisLampiranLtt,

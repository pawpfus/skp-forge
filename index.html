const escXml = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const fillB = (s, dst, desa) => s.split('{B}').join(dst.label || ('Bulan ' + BULAN[dst.mIdx] + ' ' + dst.year))
                                 .split('{D}').join(desa || 'Otting');

// ===== deteksi & penggantian nama desa =====
// deteksi: "Desa X" yang paling sering muncul pada teks dokumen
function detectDesa(xml){
  const freq = {};
  const text = flatText(xml);
  for(const m of text.matchAll(/\bDesa\s+([A-Z][A-Za-z-]+)/g))
    freq[m[1]] = (freq[m[1]] || 0) + 1;
  let best = null, bn = 0;
  Object.keys(freq).forEach(d => { if(freq[d] > bn){ bn = freq[d]; best = d; } });
  return best;
}

// mesin ganti teks lintas-run: Word bisa memecah kata jadi beberapa run,
// jadi pencarian dilakukan pada teks GABUNGAN per paragraf lalu hasilnya
// ditulis balik ke run (panjang isi <w:t> boleh berubah). Dipakai untuk
// nama desa, nama bulan, tahun, dan label periode triwulan.
function swapRunRegex(xml, re, to){
  const ins = escXml(to);
  return xml.replace(/<w:p[ >][\s\S]*?<\/w:p>/g, para => {
    const runs = [];
    let joined = '';
    for(const m of para.matchAll(/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>/g)){
      runs.push({ t: m[1], at: joined.length, len0: m[1].length });
      joined += m[1];
    }
    const hits = [];
    let m2; re.lastIndex = 0;
    while((m2 = re.exec(joined))){
      hits.push({ pos: m2.index, len: m2[0].length });
      if(!m2[0].length) re.lastIndex++;
    }
    if(!hits.length) return para;
    // proses dari belakang: edit terdahulu selalu di posisi lebih akhir,
    // jadi indeks (koordinat teks asli) untuk hit berikutnya tetap sahih
    hits.reverse().forEach(h => {
      const end = h.pos + h.len;
      let placed = false;
      runs.forEach(r => {
        const a = Math.max(h.pos, r.at), b = Math.min(end, r.at + r.len0);
        if(a >= b) return;
        r.t = r.t.slice(0, a - r.at) + (placed ? '' : ins) + r.t.slice(b - r.at);
        placed = true;
      });
    });
    let k = 0;
    return para.replace(/(<w:t(?:\s[^>]*)?>)([\s\S]*?)(<\/w:t>)/g,
      (a, o, t, c) => o + runs[k++].t + c);
  });
}
function swapRunText(xml, from, to){
  if(!from || !to || from === to) return xml;
  const esc = from.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return swapRunRegex(xml, new RegExp('\\b' + esc + '\\b', 'g'), to);
}
const replaceDesa = (xml, from, to) => swapRunText(xml, from, to);

// ===== TAUTAN DRIVE pada halaman lampiran =====
// Tautan tersimpan dua kali: sebagai teks yang tampil di dalam <w:hyperlink>
// dan sebagai Target relasi pada word/_rels/document.xml.rels. Keduanya harus
// diganti, kalau tidak teksnya berubah tetapi klik-nya masih ke alamat lama.
const RE_TAUTAN = /(?:https?:\/\/|www\.)[^\s<>"']+/i;
function detectTautan(xml){
  const dalamHyperlink = [];
  for(const m of xml.matchAll(/<w:hyperlink[\s\S]*?<\/w:hyperlink>/g))
    dalamHyperlink.push(unescXml(cellText(m[0])));
  const semua = dalamHyperlink.concat(paraTeks(xml));
  for(const t of semua){
    const u = t.match(RE_TAUTAN);
    if(u) return u[0].replace(/[.,;)]+$/, '');
  }
  return null;
}
function replaceTautan(xml, from, to){
  if(!from || !to || from === to) return xml;
  return swapRunRegex(xml, new RegExp(from.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), to);
}
// Target pada file .rels tersimpan sebagai atribut XML (& jadi &amp;)
function replaceTautanRels(rels, from, to){
  if(!rels || !from || !to || from === to) return rels;
  return rels.replace(/Target="([^"]*)"/g,
    (utuh, t) => unescXml(t) === from ? 'Target="' + escXml(to) + '"' : utuh);
}

// ===== LAPORAN TRIWULAN: label periode =====
// (penggabungan isi lampiran ada di gabungLampiranTriwulan, di bawah)
const ROMAWI = ['I', 'II', 'III', 'IV'];
const labelTriwulan = q => 'Triwulan ' + ROMAWI[q.qIdx] + ' Tahun ' + q.year;

// ubah label periode dokumen bulanan menjadi triwulan (dokumen dasar =
// laporan bulan terakhir triwulan yang tersedia)
function transformXmlTriwulan(xml, src, q){
  const sName = BULAN[src.mIdx], SNAME = sName.toUpperCase();
  const m1 = q.qIdx * 3, m3 = m1 + 2;
  const qLast = lastDay(q.year, m3);
  const R = ROMAWI[q.qIdx];
  // judul sampul & frasa "Bulan X (Tahun)"
  xml = swapRunRegex(xml, new RegExp('BULAN\\s+' + SNAME + '\\s+' + src.year, 'g'), 'TRIWULAN ' + R + ' TAHUN ' + q.year);
  xml = swapRunRegex(xml, new RegExp('BULAN\\s+' + SNAME + '\\b', 'g'), 'TRIWULAN ' + R);
  xml = swapRunRegex(xml, new RegExp('Bulan\\s+' + sName + '\\s+' + src.year, 'g'), 'Triwulan ' + R + ' Tahun ' + q.year);
  xml = swapRunRegex(xml, new RegExp('Bulan\\s+' + sName + '\\b', 'g'), 'Triwulan ' + R);
  // waktu pelaksanaan: "01-30 Juni 2026" / "01 s/d 30 Juni 2026"
  xml = swapRunRegex(xml, new RegExp('01\\s*[-–]\\s*\\d{1,2}\\s+' + sName, 'g'),
    '01 ' + BULAN[m1] + ' - ' + qLast + ' ' + BULAN[m3]);
  xml = swapRunRegex(xml, new RegExp('01\\s+s/d\\s+\\d{1,2}\\s+' + sName, 'g'),
    '01 ' + BULAN[m1] + ' s/d ' + qLast + ' ' + BULAN[m3]);
  // tanggal tanda tangan ", 30 Juni 2026"
  xml = swapRunRegex(xml, new RegExp(',\\s*\\d{1,2}\\s+' + sName + '\\s+' + src.year, 'g'),
    ', ' + qLast + ' ' + BULAN[m3] + ' ' + q.year);
  // sisa nama bulan sumber -> bulan akhir triwulan; tahun bila berbeda
  xml = swapRunText(xml, sName, BULAN[m3]);
  xml = swapRunText(xml, SNAME, BULAN[m3].toUpperCase());
  if(src.year !== q.year) xml = swapRunText(xml, String(src.year), String(q.year));
  return xml;
}

function transformNameTriwulan(name, src, q){
  const t = 'Triwulan ' + ROMAWI[q.qIdx];
  let n = name.split(BULAN[src.mIdx]).join(t)
              .split(BULAN[src.mIdx].toUpperCase()).join(t.toUpperCase())
              .split(BULAN[src.mIdx].toLowerCase()).join(t);
  if(src.year !== q.year) n = n.split(String(src.year)).join(String(q.year));
  return n;
}

// ganti seluruh isi teks satu paragraf, format (pPr + rPr run pertama) dipertahankan
function replaceParaText(paraXml, text){
  // paragraf kosong ditulis Word sebagai tag swa-tutup <w:p .../>
  const kosong = paraXml.match(/^<w:p([^>]*?)\/>$/);
  if(kosong) return '<w:p' + kosong[1] + '><w:r><w:t xml:space="preserve">' +
    escXml(text) + '</w:t></w:r></w:p>';
  const open = (paraXml.match(/^<w:p[^>]*>/) || ['<w:p>'])[0];
  const pPr = (paraXml.match(/<w:pPr>[\s\S]*?<\/w:pPr>/) || [''])[0];
  const after = pPr ? paraXml.slice(paraXml.indexOf(pPr) + pPr.length) : paraXml.slice(open.length);
  const runRPr = (after.match(/<w:r(?:\s[^>]*)?><w:rPr>[\s\S]*?<\/w:rPr>/) || [''])[0]
    .replace(/^<w:r(?:\s[^>]*)?>/, '');
  return open + pPr + '<w:r>' + runRPr + '<w:t xml:space="preserve">' + escXml(text) + '</w:t></w:r></w:p>';
}

// terapkan satu paket variasi ke document.xml (dipanggil SEBELUM transformXml)
function applyVariant(xml, v, dst, desa){
  // --- tabel 5.1 & 5.2: ganti isi sel baris data (kolom 2-4; kolom 1 nomor) ---
  function paraList(){
    const list = [];
    for(const m of xml.matchAll(/<w:p[ >][\s\S]*?<\/w:p>/g)){
      const t = [...m[0].matchAll(/<w:t[^>]*>([\s\S]*?)<\/w:t>/g)].map(q => q[1]).join('').trim();
      list.push({ xml: m[0], at: m.index, text: t.replace(/\s+/g, ' ') });
    }
    return list;
  }
  function replaceTable(headRe, rows){
    const list = paraList();
    const h = list.find(p => headRe.test(p.text));
    if(!h) return;
    const tblStart = xml.indexOf('<w:tbl>', h.at);
    if(tblStart < 0) return;
    const tblEnd = xml.indexOf('</w:tbl>', tblStart);
    let tbl = xml.slice(tblStart, tblEnd + 8);
    let done = 0;
    for(const tr of [...tbl.matchAll(/<w:tr[ >][\s\S]*?<\/w:tr>/g)]){
      const trText = tr[0].replace(/<[^>]+>/g, '');
      if(/No\./.test(trText)) continue; // baris header
      if(done >= rows.length) break;
      const cells = [...tr[0].matchAll(/<w:tc>[\s\S]*?<\/w:tc>/g)];
      let newTr = tr[0];
      rows[done].forEach((txt, ci) => {
        const cell = cells[ci + 1];
        if(!cell) return;
        const pm = cell[0].match(/<w:p[ >][\s\S]*?<\/w:p>/);
        if(!pm) return;
        newTr = newTr.replace(cell[0], cell[0].replace(pm[0], replaceParaText(pm[0], fillB(txt, dst, desa))));
      });
      tbl = tbl.replace(tr[0], newTr);
      done++;
    }
    xml = xml.slice(0, tblStart) + tbl + xml.slice(tblEnd + 8);
  }
  replaceTable(/^5\.1\s*Permasalahan/, v.masalah);
  replaceTable(/^5\.2\s*Upaya/, v.upaya);

  // --- paragraf narasi antar-heading (in-place, jumlah paragraf tetap) ---
  function replaceBody(headRe, texts, skipFirst){
    const list = paraList();
    const hi = list.findIndex(p => headRe.test(p.text));
    if(hi < 0) return;
    const edits = [];
    let replaced = 0, skip = skipFirst || 0;
    for(let i = hi + 1; i < list.length && replaced < texts.length; i++){
      const t = list[i].text;
      if(!t) continue;
      if(/^\d+\.\s|^\d+\.\d+\s*[A-Z]|^LAMPIRAN/i.test(t)) break; // heading/lampiran berikutnya
      if(skip > 0){ skip--; continue; }
      edits.push({ at: list[i].at, len: list[i].xml.length,
        xml: replaceParaText(list[i].xml, fillB(texts[replaced], dst, desa)) });
      replaced++;
    }
    edits.sort((a, b) => b.at - a.at)
      .forEach(e => { xml = xml.slice(0, e.at) + e.xml + xml.slice(e.at + e.len); });
  }
  replaceBody(/^1\.1\s*Latar Belakang/, v.lb);
  replaceBody(/^1\.2\s*Tujuan/, v.tujuan, 1); // lewati kalimat pembuka tujuan
  replaceBody(/^4\.1\s*Kesimpulan/, v.kesimpulan);
  replaceBody(/^4\.2\s*Saran/, v.saran);
  return xml;
}

// ===== LAMPIRAN (halaman landscape): baca & tulis tabel datanya =====
// Tiap laporan punya satu section landscape berisi tabel data spesifik
// (LTT: realisasi harian, Alsintan: inventaris, Irpom: sarana, dst).
// Sebagian laporan lampirannya hanya gambar — tidak ada yang bisa diisi.
const cellsOfTr = tr => [...tr.matchAll(/<w:tc>[\s\S]*?<\/w:tc>/g)].map(m => m[0]);
const cellText = tc => [...tc.matchAll(/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>/g)]
  .map(m => m[1]).join('').replace(/\s+/g, ' ').trim();
const unescXml = t => t.replace(/&lt;/g, '<').replace(/&gt;/g, '>')
  .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');

// section landscape berakhir pada paragraf yang memuat sectPr-nya
function landscapeRange(xml){
  const sects = [...xml.matchAll(/<w:sectPr[\s\S]*?<\/w:sectPr>/g)];
  const land = sects.find(s => /w:orient="landscape"/.test(s[0]));
  if(!land) return null;
  const prev = sects.filter(s => s.index < land.index).pop();
  const endP = xml.indexOf('</w:p>', land.index);
  return { start: prev ? prev.index + prev[0].length : 0,
           end: endP >= 0 ? endP + 6 : land.index };
}

// Tabel baku laporan (2.1 Target, 2.5 Capaian, 5.1, 5.2, 5.3) dikenali dari
// judul kolomnya, bukan dari urutannya — tabel itu diisi oleh integrasi data,
// bukan oleh pengguna, jadi tidak ditawarkan di editor lampiran.
function tabelBaku(labels){
  const t = (labels || []).join(' | ');
  return /Indikator Target/i.test(t) || /Capaian\s*\(\s*%\s*\)/i.test(t) ||
         (/\bAspek\b/i.test(t) && /Dampak/i.test(t)) ||
         /Upaya Pemecahan/i.test(t) || /Jenis Output/i.test(t);
}

// Semua tabel data yang boleh disunting: tabel pada halaman lampiran
// (landscape) didahulukan, disusul tabel data pada badan laporan — laporan
// statistik menaruh datanya di situ, bukan di halaman lampiran.
function daftarTabelData(xml){
  const rg = landscapeRange(xml);
  const hasil = [];
  for(const m of xml.matchAll(/<w:tbl>[\s\S]*?<\/w:tbl>/g)){
    const o = bacaTabel(xml, m.index, m.index + m[0].length);
    if(!o || tabelBaku(o.labels)) continue;
    o.landscape = !!(rg && m.index >= rg.start && m.index < rg.end);
    hasil.push(o);
  }
  hasil.sort((p, q) => (q.landscape ? 1 : 0) - (p.landscape ? 1 : 0));
  hasil.forEach((o, i) => { o.idx = i; });
  return hasil;
}
function findLampiran(xml){ return daftarTabelData(xml)[0] || null; }

function bacaTabel(xml, tblStart, tblEnd){
  const isi = xml.slice(tblStart, tblEnd);
  const trs = [...isi.matchAll(/<w:tr[ >][\s\S]*?<\/w:tr>/g)].map(m => m[0]);
  // baris header = baris awal bertanda tblHeader atau seluruh teksnya tebal
  let head = 0;
  while(head < trs.length && (/<w:tblHeader/.test(trs[head]) || /<w:b\/>|<w:b /.test(trs[head]))) head++;
  if(head >= trs.length) head = Math.min(1, trs.length - 1);
  const rows = trs.slice(head).map(tr => cellsOfTr(tr).map(c => unescXml(cellText(c))));
  if(!rows.length) return null;
  const cols = rows[0].length;
  // kolom tanggal dd/mm/yyyy dikelola otomatis oleh transformasi periode
  const dateCols = [];
  for(let c = 0; c < cols; c++){
    const n = rows.filter(r => /^\d{2}\/\d{2}\/\d{4}/.test(r[c] || '')).length;
    if(n && n * 2 >= rows.length) dateCols.push(c);
  }
  // label kolom: baris header terakhir, kosong -> baris header pertama
  // (kolom bergabung diuraikan lewat gridSpan agar posisinya pas)
  const expand = tr => {
    const out = [];
    cellsOfTr(tr).forEach(c => {
      const g = c.match(/<w:gridSpan w:val="(\d+)"/);
      const t = unescXml(cellText(c));
      for(let i = 0, n = g ? parseInt(g[1], 10) : 1; i < n; i++) out.push(i === 0 ? t : '');
    });
    return out;
  };
  const h1 = head ? expand(trs[0]) : [];
  const hL = head ? expand(trs[head - 1]) : [];
  const labels = [];
  for(let c = 0; c < cols; c++) labels.push(hL[c] || h1[c] || ('KOLOM ' + (c + 1)));
  // judul: paragraf berisi teks terakhir sebelum tabel ("LAMPIRAN : ..." pada
  // halaman lampiran, atau judul sub-bagian pada laporan statistik)
  let judul = '';
  for(const p of xml.slice(0, tblStart).matchAll(/<w:p[ >][\s\S]*?<\/w:p>/g)){
    const t = unescXml(cellText(p[0])).trim();
    if(t) judul = t;
  }
  return { head, cols, rows, dateCols, labels, judul, tblStart, tblEnd };
}

// ===== BACA TEKS PDF (hasil ekspor Word) =====
// Teks PDF Word tersimpan sebagai string literal pada operator Tj/TJ, jadi
// bisa dibaca tanpa pustaka besar: stream di-inflate, penggal teks dipungut
// beserta koordinatnya, lalu dirakit kembali menjadi baris.
const WINANSI = { 0x91:'‘', 0x92:'’', 0x93:'“', 0x94:'”',
  0x95:'•', 0x96:'–', 0x97:'—', 0xA0:' ', 0xB0:'°' };
// taksiran lebar huruf (kelipatan ukuran font) untuk menebak jarak antarpenggal
const LEBAR = c => {
  if('iljt.,;:\'!|[]() '.includes(c)) return 0.28;
  if('mwMW@'.includes(c)) return 0.85;
  if(c >= 'A' && c <= 'Z') return 0.66;
  return 0.5;
};
const lebarTeks = (t, uk) => { let w = 0; for(const c of t) w += LEBAR(c) * uk; return w; };

async function inflateBytes(bytes){
  for(const fmt of ['deflate', 'deflate-raw']){
    try {
      const ds = new DecompressionStream(fmt);
      const buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
      return new Uint8Array(buf);
    } catch(e){ /* coba format berikutnya */ }
  }
  return null;
}

function bacaStringPdf(s, i){
  let out = '', dalam = 1;
  i++;
  while(i < s.length && dalam > 0){
    const c = s[i];
    if(c === '\\'){
      const n = s[i + 1];
      if(n >= '0' && n <= '7'){
        let okt = '', k = i + 1;
        while(k < s.length && okt.length < 3 && s[k] >= '0' && s[k] <= '7'){ okt += s[k]; k++; }
        const kode = parseInt(okt, 8);
        out += WINANSI[kode] || (kode >= 32 && kode < 127 ? String.fromCharCode(kode) : '');
        i = k; continue;
      }
      const peta = { n:'\n', r:'\r', t:'\t', b:'', f:'', '(':'(', ')':')', '\\':'\\' };
      out += peta[n] !== undefined ? peta[n] : n;
      i += 2; continue;
    }
    if(c === '('){ dalam++; out += c; i++; continue; }
    if(c === ')'){ dalam--; if(dalam === 0){ i++; break; } out += c; i++; continue; }
    const kode = c.charCodeAt(0);
    out += kode > 127 ? (WINANSI[kode] || '') : c;
    i++;
  }
  return { teks: out, akhir: i };
}

function penggalPdf(isi){
  const keluar = [];
  let tm = [1,0,0,1,0,0], baris = [1,0,0,1,0,0], ukuran = 10, leading = 0;
  const angka = [];
  let pending = [], i = 0;
  const kirim = () => {
    const t = pending.join('');
    pending = [];
    if(t.trim()) keluar.push({ x: tm[4], y: tm[5], teks: t, uk: Math.abs(ukuran * tm[0]) || ukuran });
  };
  while(i < isi.length){
    const c = isi[i];
    if(c === '('){ const r = bacaStringPdf(isi, i); pending.push(r.teks); i = r.akhir; continue; }
    if(c === '<' && isi[i + 1] !== '<'){
      const e = isi.indexOf('>', i);
      if(e > 0){
        const hex = isi.slice(i + 1, e).replace(/\s+/g, '');
        let t = '';
        for(let k = 0; k + 1 < hex.length; k += 2){
          const kode = parseInt(hex.substr(k, 2), 16);
          t += kode >= 32 && kode < 127 ? String.fromCharCode(kode) : (WINANSI[kode] || '');
        }
        pending.push(t); i = e + 1; continue;
      }
    }
    const num = /^[-+]?[\d.]+/.exec(isi.slice(i, i + 24));
    if(num && /[\s\[]/.test(isi[i - 1] || ' ')){
      const v = parseFloat(num[0]);
      angka.push(v);
      if(pending.length && v < -120) pending.push(' ');   // geseran besar = spasi
      i += num[0].length; continue;
    }
    const op = /^(TJ|Tj|T\*|Td|TD|Tm|TL|Tf|BT|ET|'|")/.exec(isi.slice(i, i + 3));
    if(op && /[\s\]>)]/.test(isi[i - 1] || ' ')){
      const o = op[1];
      if(o === 'Tj' || o === 'TJ') kirim();
      else if(o === "'" || o === '"'){ baris = baris.slice(); baris[5] -= leading; tm = baris.slice(); kirim(); }
      else if(o === 'Tm'){ const a = angka.slice(-6); if(a.length === 6){ tm = a.slice(); baris = a.slice(); } }
      else if(o === 'Td' || o === 'TD'){
        const a = angka.slice(-2);
        if(a.length === 2){
          if(o === 'TD') leading = -a[1];
          baris = baris.slice(); baris[4] += a[0]; baris[5] += a[1];
          tm = baris.slice();
        }
      }
      else if(o === 'T*'){ baris = baris.slice(); baris[5] -= leading; tm = baris.slice(); }
      else if(o === 'TL'){ leading = angka[angka.length - 1] || 0; }
      else if(o === 'Tf'){ ukuran = angka[angka.length - 1] || 10; }
      else if(o === 'BT'){ tm = [1,0,0,1,0,0]; baris = tm.slice(); }
      angka.length = 0;
      i += o.length; continue;
    }
    i++;
  }
  return keluar;
}

function rakitBarisPdf(penggal){
  const grup = [];
  penggal.forEach(p => {
    const g = grup.find(q => Math.abs(q.y - p.y) < 3.5);
    if(g) g.item.push(p); else grup.push({ y: p.y, item: [p] });
  });
  grup.sort((a, b) => b.y - a.y);
  return grup.map(g => {
    g.item.sort((a, b) => a.x - b.x);
    let out = '', akhirX = null;
    g.item.forEach(p => {
      if(akhirX !== null && p.x - akhirX > p.uk * 0.16 && !/\s$/.test(out) && !/^\s/.test(p.teks)) out += ' ';
      out += p.teks;
      akhirX = p.x + lebarTeks(p.teks, p.uk);
    });
    return out.replace(/\s+/g, ' ').trim();
  }).filter(t => t);
}

// byte -> string latin1 (dipotong supaya argumen apply tidak kebanyakan)
function teksLatin(b){
  let raw = '';
  for(let i = 0; i < b.length; i += 32768)
    raw += String.fromCharCode.apply(null, b.subarray(i, Math.min(i + 32768, b.length)));
  return raw;
}
const bytesLatin = s => {
  const b = new Uint8Array(s.length);
  for(let k = 0; k < s.length; k++) b[k] = s.charCodeAt(k) & 255;
  return b;
};

// daftar objek PDF, urut nomor. Batas tiap objek diambil dari awal objek
// berikutnya — data biner bisa saja memuat kata "endobj" sehingga pencarian
// penanda penutup tidak selalu aman
function objekPdf(raw){
  const kepala = [];
  const reObj = /(\d+)\s+0\s+obj\b/g;
  let m;
  while((m = reObj.exec(raw))) kepala.push({ no: parseInt(m[1], 10), awal: m.index, bodi: m.index + m[0].length });
  return kepala.map((k, i) => ({ no: k.no,
    isi: raw.slice(k.bodi, i + 1 < kepala.length ? kepala[i + 1].awal : raw.length) }))
    .sort((a, b) => a.no - b.no);
}

// kamus + isi stream sebuah objek, apa adanya (penyaringnya belum dibuka)
function streamPdf(o){
  const i = o.isi.indexOf('stream');
  if(i < 0) return null;
  const dict = o.isi.slice(0, i);
  let j = i + 6;
  if(o.isi[j] === '\r') j++;
  if(o.isi[j] === '\n') j++;
  // panjang tepat dari /Length; DecompressionStream menolak sisa byte di
  // belakang, jadi penanda endstream saja tidak cukup (ada \r\n penutup)
  const len = (dict.match(/\/Length\s+(\d+)(?!\s+\d+\s+R)/) || [])[1];
  let e;
  if(len){
    e = j + parseInt(len, 10);
  } else {
    e = o.isi.indexOf('endstream', j);
    if(e < 0) return null;
    while(e > j && (o.isi[e - 1] === '\n' || o.isi[e - 1] === '\r')) e--;
  }
  return { dict, mentah: o.isi.slice(j, e) };
}

// PDF -> array baris teks
async function pdfBaris(arrayBuffer){
  const baris = [];
  for(const o of objekPdf(teksLatin(new Uint8Array(arrayBuffer)))){
    const s = streamPdf(o);
    if(!s) continue;
    if(/\/Subtype\s*\/Image|\/DCTDecode|\/Type\s*\/(Font|XRef|ObjStm|Metadata)/.test(s.dict)) continue;
    const bytes = bytesLatin(s.mentah);
    // sebagian penghasil PDF (jsPDF, dll.) menulis isi halaman tanpa
    // pemampatan — stream tanpa /Filter dipakai apa adanya
    const keluar = /\/Filter/.test(s.dict) ? await inflateBytes(bytes) : bytes;
    if(!keluar) continue;
    const teks = teksLatin(keluar);
    if(!/\bBT\b/.test(teks) || !(/\bTJ\b/.test(teks) || /\bTj\b/.test(teks))) continue;
    baris.push(...rakitBarisPdf(penggalPdf(teks)));
  }
  return baris;
}

// PDF hasil pindaian tidak punya lapisan teks: tiap halaman hanya satu foto.
// JPEG di dalam PDF (/DCTDecode) tersimpan apa adanya sehingga bytenya bisa
// langsung dipakai sebagai berkas gambar tanpa penyandian ulang.
function gambarPdf(arrayBuffer){
  const objek = objekPdf(teksLatin(new Uint8Array(arrayBuffer)));
  const peta = {};
  objek.forEach(o => { peta[o.no] = o; });
  const isJpeg = o => {
    const s = streamPdf(o);
    return s && /\/Subtype\s*\/Image/.test(s.dict) && /\/DCTDecode/.test(s.dict) ? s : null;
  };
  const semua = objek.filter(isJpeg).map(o => o.no);
  if(!semua.length) return [];
  // urutan halaman dilacak lewat /Kids lalu XObject yang digambar tiap
  // halaman; bila ada yang tak terbaca, dipakai urutan nomor objek
  const urut = [];
  const pages = objek.find(o => /\/Type\s*\/Pages\b/.test(o.isi));
  const kids = pages && (pages.isi.match(/\/Kids\s*\[([^\]]*)\]/) || [])[1];
  [...String(kids || '').matchAll(/(\d+)\s+0\s+R/g)].forEach(k => {
    const hal = peta[parseInt(k[1], 10)];
    if(!hal) return;
    const noRes = (hal.isi.match(/\/Resources\s+(\d+)\s+0\s+R/) || [])[1];
    const res = noRes ? ((peta[parseInt(noRes, 10)] || {}).isi || '') : hal.isi;
    const xobj = (res.match(/\/XObject\s*<<([\s\S]*?)>>/) || [])[1] || '';
    const nama = {};
    for(const m of xobj.matchAll(/\/(\w+)\s+(\d+)\s+0\s+R/g)) nama[m[1]] = parseInt(m[2], 10);
    const noIsi = (hal.isi.match(/\/Contents\s+(\d+)\s+0\s+R/) || [])[1];
    const isi = noIsi && peta[parseInt(noIsi, 10)]
      ? ((streamPdf(peta[parseInt(noIsi, 10)]) || {}).mentah || '') : '';
    for(const m of isi.matchAll(/\/(\w+)\s+Do\b/g))
      if(nama[m[1]] != null && !urut.includes(nama[m[1]])) urut.push(nama[m[1]]);
  });
  const pakai = urut.length === semua.length && urut.every(n => semua.includes(n)) ? urut : semua;
  return pakai.map(no => new Blob([bytesLatin(isJpeg(peta[no]).mentah)], { type: 'image/jpeg' }));
}

// ===== IMPOR LAPORAN DISEMINASI =====
// Laporan Diseminasi Informasi berisi blok berulang "LAPORAN KEGIATAN
// DISEMINASI INFORMASI PERTANIAN" — satu blok satu kegiatan. Isinya dipanen
// menjadi baris tabel rincian pada Laporan Pelaksanaan Tugas & Fungsi.
const paraTeks = xml => [...xml.matchAll(/<w:p[ >][\s\S]*?<\/w:p>/g)]
  .map(m => unescXml([...m[0].matchAll(/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>/g)]
    .map(q => q[1]).join('')).replace(/\s+/g, ' ').trim())
  .filter(t => t);

// tabel rincian diseminasi dikenali dari judul kolomnya, bukan nama file
function isTabelDiseminasi(labels){
  const ada = re => labels.some(l => re.test(l));
  return ada(/materi/i) && ada(/metode/i) && ada(/peserta/i);
}

// menerima baris teks (paragraf .docx atau baris hasil baca PDF)
function parseDiseminasi(paras){
  if(typeof paras === 'string') paras = paraTeks(paras);
  const awal = [];
  paras.forEach((t, i) => { if(/^LAPORAN KEGIATAN DISEMINASI/i.test(t)) awal.push(i); });
  if(!awal.length) return [];
  // label pada PDF berawalan nomor/huruf ("3. Materi Diseminasi : ...")
  const NOMOR = '(?:\\d+\\.\\s*|[a-z]\\.\\s*)?';
  const ambil = (blok, label) => {
    const re = new RegExp('^' + NOMOR + label + '\\s*:\\s*', 'i');
    for(const t of blok) if(re.test(t)) return t.replace(re, '').trim();
    return '';
  };
  // baris penutup blok: "Pitu Riawa, 8 Juni 2026" / "Mengetahui," / "NIP. ..."
  const penutup = t => /^[A-Za-z .'-]+,\s*\d{1,2}\s+\S+\s+\d{4}$/.test(t) ||
    /^(Mengetahui|Koordinator|NIP\.)/i.test(t);
  const reHasil = new RegExp('^' + NOMOR + 'Hasil Kegiatan\\s*:\\s*', 'i');
  const hasilDari = blok => {
    let i = blok.findIndex(t => reHasil.test(t));
    if(i < 0) return '';
    const masalah = [], solusi = [];
    let mode = null;
    const potong = (t, re, bak) => { const r = t.replace(re, '').trim(); if(r) bak.push(r); };
    for(let k = i; k < blok.length; k++){
      let t = blok[k];
      if(k === i) t = t.replace(reHasil, '').trim();
      if(!t) continue;
      if(penutup(t)) break;
      if(/^Masalah\s*:/i.test(t)){ mode = 'm'; potong(t, /^Masalah\s*:\s*/i, masalah); continue; }
      if(/^Solusi\s*:/i.test(t)){ mode = 's'; potong(t, /^Solusi\s*:\s*/i, solusi); continue; }
      (mode === 's' ? solusi : masalah).push(t);
    }
    const gab = a => a.join(' ').replace(/\s+/g, ' ').trim();
    const m = gab(masalah), s = gab(solusi);
    return (m ? 'Masalah: ' + m : '') + (s ? (m ? ' ' : '') + 'Solusi: ' + s : '');
  };
  return awal.map((mulai, idx) => {
    const blok = paras.slice(mulai, awal[idx + 1] !== undefined ? awal[idx + 1] : paras.length);
    return {
      tanggal: ambil(blok, 'Waktu Pelaksanaan').replace(/^[A-Za-z]+,\s*/, '').trim(),
      materi: ambil(blok, 'Materi Diseminasi') || ambil(blok, 'Materi'),
      lokasi: ambil(blok, 'Tempat/Lokasi') || ambil(blok, 'Lokasi'),
      metode: ambil(blok, 'Metode'),
      peserta: ambil(blok, 'Peserta'),
      hasil: hasilDari(blok)
    };
  }).filter(k => k.materi || k.tanggal);
}

// ===== IMPOR TABEL UMUM (untuk lampiran laporan lain) =====
// .docx: tabel pertama yang berisi data; .xlsx: lembar pertama; .csv: teks.
function tabelDariDocx(xml){
  for(const t of xml.matchAll(/<w:tbl>[\s\S]*?<\/w:tbl>/g)){
    const trs = [...t[0].matchAll(/<w:tr[ >][\s\S]*?<\/w:tr>/g)].map(m => m[0]);
    if(trs.length < 2) continue;
    const rows = trs.map(tr => cellsOfTr(tr).map(c => unescXml(cellText(c))));
    if(rows.some(r => r.some(v => v))) return rows;
  }
  return null;
}

const kolomXlsx = ref => {                       // "BC12" -> indeks 0-based
  const h = (ref.match(/^[A-Z]+/) || ['A'])[0];
  let n = 0;
  for(const c of h) n = n * 26 + (c.charCodeAt(0) - 64);
  return n - 1;
};
async function tabelDariXlsx(zip){
  const shared = [];
  const ss = zip.file('xl/sharedStrings.xml');
  if(ss){
    const x = await ss.async('string');
    for(const si of x.matchAll(/<si>([\s\S]*?)<\/si>/g))
      shared.push(unescXml([...si[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(q => q[1]).join('')));
  }
  const nama = Object.keys(zip.files).filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort();
  if(!nama.length) return null;
  const sheet = await zip.file(nama[0]).async('string');
  const rows = [];
  for(const row of sheet.matchAll(/<row[^>]*>([\s\S]*?)<\/row>/g)){
    const sel = [];
    for(const c of row[1].matchAll(/<c\s((?:[^>\/]|\/(?!>))*)>([\s\S]*?)<\/c>/g)){
      const ref = (c[1].match(/r="([A-Z]+\d+)"/) || [])[1];
      const tipe = (c[1].match(/t="([^"]+)"/) || [])[1];
      const v = (c[2].match(/<v>([\s\S]*?)<\/v>/) || [])[1];
      const isT = (c[2].match(/<t[^>]*>([\s\S]*?)<\/t>/) || [])[1];
      let teks = isT !== undefined ? unescXml(isT) : (v === undefined ? '' : v);
      if(tipe === 's' && v !== undefined) teks = shared[parseInt(v, 10)] || '';
      sel[ref ? kolomXlsx(ref) : sel.length] = teks;
    }
    for(let i = 0; i < sel.length; i++) if(sel[i] === undefined) sel[i] = '';
    rows.push(sel);
  }
  return rows.filter(r => r.some(v => String(v).trim())).length ? rows : null;
}

// ===== MODEL BUKU HARIAN LTT ("LAPORAN LUAS OLAH LAHAN DAN TANAM") =====
// Buku kerja harian LTT tidak berbentuk tabel biasa: hari 1–31 menjadi kolom
// F..AJ, tiap desa menempati satu blok baris (sel kolom B digabung sepanjang
// bloknya), dan di dalam blok ada tiga kelompok JENIS LTT berurutan —
// Reguler, Oplah Rawa, Oplah Non Rawa — masing-masing dengan baris
// OLAH LAHAN / LTT / PANEN. Yang dipakai laporan adalah baris LTT.
const hurufKolom = i => {              // 0 -> "A", 5 -> "F", 35 -> "AJ"
  let n = i + 1, s = '';
  while(n > 0){ s = String.fromCharCode(65 + (n - 1) % 26) + s; n = Math.floor((n - 1) / 26); }
  return s;
};
const angka2 = n => {
  const [a, b] = n.toFixed(2).split('.');
  return a.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + b;
};

// seluruh lembar: nilai sel per rujukan + daftar sel gabung
async function bukuXlsx(zip){
  const shared = [];
  const ss = zip.file('xl/sharedStrings.xml');
  if(ss){
    const x = await ss.async('string');
    for(const si of x.matchAll(/<si>([\s\S]*?)<\/si>/g))
      shared.push(unescXml([...si[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(q => q[1]).join('')));
  }
  const peta = {};
  const relf = zip.file('xl/_rels/workbook.xml.rels');
  if(relf) for(const m of (await relf.async('string')).matchAll(/Id="([^"]+)"[^>]*?Target="([^"]+)"/g))
    peta[m[1]] = 'xl/' + m[2].replace(/^\/?xl\//, '').replace(/^\//, '');
  const daftar = [];
  const wbf = zip.file('xl/workbook.xml');
  if(wbf) for(const m of (await wbf.async('string')).matchAll(/<sheet[^>]*?name="([^"]*)"[^>]*?r:id="([^"]*)"/g))
    daftar.push({ nama: unescXml(m[1]), path: peta[m[2]] });
  if(!daftar.length) Object.keys(zip.files)
    .filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()
    .forEach((p, i) => daftar.push({ nama: 'Lembar ' + (i + 1), path: p }));
  const hasil = [];
  for(const s of daftar){
    const f = s.path && zip.file(s.path);
    if(!f) continue;
    const xml = await f.async('string');
    const sel = {};
    // hanya <c ...> berisi nilai: spasi wajib sesudah "<c" supaya <cols> tidak
    // ikut tertangkap, dan "/" hanya boleh bila bukan penutup sendiri —
    // sel kosong <c .../> tidak punya nilai jadi memang dilewati
    for(const c of xml.matchAll(/<c\s((?:[^>\/]|\/(?!>))*)>([\s\S]*?)<\/c>/g)){
      const ref = (c[1].match(/r="([A-Z]+\d+)"/) || [])[1];
      if(!ref) continue;
      const tipe = (c[1].match(/t="([^"]+)"/) || [])[1];
      const v = (c[2].match(/<v>([\s\S]*?)<\/v>/) || [])[1];
      const isT = (c[2].match(/<t[^>]*>([\s\S]*?)<\/t>/) || [])[1];
      let teks = isT !== undefined ? unescXml(isT) : (v === undefined ? '' : v);
      if(tipe === 's' && v !== undefined) teks = shared[parseInt(v, 10)] || '';
      sel[ref] = teks;
    }
    hasil.push({ nama: s.nama, sel,
      gabung: [...xml.matchAll(/<mergeCell[^>]*ref="([^"]+)"/g)].map(m => m[1]) });
  }
  return hasil;
}

const lembarLtt = lb => {
  const kepala = Object.keys(lb.sel).filter(r => parseInt(r.replace(/\D/g, ''), 10) <= 6)
    .map(r => String(lb.sel[r])).join(' ').toUpperCase();
  return /LUAS OLAH LAHAN DAN TANAM/.test(kepala) && /JENIS LTT/.test(kepala);
};

// blok desa: satu sel kolom B digabung sepanjang baris bloknya
function blokDesaLtt(lb){
  const blok = [];
  lb.gabung.forEach(g => {
    const m = g.match(/^B(\d+):B(\d+)$/);
    if(!m) return;
    const nama = String(lb.sel['B' + m[1]] || '').trim();
    if(nama && parseInt(m[1], 10) > 5)          // lewati sel gabung baris kepala
      blok.push({ nama, dari: parseInt(m[1], 10), sampai: parseInt(m[2], 10) });
  });
  if(!blok.length){                     // tanpa sel gabung: tiap B berisi teks = awal blok
    const baris = Object.keys(lb.sel).filter(r => /^B\d+$/.test(r) && String(lb.sel[r]).trim())
      .map(r => parseInt(r.slice(1), 10)).filter(n => n > 5).sort((a, b) => a - b);
    baris.forEach((n, i) => blok.push({ nama: String(lb.sel['B' + n]).trim(),
      dari: n, sampai: baris[i + 1] ? baris[i + 1] - 1 : n + 24 }));
  }
  return blok.sort((a, b) => a.dari - b.dari);
}

// nilai harian baris LTT tiap kelompok dalam satu blok desa
function harianLtt(lb, blok, hari){
  const barisLtt = [];
  for(let r = blok.dari; r <= blok.sampai; r++)
    if(/^LTT$/i.test(String(lb.sel['E' + r] || '').trim())) barisLtt.push(r);
  if(!barisLtt.length) return null;
  const ambil = (r, d) => {
    if(!r) return 0;
    const v = lb.sel[hurufKolom(5 + d - 1) + r];     // kolom F = hari ke-1
    if(v === undefined || v === '') return 0;
    const n = parseFloat(String(v).replace(',', '.'));
    return isFinite(n) ? n : 0;
  };
  const out = [];
  for(let d = 1; d <= hari; d++)
    out.push([ambil(barisLtt[0], d), ambil(barisLtt[1], d), ambil(barisLtt[2], d)]);
  return out;
}

async function tabelDariBukuLtt(zip, ctx){
  const buku = await bukuXlsx(zip);
  const lembar = buku.filter(lembarLtt);
  if(!lembar.length) return null;                     // bukan buku harian LTT
  const per = (ctx && ctx.periode) || null;
  if(!per) throw new Error('bulan tabel belum ditentukan — pilih dulu BULAN KOLOM TANGGAL');
  const bulan = BULAN[per.mIdx].toUpperCase();
  const pilih = lembar.find(l => l.nama.toUpperCase().indexOf(bulan) >= 0);
  if(!pilih) throw new Error('buku harian LTT terbaca, tetapi tidak ada lembar ' + BULAN[per.mIdx] +
    ' — lembar yang tersedia: ' + lembar.map(l => l.nama).join(', '));
  const blok = blokDesaLtt(pilih);
  const desa = ctx && ctx.desa ? String(ctx.desa).toUpperCase() : '';
  const b = desa ? blok.find(x => x.nama.toUpperCase().indexOf(desa) >= 0) : null;
  if(!b) throw new Error('desa ' + (ctx && ctx.desa ? ctx.desa : '(belum terdeteksi)') +
    ' tidak ada pada lembar ' + pilih.nama + ' — desa pada buku: ' +
    blok.map(x => x.nama).join(', '));
  const hari = lastDay(per.year, per.mIdx);
  const nilai = harianLtt(pilih, b, hari);
  if(!nilai) throw new Error('baris LTT tidak ditemukan pada blok ' + b.nama);
  return { nilai, lembar: pilih.nama, desa: b.nama, hari };
}

// nilai harian -> baris tabel lampiran, mengikuti urutan kolom laporan
function barisLampiranLtt(nilai, labels){
  const cari = re => labels.findIndex(l => re.test(l));
  const iKeg = cari(/kegiatan/i);
  const kol = [cari(/reguler/i), cari(/oplah\s*rawa|rawa\s*\//i), cari(/non\s*rawa/i)];
  if(kol[0] < 0) return null;
  return nilai.map(h => {
    const r = new Array(labels.length).fill('');
    if(iKeg >= 0) r[iKeg] = 'Tanam';
    kol.forEach((c, k) => { if(c >= 0) r[c] = angka2(h[k]); });
    return r;
  });
}

function tabelDariCsv(teks){
  const rows = [];
  let sel = '', baris = [], kutip = false;
  const pemisah = (teks.split('\n')[0].split(';').length > teks.split('\n')[0].split(',').length) ? ';' : ',';
  for(let i = 0; i < teks.length; i++){
    const c = teks[i];
    if(kutip){
      if(c === '"' && teks[i + 1] === '"'){ sel += '"'; i++; }
      else if(c === '"') kutip = false;
      else sel += c;
      continue;
    }
    if(c === '"'){ kutip = true; continue; }
    if(c === pemisah){ baris.push(sel); sel = ''; continue; }
    if(c === '\n'){ baris.push(sel); rows.push(baris); baris = []; sel = ''; continue; }
    if(c !== '\r') sel += c;
  }
  if(sel || baris.length){ baris.push(sel); rows.push(baris); }
  return rows.map(r => r.map(v => v.trim())).filter(r => r.some(v => v));
}

// samakan kolom sumber dengan kolom tabel tujuan lewat kemiripan judulnya
function petakanTabel(rows, labels){
  const bersih = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const kepala = rows[0].map(bersih);
  const punyaKepala = kepala.filter(h => h && /[a-z]/.test(h)).length >= Math.max(2, Math.floor(labels.length / 2));
  const data = punyaKepala ? rows.slice(1) : rows;
  const peta = labels.map((l, li) => {
    if(!punyaKepala) return li;                       // tanpa judul: ikut urutan
    const t = bersih(l);
    let idx = kepala.findIndex(h => h && (h === t));
    if(idx < 0) idx = kepala.findIndex(h => h && (h.includes(t) || t.includes(h)));
    if(idx < 0){
      const kata = t.split(' ').filter(w => w.length > 3);
      idx = kepala.findIndex(h => h && kata.some(w => h.includes(w)));
    }
    return idx;
  });
  return data.filter(r => r.some(v => String(v).trim())).map((r, i) => labels.map((l, li) => {
    if(/^no\.?$/i.test(l.trim()) && peta[li] < 0) return String(i + 1);
    const k = peta[li];
    return k >= 0 && r[k] !== undefined ? String(r[k]).trim() : '';
  }));
}

// susun kegiatan hasil impor mengikuti urutan & jumlah kolom tabel tujuan
function barisDiseminasi(kegiatan, labels){
  return kegiatan.map((k, i) => labels.map(l => {
    if(/^no\.?$/i.test(l.trim())) return String(i + 1);
    if(/tanggal|waktu/i.test(l)) return k.tanggal;
    if(/materi|kegiatan|uraian/i.test(l)) return k.materi;
    if(/lokasi|tempat/i.test(l)) return k.lokasi;
    if(/metode/i.test(l)) return k.metode;
    if(/peserta/i.test(l)) return k.peserta;
    if(/hasil|masalah|solusi/i.test(l)) return k.hasil;
    return '';
  }));
}

// satu pintu impor: pilih pembaca sesuai jenis berkas, hasilkan baris tabel
// yang sudah sejajar dengan kolom lampiran laporan tujuan
// ===== DESKRIPSI: kalimat naratif dari berkas yang diunggah =====
// Baris yang panjang, banyak kata, dan didominasi huruf dianggap kalimat —
// bukan potongan tabel, nomor, atau kop surat.
function narasiDariBaris(baris, batas){
  const pilih = (baris || []).map(t => String(t || '').trim()).filter(t => {
    if(t.length < 30) return false;
    if(t.split(/\s+/).length < 5) return false;
    const huruf = (t.match(/[A-Za-zÀ-ÿ]/g) || []).length;
    if(huruf / t.length < 0.6) return false;
    // judul/kop biasanya HURUF BESAR SEMUA — kalimat isi tidak
    const kecil = (t.match(/[a-zà-ÿ]/g) || []).length;
    if(kecil / huruf < 0.5) return false;
    if(/^(NIP|NAMA|WKPP|BPP|KABUPATEN|LAMPIRAN|TOTAL)\b/i.test(t)) return false;
    return true;
  });
  return pilih.slice(0, batas || 8).join('\n');
}

// tabel apa adanya dari teks polos (hasil OCR): kolom dipisah jarak ganda,
// tab, atau garis tegak. Jumlah kolom diambil dari pola yang paling sering.
function tabelDariTeks(teks){
  const pecah = t => t.trim().split(/ {2,}|\t+|\s*\|\s*/).map(s => s.trim()).filter(s => s !== '');
  const cand = String(teks || '').split(/\r?\n/).map(pecah).filter(a => a.length >= 2);
  if(cand.length < 2) return null;
  const freq = {};
  cand.forEach(a => { freq[a.length] = (freq[a.length] || 0) + 1; });
  const kol = parseInt(Object.keys(freq).sort((a, b) => freq[b] - freq[a] || b - a)[0], 10);
  const rows = cand.filter(a => Math.abs(a.length - kol) <= 1)
    .map(a => a.length === kol ? a : a.concat(new Array(kol - a.length).fill('')));
  return rows.length >= 2 ? rows : null;
}

// ===== OCR: baca tulisan pada foto/pindaian =====
// Pustakanya besar (~5 MB terpakai) jadi baru diunduh saat gambar pertama
// diunggah, lalu tersimpan di cache service worker untuk pemakaian offline.
const RE_GAMBAR = /\.(jpe?g|png|webp|bmp|gif|tiff?)$/i;
let ocrDimuat = null;
function muatOcr(){
  if(window.Tesseract) return Promise.resolve();
  if(ocrDimuat) return ocrDimuat;
  ocrDimuat = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'vendor/ocr/tesseract.min.js';
    s.onload = () => res();
    s.onerror = () => { ocrDimuat = null; rej(new Error('pustaka OCR gagal dimuat — periksa sambungan internet')); };
    document.head.appendChild(s);
  });
  return ocrDimuat;
}
// Halaman laporan lazim memuat foto kegiatan dan tanda tangan; OCR ikut
// "membaca" gambarnya dan memulangkan baris sampah — termasuk cap lokasi dan
// waktu dari kamera GPS. Keyakinan pengenalan memisahkannya dengan tegas:
// teks cetak di atas 80, hasil baca foto jauh di bawahnya.
//
// Penyaringan tidak boleh dipukul rata, karena pindaian yang memang buram
// seluruhnya juga berkeyakinan rendah dan teksnya nyata. Dua syarat memisahkan
// kedua keadaan itu: halaman teks yang bersih menyisakan cukup banyak baris
// jelas, dan baris yang dibuang berkeyakinan jauh di bawah ambang — bukan
// sekadar di bawahnya sedikit seperti pada pindaian buram.
// (Jumlah baris yang dibuang sengaja tidak dipakai: justru pada halaman yang
// separuhnya foto, derau terbanyak, dan di situ penyaringan paling diperlukan.)
const AMBANG_YAKIN = 80;
const MIN_BARIS_JELAS = 8;
const MAKS_RERATA_DERAU = 60;
function saringDerauOcr(baris){
  const jelas = baris.filter(b => b.yakin >= AMBANG_YAKIN);
  const buang = baris.filter(b => b.yakin < AMBANG_YAKIN);
  if(jelas.length < MIN_BARIS_JELAS || !buang.length) return baris;
  const rerata = buang.reduce((j, b) => j + b.yakin, 0) / buang.length;
  return rerata <= MAKS_RERATA_DERAU ? jelas : baris;
}

// OCR memulangkan tiap kata beserta kotak posisinya. Jarak antar-kata yang
// lebih lebar dari tinggi baris berarti batas kolom, bukan spasi biasa —
// batas itu ditandai spasi ganda supaya tabelnya bisa disusun ulang.
function barisDariBlokOcr(data){
  const baris = [];
  ((data && data.blocks) || []).forEach(b => (b.paragraphs || []).forEach(p => (p.lines || []).forEach(l => {
    const kata = (l.words || []).filter(w => w.text && w.text.trim());
    if(!kata.length) return;
    const tinggi = l.bbox ? Math.max(l.bbox.y1 - l.bbox.y0, 8) : 16;
    const batas = Math.max(tinggi * 0.9, 10);
    let s = kata[0].text;
    for(let i = 1; i < kata.length; i++)
      s += (kata[i].bbox.x0 - kata[i - 1].bbox.x1 > batas ? '  ' : ' ') + kata[i].text;
    baris.push({ teks: s, yakin: kata.reduce((j, w) => j + (w.confidence || 0), 0) / kata.length });
  })));
  return saringDerauOcr(baris).map(b => b.teks);
}

// satu worker dipakai bersama: memuat ulang mesin OCR per halaman mahal
async function pakaiOcr(kerja, lapor){
  await muatOcr();
  const worker = await Tesseract.createWorker('ind', 1, {
    workerPath: 'vendor/ocr/worker.min.js',
    corePath: 'vendor/ocr/',
    langPath: 'vendor/ocr/lang',
    gzip: true, legacyCore: false, legacyLang: false,
    logger: m => { if(lapor) lapor(m); }
  });
  try { return await kerja(worker); } finally { await worker.terminate(); }
}
async function kenaliGambar(worker, sumber){
  const { data } = await worker.recognize(sumber, {}, { blocks: true, text: true });
  const baris = barisDariBlokOcr(data);
  const teks = (data && data.text) || '';
  return { teks, baris: baris.length ? baris
    : teks.split(/\r?\n/).map(t => t.trim()).filter(t => t) };
}
async function bacaGambar(file, lapor){ return pakaiOcr(w => kenaliGambar(w, file), lapor); }

// halaman pindaian dibaca berurutan; kemajuan dilaporkan per halaman
async function bacaHalaman(gambar, lapor){
  return pakaiOcr(async worker => {
    const baris = [];
    for(let i = 0; i < gambar.length; i++){
      if(lapor) lapor({ status: 'recognizing text', halaman: i + 1, dari: gambar.length });
      baris.push(...(await kenaliGambar(worker, gambar[i])).baris);
    }
    return { baris, teks: baris.join('\n') };
  }, lapor);
}

// ctx: { desa, periode } — dipakai pembaca yang butuh konteks laporan,
// misalnya buku harian LTT yang satu berkasnya memuat banyak bulan & desa
async function bacaBerkasLampiran(file, labels, lapor, ctx){
  const nama = file.name.toLowerCase();
  if(RE_GAMBAR.test(nama)){
    const { baris } = await bacaGambar(file, lapor);
    if(!baris.length) throw new Error('tidak ada tulisan yang terbaca dari gambar itu');
    const polos = baris.map(t => t.replace(/ {2,}/g, ' ').trim()).filter(t => t);
    const keg = parseDiseminasi(polos);
    if(keg.length) return { rows: barisDiseminasi(keg, labels), jumlah: keg.length,
      jenis: 'kegiatan diseminasi (dari gambar)', teks: narasiDariBaris(polos) };
    const tabel = tabelDariTeks(baris.join('\n'));
    if(tabel){
      const rows = petakanTabel(tabel, labels);
      if(rows.length) return { rows, jumlah: rows.length,
        jenis: 'baris tabel (dari gambar)', teks: narasiDariBaris(polos) };
    }
    return { rows: null, jumlah: polos.length, jenis: 'baris teks (dari gambar)',
      teks: polos.join('\n') };
  }
  if(nama.endsWith('.pdf')){
    const isi = await file.arrayBuffer();
    let baris = await pdfBaris(isi);
    let asal = '', pindaian = false;
    if(!baris.length){
      // tidak ada lapisan teks: tiap halaman berupa gambar, jadi dibaca OCR
      const halaman = gambarPdf(isi);
      if(!halaman.length) throw new Error('PDF ini tidak memuat teks maupun gambar halaman yang bisa dibaca — simpan ulang halamannya sebagai .jpg/.png lalu unggah');
      baris = (await bacaHalaman(halaman, lapor)).baris;
      if(!baris.length) throw new Error('tidak ada tulisan yang terbaca dari ' + halaman.length + ' halaman pindaian itu');
      asal = ' (pindaian ' + halaman.length + ' halaman)';
      pindaian = true;
    }
    const polos = baris.map(t => t.replace(/ {2,}/g, ' ').trim()).filter(t => t);
    const teks = narasiDariBaris(polos);
    const keg = parseDiseminasi(polos);
    if(keg.length) return { rows: barisDiseminasi(keg, labels), jumlah: keg.length,
      jenis: 'kegiatan diseminasi' + asal, teks };
    // batas kolom hanya terbaca pada jalur OCR (spasi ganda dari kotak kata)
    if(pindaian){
      const tabel = tabelDariTeks(baris.join('\n'));
      if(tabel){
        const rows = petakanTabel(tabel, labels);
        if(rows.length) return { rows, jumlah: rows.length, jenis: 'baris tabel' + asal, teks };
      }
    }
    return { rows: null, jumlah: polos.length, jenis: 'teks dokumen' + asal,
      teks: teks || polos.join('\n') };
  }
  if(nama.endsWith('.docx')){
    const zip = await JSZip.loadAsync(file);
    const doc = zip.file('word/document.xml');
    if(!doc) throw new Error('bukan dokumen Word yang sah');
    const xml = await doc.async('string');
    const teks = narasiDariBaris(paraTeks(xml));
    const keg = parseDiseminasi(xml);
    if(keg.length) return { rows: barisDiseminasi(keg, labels), jumlah: keg.length,
      jenis: 'kegiatan diseminasi', teks };
    const tabel = tabelDariDocx(xml);
    if(tabel){
      const rows = petakanTabel(tabel, labels);
      if(rows.length) return { rows, jumlah: rows.length, jenis: 'baris tabel', teks };
    }
    if(teks) return { rows: null, jumlah: teks.split('\n').length, jenis: 'teks dokumen', teks };
    throw new Error('tidak ada tabel, kegiatan diseminasi, atau kalimat yang terbaca dari dokumen itu');
  }
  if(nama.endsWith('.xlsx')){
    const zip = await JSZip.loadAsync(file);
    // buku harian LTT berbentuk menyilang — dikenali dan dibaca tersendiri
    if(labels.some(l => /reguler/i.test(l)) && labels.some(l => /oplah/i.test(l))){
      const h = await tabelDariBukuLtt(zip, ctx);
      if(h){
        const rows = barisLampiranLtt(h.nilai, labels);
        if(rows) return { rows, jumlah: rows.length, hari: h.hari,
          jenis: 'hari dari buku harian LTT (lembar ' + h.lembar + ', ' + h.desa + ')' };
      }
    }
    const tabel = await tabelDariXlsx(zip);
    if(!tabel) throw new Error('lembar kerja kosong atau tidak terbaca');
    const rows = petakanTabel(tabel, labels);
    if(!rows.length) throw new Error('tidak ada baris data pada lembar pertama');
    return { rows, jumlah: rows.length, jenis: 'baris tabel' };
  }
  if(nama.endsWith('.csv') || nama.endsWith('.txt')){
    const isi = await file.text();
    const tabel = tabelDariCsv(isi);
    if(!tabel.length) throw new Error('berkas CSV kosong');
    const rows = petakanTabel(tabel, labels);
    if(!rows.length) return { rows: null, jumlah: 0, jenis: 'teks dokumen',
      teks: narasiDariBaris(isi.split(/\r?\n/)) };
    return { rows, jumlah: rows.length, jenis: 'baris tabel' };
  }
  throw new Error('jenis berkas belum didukung — pakai gambar (.jpg/.png), .pdf, .docx, .xlsx, atau .csv');
}

// tulis teks ke satu sel (paragraf pertama dipakai, sisanya dikosongkan);
// bentuk swa-tutup dicoba lebih dulu agar tak tertelan pola paragraf biasa
function setCellText(tc, text){
  const ps = [...tc.matchAll(/<w:p[^>]*\/>|<w:p[ >][\s\S]*?<\/w:p>/g)];
  if(!ps.length) return tc;
  let out = '', last = 0;
  ps.forEach((p, i) => {
    out += tc.slice(last, p.index) + replaceParaText(p[0], i === 0 ? text : '');
    last = p.index + p[0].length;
  });
  return out + tc.slice(last);
}

// tulis data editor ke tabel lampiran (dipanggil SEBELUM transformasi tanggal)
// tabel bertanggal: jumlah baris ditentukan periode, isi ditimpa per indeks.
// tabel biasa: jumlah baris mengikuti editor (baris tambahan meniru baris terakhir)
function applyLampiran(xml, lamp){
  if(!lamp || !lamp.rows || !lamp.rows.length) return xml;
  const f = daftarTabelData(xml)[lamp.idx || 0];
  if(!f) return xml;
  const tbl = tulisTabel(xml.slice(f.tblStart, f.tblEnd), f.head, lamp.rows, lamp.dateCols);
  return xml.slice(0, f.tblStart) + tbl + xml.slice(f.tblEnd);
}

// ===== LAMPIRAN GAMBAR =====
// Sebagian laporan perlu melampirkan foto kegiatan. Berkasnya dimasukkan ke
// word/media, didaftarkan pada relasi dokumen dan [Content_Types].xml, lalu
// dirujuk paragraf <w:drawing> baru pada HALAMAN LAMPIRAN yang sudah ada —
// bagian landscape di tiap laporan — bukan halaman baru di ujung dokumen.
const EMU_TWIP = 635;                 // 1 twip = 635 EMU
const NS_DRAW = 'http://schemas.openxmlformats.org/drawingml/2006/main';
const NS_PIC = 'http://schemas.openxmlformats.org/drawingml/2006/picture';

// ukuran asli gambar — dibaca lewat dekoder bawaan peramban
async function ukuranGambar(blob){
  try {
    const bmp = await createImageBitmap(blob);
    const u = { w: bmp.width, h: bmp.height };
    if(bmp.close) bmp.close();
    return u.w && u.h ? u : null;
  } catch(e){ return null; }
}

// Word hanya menampilkan sebagian format gambar; selain JPEG/PNG disandikan
// ulang menjadi PNG lewat canvas supaya pasti tampil saat dokumen dibuka
async function siapkanGambar(file){
  const bawaan = /\.png$/i.test(file.name) ? 'png' : /\.jpe?g$/i.test(file.name) ? 'jpeg' : null;
  if(bawaan) return { blob: file, ext: bawaan, ukuran: await ukuranGambar(file) };
  const bmp = await createImageBitmap(file);
  const kanvas = document.createElement('canvas');
  kanvas.width = bmp.width; kanvas.height = bmp.height;
  kanvas.getContext('2d').drawImage(bmp, 0, 0);
  if(bmp.close) bmp.close();
  const blob = await new Promise(r => kanvas.toBlob(r, 'image/png'));
  if(!blob) throw new Error('gambar ' + file.name + ' tidak bisa disiapkan');
  return { blob, ext: 'png', ukuran: { w: kanvas.width, h: kanvas.height } };
}

// ruang teks satu bagian dokumen, dalam twip
function ruangSect(sect){
  const n = (re, bak) => { const m = String(sect || '').match(re); return m ? parseInt(m[1], 10) : bak; };
  const lebar = n(/<w:pgSz[^>]*\sw:w="(\d+)"/, 11907) -
    n(/<w:pgMar[^>]*\sw:left="(\d+)"/, 1418) - n(/<w:pgMar[^>]*\sw:right="(\d+)"/, 1275);
  const tinggi = n(/<w:pgSz[^>]*\sw:h="(\d+)"/, 16840) -
    n(/<w:pgMar[^>]*\sw:top="(\d+)"/, 1276) - n(/<w:pgMar[^>]*\sw:bottom="(\d+)"/, 1276);
  return { lebar: Math.max(lebar, 2000), tinggi: Math.max(tinggi, 2000) };
}

// Tempat gambar lampiran dititipkan. Tiap laporan punya bagian landscape
// sebagai halaman lampiran; sectPr bagian itu menumpang paragraf terakhirnya,
// jadi gambar disisipkan tepat sebelum paragraf tersebut — masih di dalam
// halaman lampiran, tanpa halaman baru. Dokumen tanpa bagian landscape
// (bentuk lama) tetap dilayani: gambarnya ditaruh di ujung badan dokumen.
function titikLampiran(xml){
  const sects = [...xml.matchAll(/<w:sectPr[\s\S]*?<\/w:sectPr>/g)];
  const land = sects.find(s => /w:orient="landscape"/.test(s[0]));
  if(land){
    const p = Math.max(xml.lastIndexOf('<w:p ', land.index), xml.lastIndexOf('<w:p>', land.index));
    if(p >= 0) return { pos: p, sect: land[0], landscape: true };
  }
  const akhir = sects.length ? sects[sects.length - 1] : null;
  const pos = akhir ? akhir.index : xml.lastIndexOf('</w:body>');
  return { pos: pos < 0 ? xml.length : pos, sect: akhir ? akhir[0] : '', landscape: false };
}

const PATAH_HALAMAN = '<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
const paraJudulLampiran = teks =>
  '<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:after="240"/><w:rPr><w:b/></w:rPr></w:pPr>' +
  '<w:r><w:rPr><w:b/></w:rPr><w:t xml:space="preserve">' + escXml(teks) + '</w:t></w:r></w:p>';
const paraKeterangan = teks =>
  '<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:after="240"/>' +
  '<w:rPr><w:i/><w:sz w:val="20"/></w:rPr></w:pPr>' +
  '<w:r><w:rPr><w:i/><w:sz w:val="20"/></w:rPr><w:t xml:space="preserve">' +
  escXml(teks) + '</w:t></w:r></w:p>';

function paraGambar(rid, id, nama, cx, cy){
  return '<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:after="80"/></w:pPr><w:r><w:drawing>' +
    '<wp:inline distT="0" distB="0" distL="0" distR="0">' +
    '<wp:extent cx="' + cx + '" cy="' + cy + '"/><wp:effectExtent l="0" t="0" r="0" b="0"/>' +
    '<wp:docPr id="' + id + '" name="Lampiran ' + id + '"/>' +
    '<wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="' + NS_DRAW + '" noChangeAspect="1"/></wp:cNvGraphicFramePr>' +
    '<a:graphic xmlns:a="' + NS_DRAW + '"><a:graphicData uri="' + NS_PIC + '">' +
    '<pic:pic xmlns:pic="' + NS_PIC + '"><pic:nvPicPr>' +
    '<pic:cNvPr id="0" name="' + escXml(nama) + '"/><pic:cNvPicPr/></pic:nvPicPr>' +
    '<pic:blipFill><a:blip r:embed="' + rid + '"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>' +
    '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + cx + '" cy="' + cy + '"/></a:xfrm>' +
    '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic>' +
    '</a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>';
}

// Dua gambar sebaris pada halaman lampiran yang lebar (landscape). Tabelnya
// tanpa garis — hanya dipakai sebagai kisi penata, bukan tabel data.
function kisiGambar(sel, lebarKolom){
  const KOL = 2;
  const grid = new Array(KOL).fill('<w:gridCol w:w="' + lebarKolom + '"/>').join('');
  const tc = isi => '<w:tc><w:tcPr><w:tcW w:w="' + lebarKolom + '" w:type="dxa"/>' +
    '<w:vAlign w:val="center"/></w:tcPr>' + (isi || '<w:p/>') + '</w:tc>';
  let baris = '';
  for(let i = 0; i < sel.length; i += KOL){
    let tr = '';
    for(let k = 0; k < KOL; k++) tr += tc(sel[i + k]);
    baris += '<w:tr>' + tr + '</w:tr>';
  }
  return '<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:jc w:val="center"/>' +
    '<w:tblBorders>' + ['top','left','bottom','right','insideH','insideV']
      .map(s => '<w:' + s + ' w:val="none" w:sz="0" w:space="0" w:color="auto"/>').join('') +
    '</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr>' +
    '<w:tblGrid>' + grid + '</w:tblGrid>' + baris + '</w:tbl>';
}

// nama berkas kamera (IMG_2026…, DSC01234, 20260915_151521) tidak bermakna
// sebagai keterangan gambar, jadi dibiarkan kosong
const RE_NAMA_KAMERA = /^(img|dsc|dscn|pxl|photo|foto|image|gambar|screenshot|whatsapp(\s*image)?)[\s_-]*[\d\s_.:-]*$/i;
function keteranganGambar(nama){
  const dasar = String(nama).replace(/\.[^.]+$/, '').replace(/_+/g, ' ').replace(/\s+/g, ' ').trim();
  return !dasar || /^[\d\s.()-]+$/.test(dasar) || RE_NAMA_KAMERA.test(dasar) ? '' : dasar;
}

// sisipkan halaman lampiran berisi gambar pilihan pengguna
async function sisipGambarLampiran(zip, xml, gambar, judul){
  if(!gambar || !gambar.length) return xml;
  const relPath = 'word/_rels/document.xml.rels';
  const relFile = zip.file(relPath);
  const ctFile = zip.file('[Content_Types].xml');
  if(!relFile || !ctFile) throw new Error('dokumen tidak lengkap — gambar lampiran tidak bisa disisipkan');
  const rels = await relFile.async('string');
  let ct = await ctFile.async('string');
  // nomor relasi, nama berkas media, dan id bentuk dipilih yang belum terpakai
  let noRel = Math.max(0, ...[...rels.matchAll(/Id="rId(\d+)"/g)].map(m => parseInt(m[1], 10)));
  let noMedia = Math.max(0, ...Object.keys(zip.files)
    .map(n => (n.match(/^word\/media\/\D*(\d+)\.\w+$/) || [])[1]).filter(v => v).map(Number));
  const idAwal = Math.max(900, ...[...xml.matchAll(/<wp:docPr\s+id="(\d+)"/g)].map(m => parseInt(m[1], 10)));
  const titik = titikLampiran(xml);
  const ruang = ruangSect(titik.sect);
  // halaman lampiran yang lebar diisi dua gambar sebaris; halaman tegak satu
  const lebarKolom = titik.landscape ? Math.floor(ruang.lebar / 2) : ruang.lebar;
  const lebarMaks = (titik.landscape ? lebarKolom - 300 : lebarKolom) * EMU_TWIP;
  const tinggiMaks = Math.round(ruang.tinggi * (titik.landscape ? 0.4 : 0.42)) * EMU_TWIP;
  const relBaru = [], sel = [];
  for(let i = 0; i < gambar.length; i++){
    const g = await siapkanGambar(gambar[i]);
    const berkas = 'escapes' + (++noMedia) + '.' + g.ext;
    zip.file('word/media/' + berkas, g.blob);
    const rid = 'rId' + (++noRel);
    relBaru.push('<Relationship Id="' + rid + '" Type="http://schemas.openxmlformats.org/' +
      'officeDocument/2006/relationships/image" Target="media/' + berkas + '"/>');
    if(!new RegExp('<Default\\s+Extension="' + g.ext + '"', 'i').test(ct)){
      const baru = '<Default Extension="' + g.ext + '" ContentType="image/' + g.ext + '"/>';
      ct = /<Default\s/.test(ct) ? ct.replace(/<Default\s/, baru + '<Default ')
                                 : ct.replace('</Types>', baru + '</Types>');
    }
    const u = g.ukuran || { w: 4, h: 3 };
    let cx = lebarMaks, cy = Math.round(cx * u.h / u.w);
    if(cy > tinggiMaks){ cy = tinggiMaks; cx = Math.round(cy * u.w / u.h); }
    const ket = keteranganGambar(gambar[i].name);
    sel.push(paraGambar(rid, idAwal + 1 + i, gambar[i].name, cx, cy) +
      (ket ? paraKeterangan(ket) : '<w:p/>'));
  }
  zip.file(relPath, rels.replace('</Relationships>', relBaru.join('') + '</Relationships>'));
  zip.file('[Content_Types].xml', ct);
  // judul selalu mendahului supaya tabel kisi tidak berdempet (lalu menyatu)
  // dengan tabel lampiran yang sudah ada di halaman itu
  const isi = (titik.landscape ? '' : PATAH_HALAMAN) +
    paraJudulLampiran(judul || 'DOKUMENTASI KEGIATAN') +
    (titik.landscape ? kisiGambar(sel, lebarKolom) : sel.join(''));
  return xml.slice(0, titik.pos) + isi + xml.slice(titik.pos);
}

// ===== penulis tabel & paragraf umum (dipakai integrasi diseminasi) =====
// susun ulang baris data satu tabel; baris tambahan meniru baris terakhir
function tulisTabel(tbl, head, rows, autoCols){
  const trMs = [...tbl.matchAll(/<w:tr[ >][\s\S]*?<\/w:tr>/g)];
  const trs = trMs.map(m => m[0]);
  const data = trs.slice(head);
  if(!data.length || !rows.length) return tbl;
  const auto = new Set(autoCols || []);
  const tulis = (tr, vals) => {
    const ms = [...tr.matchAll(/<w:tc>[\s\S]*?<\/w:tc>/g)];
    let out = '', last = 0;
    ms.forEach((m, i) => {
      out += tr.slice(last, m.index);
      out += (auto.has(i) || vals[i] == null) ? m[0] : setCellText(m[0], vals[i]);
      last = m.index + m[0].length;
    });
    return out + tr.slice(last);
  };
  const tpl = data[data.length - 1];
  const baru = auto.size
    ? data.map((tr, i) => rows[i] ? tulis(tr, rows[i]) : tr)
    : rows.map((vals, i) => tulis(i < data.length ? data[i] : tpl, vals));
  const from = trMs[0].index, to = trMs[trMs.length - 1].index + trs[trs.length - 1].length;
  return tbl.slice(0, from) + trs.slice(0, head).join('') + baru.join('') + tbl.slice(to);
}

// tabel pertama sesudah paragraf berjudul headRe
function tabelSetelahJudul(xml, headRe){
  for(const m of xml.matchAll(/<w:p[ >][\s\S]*?<\/w:p>/g)){
    if(!headRe.test(cellText(m[0]))) continue;
    const s = xml.indexOf('<w:tbl>', m.index);
    if(s < 0) return null;
    const e = xml.indexOf('</w:tbl>', s);
    if(e < 0) return null;
    const tbl = xml.slice(s, e + 8);
    const trs = [...tbl.matchAll(/<w:tr[ >][\s\S]*?<\/w:tr>/g)].map(q => q[0]);
    let head = 0;
    while(head < trs.length && (/<w:tblHeader/.test(trs[head]) || /<w:b\/>|<w:b /.test(trs[head]))) head++;
    // tabel bernomor pada laporan ini selalu berjudul: minimal satu baris kepala
    if(head >= trs.length || head === 0) head = Math.min(1, trs.length - 1);
    return { start: s, end: e + 8, head };
  }
  return null;
}

function gantiTabelSetelahJudul(xml, headRe, rows){
  const t = tabelSetelahJudul(xml, headRe);
  if(!t || !rows.length) return xml;
  return xml.slice(0, t.start) + tulisTabel(xml.slice(t.start, t.end), t.head, rows) + xml.slice(t.end);
}

// ganti paragraf-paragraf isi setelah satu judul (jumlah mengikuti texts)
function gantiParagrafSetelahJudul(xml, headRe, texts, skipFirst){
  const list = [];
  for(const m of xml.matchAll(/<w:p[ >][\s\S]*?<\/w:p>/g))
    list.push({ xml: m[0], at: m.index, text: cellText(m[0]) });
  const hi = list.findIndex(p => headRe.test(p.text));
  if(hi < 0) return xml;
  const edits = [];
  let ganti = 0, lewat = skipFirst || 0;
  for(let i = hi + 1; i < list.length && ganti < texts.length; i++){
    const t = list[i].text;
    if(!t) continue;
    if(/^\d+\.\s|^\d+\.\d+\s*[A-Z]|^LAMPIRAN/i.test(t)) break;
    if(lewat > 0){ lewat--; continue; }
    edits.push({ at: list[i].at, len: list[i].xml.length, xml: replaceParaText(list[i].xml, texts[ganti]) });
    ganti++;
  }
  edits.sort((a, b) => b.at - a.at)
    .forEach(e => { xml = xml.slice(0, e.at) + e.xml + xml.slice(e.at + e.len); });
  return xml;
}

// ===== INTEGRASI LAPORAN DISEMINASI KE SELURUH ISI LAPORAN =====
// Dari daftar kegiatan yang diunggah, seluruh bagian Laporan Pelaksanaan
// Tugas & Fungsi disusun ulang agar sejalan: target, capaian, kesimpulan,
// saran, permasalahan, upaya pemecahan, dan output.
function kegiatanDariBaris(rows, labels){
  const cari = re => labels.findIndex(l => re.test(l));
  const iTgl = cari(/tanggal|waktu/i), iMat = cari(/materi|kegiatan|uraian/i),
        iLok = cari(/lokasi|tempat/i), iMet = cari(/metode/i),
        iPes = cari(/peserta/i), iHas = cari(/hasil|masalah|solusi/i);
  const ambil = (r, i) => (i >= 0 && r[i] != null) ? String(r[i]).trim() : '';
  return rows.filter(r => r.some(v => String(v || '').trim())).map(r => {
    const hasil = ambil(r, iHas);
    const pm = hasil.match(/Masalah\s*:\s*([\s\S]*?)(?:\s*Solusi\s*:|$)/i);
    const ps = hasil.match(/Solusi\s*:\s*([\s\S]*)$/i);
    return { tanggal: ambil(r, iTgl), materi: ambil(r, iMat), lokasi: ambil(r, iLok),
             metode: ambil(r, iMet), peserta: ambil(r, iPes), hasil,
             masalah: pm ? pm[1].trim() : '', solusi: ps ? ps[1].trim() : '' };
  });
}

const STOP_MATERI = /\b(pendampingan|pengawalan|pelaksanaan|kegiatan|program|sosialisasi|informasi|dan|di|ke|pada)\b/g;
function kelompokKegiatan(keg){
  const kunci = m => m.toLowerCase().replace(/[^a-z0-9\s]/g, ' ')
    .replace(STOP_MATERI, ' ').replace(/\s+/g, ' ').trim();
  const grup = [];
  keg.forEach(k => {
    const kk = kunci(k.materi);
    if(!kk) return;
    const g = grup.find(q => q.kunci === kk || q.kunci.includes(kk) || kk.includes(q.kunci));
    if(g){ g.item.push(k); if(k.materi.length < g.label.length) g.label = k.materi; }
    else grup.push({ kunci: kk, label: k.materi, item: [k] });
  });
  return grup;
}

const unikRapi = a => [...new Set(a.map(s => String(s || '').trim()).filter(s => s))];
const daftarKata = a => a.length <= 1 ? (a[0] || '')
  : a.slice(0, -1).join(', ') + ' dan ' + a[a.length - 1];
const awalKecil = s => s ? s.charAt(0).toLowerCase() + s.slice(1) : s;
const kalimatPertama = s => {
  const t = String(s || '').trim();
  const m = t.match(/^[\s\S]{0,140}?[.;]/);
  return (m ? m[0] : t).replace(/[.;]\s*$/, '').trim();
};

function integrasiDiseminasi(xml, keg, labelPeriode){
  keg = keg.filter(k => k.materi || k.tanggal);
  if(!keg.length) return xml;
  const N = keg.length;
  const grup = kelompokKegiatan(keg);
  const B = labelPeriode;

  // --- 2.1 Target & 2.5 Capaian ---
  const barisTarget = [['1',
    'Kegiatan diseminasi informasi pertanian melalui kunjungan lapangan, diskusi, dan pertemuan dengan petani dan pemangku kepentingan',
    'Jumlah kegiatan diseminasi informasi pertanian terlaksana', String(N), 'Kegiatan']];
  const barisCapaian = [['1', 'Kegiatan diseminasi informasi pertanian',
    N + ' kegiatan', N + ' kegiatan', '100%', 'Terlaksana']];
  if(grup.length > 1) grup.forEach((g, i) => {
    const no = String(i + 2);
    barisTarget.push([no, g.label, 'Jumlah kegiatan ' + awalKecil(g.label) + ' terlaksana',
      String(g.item.length), 'Kegiatan']);
    barisCapaian.push([no, g.label, g.item.length + ' kegiatan', g.item.length + ' kegiatan',
      '100%', 'Terlaksana']);
  });
  xml = gantiTabelSetelahJudul(xml, /^2\.1\s*Target/i, barisTarget);
  xml = gantiTabelSetelahJudul(xml, /^2\.5\s*Capaian/i, barisCapaian);

  // --- 4.1 Kesimpulan (3 paragraf, mengikuti gaya laporan) ---
  const rincian = keg.map((k, i) => '(' + (i + 1) + ') ' + awalKecil(k.materi) +
    (k.peserta ? ' bersama ' + awalKecil(k.peserta) : '') +
    (k.lokasi ? ' di ' + k.lokasi : '')).join('; ');
  const masalahRingkas = unikRapi(keg.map(k => awalKecil(kalimatPertama(k.masalah))));
  const kesimpulan = [
    'Pelaksanaan tugas dan fungsi penyuluhan pertanian selama ' + B + ' telah terlaksana sesuai dengan rencana kerja yang ditetapkan, dengan capaian realisasi sebesar 100% untuk seluruh indikator target kegiatan diseminasi informasi pertanian,',
    'Selama ' + B + ', penyuluh pertanian telah melaksanakan ' + N + ' kegiatan diseminasi informasi pertanian yang mencakup: ' + rincian + ',',
    masalahRingkas.length
      ? 'Permasalahan utama yang ditemukan sepanjang periode ini mencakup ' + daftarKata(masalahRingkas) +
        '. Seluruh permasalahan tersebut telah direspons dengan upaya pemecahan sebagaimana diuraikan pada bagian 5.2.'
      : 'Seluruh kegiatan terlaksana tanpa hambatan berarti dan terdokumentasi pada lampiran laporan ini.'
  ];
  xml = gantiParagrafSetelahJudul(xml, /^4\.1\s*Kesimpulan/i, kesimpulan);

  // --- 4.2 Saran (2 paragraf) ---
  const solusiAda = unikRapi(keg.map(k => kalimatPertama(k.solusi)));
  const saran = [
    solusiAda.length
      ? 'Upaya ' + awalKecil(solusiAda[0]) + ' perlu terus dilanjutkan dan diintensifkan pada periode berikutnya,'
      : 'Kegiatan diseminasi informasi pertanian perlu terus dilanjutkan dan diintensifkan pada periode berikutnya,',
    'Kegiatan ' + daftarKata(grup.map(g => awalKecil(g.label))) +
      ' perlu dilanjutkan dengan penguatan koordinasi antara BPP Pitu Riawa, dinas terkait, dan kelompok tani agar pelaksanaannya lebih efektif dan datanya lebih akurat.'
  ];
  xml = gantiParagrafSetelahJudul(xml, /^4\.2\s*Saran/i, saran);

  // --- 5.1 Permasalahan & 5.2 Upaya (satu baris per kegiatan yang berkendala) ---
  const berkendala = keg.filter(k => k.masalah);
  if(berkendala.length){
    xml = gantiTabelSetelahJudul(xml, /^5\.1\s*Permasalahan/i,
      berkendala.map((k, i) => [String(i + 1), k.materi, k.masalah, '']));
    xml = gantiTabelSetelahJudul(xml, /^5\.2\s*Upaya/i,
      berkendala.map((k, i) => [String(i + 1), kalimatPertama(k.masalah), k.solusi,
        unikRapi(['Penyuluh Pertanian', k.peserta]).join(', ')]));
  }

  // --- 5.3 Output ---
  const output = [['1', 'Kegiatan diseminasi informasi terlaksana',
    'Diseminasi informasi pertanian mencakup ' + daftarKata(grup.map(g => awalKecil(g.label))),
    String(N), 'Kegiatan']];
  if(grup.length > 1) grup.forEach((g, i) => {
    const metode = unikRapi(g.item.map(k => awalKecil(k.metode)));
    const lokasi = unikRapi(g.item.map(k => k.lokasi));
    output.push([String(i + 2), g.label + ' terlaksana',
      (metode.length ? daftarKata(metode).replace(/^./, c => c.toUpperCase()) + ' ' : '') +
        awalKecil(g.label) + (lokasi.length ? ' di ' + daftarKata(lokasi) : ''),
      String(g.item.length), 'Kegiatan']);
  });
  output.push([String(output.length + 1), 'Laporan kegiatan',
    'Laporan tertulis pelaksanaan tugas dan fungsi penyuluhan pertanian ' + B + ' sesuai kaidah karya ilmiah',
    '1', 'Dokumen laporan']);
  xml = gantiTabelSetelahJudul(xml, /^5\.3\s*OUTPUT/i, output);
  return xml;
}

// ===== DESKRIPSI PELAKSANAAN: sisipkan paragraf sesudah satu judul =====
// Paragraf terakhir bagian itu dipakai sebagai contoh format, lalu salinannya
// diisi teks baru dan diletakkan tepat sesudahnya.
function sisipParagrafSetelahJudul(xml, headRe, texts){
  if(!texts || !texts.length) return xml;
  const list = [];
  for(const m of xml.matchAll(/<w:p[ >][\s\S]*?<\/w:p>|<w:p[^>]*\/>/g))
    list.push({ xml: m[0], at: m.index, akhir: m.index + m[0].length, text: cellText(m[0]) });
  const hi = list.findIndex(p => headRe.test(p.text));
  if(hi < 0) return xml;
  let last = null;
  for(let i = hi + 1; i < list.length; i++){
    const t = list[i].text;
    if(!t) continue;
    if(/^\d+\.\s|^\d+\.\d+\s*[A-Z]|^LAMPIRAN/i.test(t)) break;
    last = list[i];
  }
  const tpl = last || list[hi];
  const baru = texts.map(t => replaceParaText(tpl.xml, t)).join('');
  return xml.slice(0, tpl.akhir) + baru + xml.slice(tpl.akhir);
}

// teks bebas dari editor -> paragraf di bawah "3. PELAKSANAAN KEGIATAN"
function terapkanDeskripsi(xml, teks){
  const paragraf = String(teks || '').split(/\n{2,}/)
    .map(t => t.replace(/\s*\n\s*/g, ' ').trim()).filter(t => t);
  if(!paragraf.length) return xml;
  return sisipParagrafSetelahJudul(xml, /^3\.\s*PELAKSANAAN/i, paragraf);
}

// ===== INTEGRASI DATA LAMPIRAN KE ISI LAPORAN (selain diseminasi) =====
// Angka pada data yang diunggah dipakai menyusun ulang target, capaian,
// kesimpulan, permasalahan, upaya, dan output laporan yang bersangkutan.
// Yang tidak terbaca dari data dibiarkan apa adanya — tidak dikarang.
function angkaId(v){
  const t = String(v == null ? '' : v).replace(/[±~]/g, '').trim();
  if(!t || /^-+$/.test(t)) return null;
  const m = t.match(/-?\d[\d.,]*/);
  if(!m) return null;
  let s = m[0].replace(/[.,]$/, '');
  if(/,\d{1,3}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');   // 1.234,56
  else s = s.replace(/[.,](?=\d{3}\b)/g, '').replace(/,/g, '.');        // 7.398
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
function fmtId(n){
  if(n == null) return '';
  const bulat = Math.abs(n - Math.round(n)) < 1e-9;
  const s = bulat ? String(Math.round(n)) : n.toFixed(2);
  const [a, b] = s.split('.');
  return a.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (b ? ',' + b : '');
}
const selIsi = v => { const t = String(v == null ? '' : v).trim(); return /^-+$/.test(t) ? '' : t; };
const kolIdx = (labels, re) => labels.findIndex(l => re.test(String(l || '')));
const daftarBatas = (a, n) => a.length <= n + 2 ? daftarKata(a)
  : a.slice(0, n).join(', ') + ', dan ' + (a.length - n) + ' lainnya';
// "±1000" -> "±1.000" (tanda kira-kira dipertahankan)
const rapiJml = raw => {
  const n = angkaId(raw);
  return n == null ? String(raw || '') : (/[±~]/.test(String(raw)) ? '±' : '') + fmtId(n);
};

// baca isi baris data satu tabel bernomor
function bacaTabelSetelahJudul(xml, headRe){
  const t = tabelSetelahJudul(xml, headRe);
  if(!t) return null;
  const tbl = xml.slice(t.start, t.end);
  return [...tbl.matchAll(/<w:tr[ >][\s\S]*?<\/w:tr>/g)].map(m => m[0]).slice(t.head)
    .map(tr => cellsOfTr(tr).map(c => unescXml(cellText(c))));
}
const barisTerisi = rows => (rows || []).filter(r => r.some(v => String(v || '').trim()));
const nomori = rows => { rows.forEach((r, i) => { r[0] = String(i + 1); }); return rows; };

// baris data menimpa baris lama yang sepadan; bila tak ada, ditambahkan
function selaraskanBaris(xml, headRe, kol, cocokRe, baris){
  const rows = barisTerisi(bacaTabelSetelahJudul(xml, headRe));
  if(!rows.length) return xml;
  const i = rows.findIndex(r => cocokRe.test(String(r[kol] || '')));
  if(i >= 0) rows[i] = baris.slice(); else rows.push(baris.slice());
  return gantiTabelSetelahJudul(xml, headRe, nomori(rows));
}

// baris temuan dari data diletakkan di awal tabel, baris lama tetap ada
function sisipBarisAwal(xml, headRe, baris){
  if(!baris.length) return xml;
  const rows = barisTerisi(bacaTabelSetelahJudul(xml, headRe));
  if(!rows.length) return xml;
  return gantiTabelSetelahJudul(xml, headRe,
    nomori(baris.map(r => r.slice()).concat(rows)));
}

// perbarui deskripsi/volume baris output yang sepadan
function selaraskanOutput(xml, spec){
  const rows = barisTerisi(bacaTabelSetelahJudul(xml, /^5\.3\s*OUTPUT/i));
  if(!rows.length) return xml;
  let ubah = false;
  spec.forEach(s => {
    const i = rows.findIndex(r => s.cocok.test(String(r[1] || '')));
    if(i < 0) return;
    if(s.jenis) rows[i][1] = s.jenis;
    if(s.deskripsi) rows[i][2] = s.deskripsi;
    if(s.volume != null) rows[i][3] = String(s.volume);
    if(s.satuan) rows[i][4] = s.satuan;
    ubah = true;
  });
  return ubah ? gantiTabelSetelahJudul(xml, /^5\.3\s*OUTPUT/i, nomori(rows)) : xml;
}

      out.upaya.push([n, 'Belum tersedianya sebagian sarana irigasi',

  kelompencapir(rows, labels, B, D){
    const iTgl = kolIdx(labels, /tanggal/i), iJud = kolIdx(labels, /judul|konten|deskripsi|materi/i);

      const nama = m ? m[1].trim().replace(/^tiktok$/i, 'TikTok').replace(/^youtube$/i, 'YouTube')
        .replace(/^instagram$/i, 'Instagram').replace(/^facebook$/i, 'Facebook') : 'kanal lainnya';
      kanal[nama] = (kanal[nama] || 0) + 1;
    });

      .map(k => k + ' (' + kanal[k] + ' konten)');

        'Sebanyak ' + N + ' konten informasi pertanian telah dideraskan pada ' + hari + ' hari penayangan sepanjang ' + B + ' melalui kanal ' + daftarKata(daftarKanal) + ' kepada anggota Kelompencapir Digital di wilayah binaan Desa ' + D + ' sebagaimana rincian pada lampiran laporan ini,'
      ],
      output: [
        { cocok: /konten|materi/i,
          deskripsi: 'Konten materi informasi pertanian terkini telah dideraskan melalui ' + daftarKata(Object.keys(kanal)) + ' kepada petani dan kelompok tani wilayah binaan',
          volume: N, satuan: 'Konten' }
      ],

    };
  },

  brigade(rows, labels, B, D){
    const iNam = kolIdx(labels, /nama|brigade/i), iKet = kolIdx(labels, /ketua|penanggung/i),
          iAng = kolIdx(labels, /anggota/i), iGar = kolIdx(labels, /garapan/i),
          iTan = kolIdx(labels, /realisasi tanam|luas tanam/i), iPan = kolIdx(labels, /panen/i),
          iPro = kolIdx(labels, /produktivitas/i), iKen = kolIdx(labels, /kendala|masalah/i),

          (anggota > 0 ? ', dengan jumlah anggota ' + fmtId(anggota) + ' orang' : '') +
          (garapan > 0 ? ' dan luas garapan ' + fmtId(garapan) + ' Ha' : '') +
          '; realisasi tanam tercatat ' + fmtId(tanam) + ' Ha dan realisasi panen ' + fmtId(panen) + ' Ha' +
          (prod > 0 ? ' dengan produktivitas rata-rata ' + fmtId(prod) + ' Ton/Ha' : '') + ','
      ],

        { cocok: /data|kinerja|rekapitulasi/i,

          volume: 1, satuan: 'Dokumen' }

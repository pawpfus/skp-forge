<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ESCAPES — Laporan Bulanan</title>
<meta name="theme-color" content="#0e1116" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23161b22'/%3E%3Cg fill='none' stroke='%23c2f24a' stroke-width='4.3' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='19' y='15' width='26' height='35' rx='5.5'/%3E%3Cpath d='M25 29h14'/%3E%3Cpath d='M25 36h14'/%3E%3Cpath d='M25 43h9'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="stylesheet" href="vendor/fonts.css">

<style>
  /* ===================================================================
     ESCAPES — mengikuti sistem tampilan Eviden LCS:
     permukaan gelap kebiruan, kartu bersudut lembut, aksen limau,
     Instrument Sans untuk antarmuka dan JetBrains Mono untuk label kecil.
     =================================================================== */
  :root{
    color-scheme:dark;
    --bg:#0e1116; --card:#161b22; --soft:#1b212a;
    --line:#242c36; --line-2:#323b47;
    --ink:#e6ecf3; --ink-2:#aab4c1; --ink-3:#6b7686; --ink-4:#454f5c;
    --accent:#c2f24a; --accent-ink:#12160a;
    --accent-soft:rgba(194,242,74,.13); --accent-line:rgba(194,242,74,.38);
    --ok:#2fbd7e; --warn:#f0b429; --bad:#ff6a5a;
    /* nama berikut dipakai juga oleh skrip status — dipertahankan */
    --ember-hi:var(--accent); --spark:var(--warn); --danger:var(--bad); --text-dim:var(--ink-3);
    --radius:7px; --radius-btn:8px;
    --shadow:0 1px 0 rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.4);
    --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
    --wrap:1120px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);
    font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
    padding:0 0 64px;}

  /* ---------- batang atas ---------- */
  .topbar{position:sticky;top:0;z-index:50;background:var(--card);
    border-top:2px solid var(--accent);border-bottom:1px solid var(--line);}
  .topbar-inner{max-width:var(--wrap);margin:0 auto;padding:12px 22px;
    display:flex;align-items:center;gap:16px;}
  .brand{display:flex;align-items:center;gap:12px;min-width:0;}
  .brand .logo{width:38px;height:38px;flex:0 0 auto;border-radius:9px;
    background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;
    color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .brand .logo svg{width:21px;height:21px;display:block;}
  .brand h1{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-0.01em;line-height:1.05;
    white-space:nowrap;color:var(--ink);}
  .brand p{margin:3px 0 0;font-family:var(--mono);font-size:10px;font-weight:500;
    letter-spacing:0.08em;color:var(--ink-3);text-transform:uppercase;white-space:nowrap;}

  main{max-width:var(--wrap);margin:22px auto 0;padding:0 22px;}

  /* ---------- kartu ---------- */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
  .panel h2{display:flex;align-items:center;gap:12px;margin:0;
    padding:15px 18px;border-bottom:1px solid var(--line);
    font-size:15px;font-weight:700;letter-spacing:-0.01em;color:var(--ink);}
  .panel h2 .step{width:34px;height:34px;flex:0 0 auto;border-radius:var(--radius-btn);
    background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent);
    display:grid;place-items:center;font-family:var(--mono);font-size:14px;font-weight:700;}
  .panel .body{padding:18px;}

  /* ---------- area unggah ---------- */
  #dropzone{padding:34px 18px;text-align:center;cursor:pointer;background:var(--soft);
    border:1px dashed var(--line-2);border-radius:var(--radius);
    transition:background .15s,border-color .15s,color .15s;}
  #dropzone b{display:block;font-size:15px;font-weight:700;letter-spacing:0.02em;color:var(--ink);}
  #dropzone small{display:block;margin-top:6px;font-family:var(--mono);font-size:10px;
    letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-3);}
  #dropzone:hover,#dropzone.over{background:var(--accent-soft);border-color:var(--accent-line);}
  #dropzone:hover b,#dropzone.over b{color:var(--accent);}

  /* ---------- tabel daftar berkas ---------- */
  #file-list{overflow-x:auto;margin-top:16px;}
  #file-list:empty{margin-top:0;}
  #file-list table{min-width:640px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:10px 12px;text-align:left;vertical-align:top;}
  th{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--ink-3);background:var(--soft);
    border-bottom:1px solid var(--line);white-space:nowrap;}
  td{border-bottom:1px solid var(--line);color:var(--ink-2);}
  tr:last-child td{border-bottom:none;}
  #file-list tr:hover td{background:var(--soft);}
  td .src{color:var(--ink);font-weight:600;}
  td .ok{color:var(--accent);font-weight:600;} td .warn{color:var(--warn);} td .err{color:var(--bad);}

  /* ---------- kendali ---------- */
  .controls{display:flex;flex-wrap:wrap;gap:16px 14px;align-items:flex-end;}
  .controls label{display:flex;flex-direction:column;gap:6px;
    font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--ink-3);}
  .controls label.wide{flex:1 1 340px;}
  .controls label.wide input{width:100%;}
  select,input[type=number],input[type=text]{background:var(--soft);color:var(--ink);
    border:1px solid var(--line);border-radius:var(--radius);
    font-family:inherit;font-size:13.5px;padding:10px 12px;outline:none;min-width:160px;
    transition:border-color .15s,box-shadow .15s,background .15s;}
  select{cursor:pointer;}
  select:focus,input:focus{border-color:var(--accent-line);background:var(--card);
    box-shadow:0 0 0 3px var(--accent-soft);}
  input::placeholder{color:var(--ink-4);}
  select option{background:var(--card);color:var(--ink);}

  /* ---------- tombol ---------- */
  button{font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
    border:1px solid var(--line);border-radius:var(--radius-btn);padding:10px 15px;
    background:transparent;color:var(--ink-2);
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    transition:background .15s,border-color .15s,color .15s,filter .15s;}
  button:hover{background:var(--soft);border-color:var(--line-2);color:var(--ink);}
  button:active{transform:translateY(1px);}
  button:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
  #btn-generate,.lamp-foot .primary{background:var(--accent);color:var(--accent-ink);
    border-color:transparent;font-weight:700;}
  #btn-generate:hover:not(:disabled),.lamp-foot .primary:hover{background:var(--accent);
    color:var(--accent-ink);border-color:transparent;filter:brightness(1.06);}
  #btn-generate{padding:11px 26px;font-size:14px;flex:0 0 auto;}
  #btn-generate:disabled{background:var(--soft);color:var(--ink-4);border-color:var(--line);opacity:1;}

  /* baris tindakan: status di kiri, tombol utama di kanan */
  .actions{display:flex;align-items:center;gap:14px;margin-top:18px;padding-top:16px;
    border-top:1px solid var(--line);}
  #status{flex:1;min-width:0;font-size:13px;color:var(--ink-3);}
  #status:not(:empty){padding:11px 14px;background:var(--soft);border:1px solid var(--line);
    border-left:3px solid currentColor;border-radius:var(--radius);}

  /* tombol di dalam tabel */
  .lamp-btn,.del-btn,.row-del{font-size:11.5px;font-weight:600;padding:6px 11px;
    border-radius:6px;white-space:nowrap;}
  .lamp-btn.done{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);}
  .lamp-btn.done:hover{background:var(--accent-soft);color:var(--accent);filter:brightness(1.15);}
  .del-btn,.row-del{color:var(--ink-3);}
  .del-btn:hover,.row-del:hover{color:var(--bad);border-color:var(--bad);background:rgba(255,106,90,.1);}

  /* ---------- jendela data lampiran ---------- */
  #lamp-modal{position:fixed;inset:0;background:rgba(6,9,13,.74);z-index:70;
    display:flex;align-items:center;justify-content:center;padding:18px;
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
  #lamp-modal[hidden]{display:none;}
  .lamp-box{width:min(1160px,100%);max-height:92vh;display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden;}
  .lamp-head{display:flex;align-items:flex-start;gap:14px;padding:15px 18px;
    border-bottom:1px solid var(--line);}
  .lamp-head h3{margin:0 0 3px;font-size:15px;font-weight:700;letter-spacing:-0.01em;color:var(--ink);}
  .lamp-head .sub{font-size:12px;color:var(--ink-3);line-height:1.55;word-break:break-word;}
  .lamp-x{margin-left:auto;flex:none;width:32px;height:32px;padding:0;font-size:13px;
    border-radius:var(--radius-btn);color:var(--ink-3);}
  .lamp-x:hover{color:var(--bad);border-color:var(--bad);background:rgba(255,106,90,.1);}
  .lamp-grid-wrap{overflow:auto;padding:16px 18px;flex:1;background:var(--bg);}
  #lamp-grid{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;}
  #lamp-grid th{position:sticky;top:0;z-index:1;background:var(--soft);color:var(--ink-3);
    font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;
    padding:9px 9px;border-bottom:1px solid var(--line-2);text-align:left;
    min-width:100px;vertical-align:bottom;}
  #lamp-grid td{border-bottom:1px solid var(--line);padding:3px;vertical-align:top;}
  #lamp-grid td.rownum{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);
    text-align:center;padding:8px 4px;min-width:32px;}
  #lamp-grid td.auto{font-family:var(--mono);font-size:11px;color:var(--accent);
    background:rgba(194,242,74,.055);padding:8px 9px;white-space:nowrap;}
  #lamp-grid textarea{width:100%;min-width:110px;background:var(--soft);color:var(--ink);
    border:1px solid var(--line);border-radius:6px;
    font-family:var(--mono);font-size:12px;padding:7px 8px;
    outline:none;resize:vertical;line-height:1.5;transition:border-color .15s,box-shadow .15s;}
  #lamp-grid textarea:focus{border-color:var(--accent-line);background:var(--card);
    box-shadow:0 0 0 3px var(--accent-soft);}
  .lamp-desk{padding:14px 18px;border-top:1px solid var(--line);background:var(--card);
    display:flex;flex-direction:column;gap:7px;}
  .lamp-desk label{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--ink-3);}
  .lamp-desk textarea{width:100%;background:var(--soft);color:var(--ink);
    border:1px solid var(--line);border-radius:var(--radius);
    font-family:inherit;font-size:13px;line-height:1.55;padding:10px 12px;
    outline:none;resize:vertical;min-height:64px;
    transition:border-color .15s,box-shadow .15s,background .15s;}
  .lamp-desk textarea::placeholder{color:var(--ink-4);}
  .lamp-desk textarea:focus{border-color:var(--accent-line);background:var(--card);
    box-shadow:0 0 0 3px var(--accent-soft);}
  .lamp-foto-bar{display:flex;flex-wrap:wrap;gap:8px;}
  .lamp-foto-bar[hidden]{display:none;}
  .lamp-foto-bar .chip{display:inline-flex;align-items:center;gap:7px;max-width:280px;
    background:var(--soft);border:1px solid var(--line);border-radius:999px;
    padding:4px 5px 4px 12px;font-size:11.5px;color:var(--ink-2);}
  .lamp-foto-bar .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lamp-foto-bar .chip button{flex:none;width:20px;height:20px;padding:0;border-radius:50%;
    font-size:9px;line-height:1;color:var(--ink-3);}
  .lamp-foto-bar .chip button:hover{color:var(--bad);border-color:var(--bad);
    background:rgba(255,106,90,.1);}
  .lamp-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 18px;
    border-top:1px solid var(--line);background:var(--card);}
  .lamp-foot button{font-size:12.5px;padding:9px 14px;}
  .lamp-foot .spacer{flex:1;}
  .lamp-hint{flex:1 1 280px;font-size:11.5px;color:var(--ink-3);line-height:1.55;}
  .lamp-periode{display:flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:0.1em;
    text-transform:uppercase;color:var(--ink-3);}
  .lamp-periode[hidden]{display:none;}
  .lamp-periode select,.lamp-periode input{font-size:12.5px;padding:8px 10px;min-width:0;}
  .lamp-periode select{min-width:124px;} .lamp-periode input{width:86px;}

  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--line-2);border:3px solid var(--bg);border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--ink-4);}

  @media (max-width:640px){
    body{font-size:14px;padding-bottom:52px;}
    .topbar-inner{padding:11px 15px;gap:12px;}
    .brand .logo{width:34px;height:34px;border-radius:8px;}
    .brand h1{font-size:15px;}
    main{margin-top:16px;padding:0 15px;}
    .panel h2{padding:13px 14px;font-size:14px;gap:10px;}
    .panel h2 .step{width:30px;height:30px;font-size:13px;}
    .panel .body{padding:14px;}
    #dropzone{padding:26px 14px;}
    .controls label,.controls label.wide{flex:1 1 100%;}
    select,input[type=number],input[type=text]{min-width:0;width:100%;}
    .actions{flex-direction:column;align-items:stretch;}
    #btn-generate{width:100%;}
    .lamp-box{max-height:96vh;border-radius:8px;}
    .lamp-grid-wrap{padding:10px;} .lamp-foot{padding:12px;gap:8px;}
    .lamp-periode{flex:1 1 100%;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5.5" y="3" width="13" height="18" rx="2.6"></rect>
          <path d="M9 10h6"></path><path d="M9 13.5h6"></path><path d="M9 17h4"></path>
        </svg>
      </div>
      <div>
        <h1>ESCAPES</h1>
        <p>Laporan Bulanan &middot; Penyuluh Pertanian</p>
      </div>
    </div>
  </div>
</header>

<main>

<section class="panel">
  <h2><span class="step">1</span> Masukkan laporan bulan lalu (.docx)</h2>
  <div class="body">
    <div id="dropzone">
      <b>Seret berkas ke sini / ketuk</b>
      <small>berkas tidak dikirim ke mana pun</small>
    </div>
    <input type="file" id="file-input" accept=".docx" multiple style="display:none">
    <div id="file-list"></div>
  </div>
</section>

<section class="panel">
  <h2><span class="step">2</span> Pilih periode laporan baru</h2>
  <div class="body">
    <div class="controls">
      <label>JENIS
        <select id="sel-jenis">
          <option value="bulanan" selected>BULANAN</option>
          <option value="triwulan">TRIWULAN</option>
        </select>
      </label>
      <label id="lbl-bulan">BULAN
        <select id="sel-bulan"></select>
      </label>
      <label id="lbl-triwulan" style="display:none">TRIWULAN
        <select id="sel-triwulan">
          <option value="0">I (JAN&ndash;MAR)</option>
          <option value="1">II (APR&ndash;JUN)</option>
          <option value="2">III (JUL&ndash;SEP)</option>
          <option value="3">IV (OKT&ndash;DES)</option>
        </select>
      </label>
      <label>TAHUN
        <input type="number" id="sel-tahun" min="2024" max="2099">
      </label>
      <label>NAMA DESA (OPSIONAL)
        <input type="text" id="sel-desa" placeholder="sesuai dokumen" autocomplete="off">
      </label>
      <label class="wide">TAUTAN DRIVE (OPSIONAL)
        <input type="text" id="sel-link" placeholder="sesuai dokumen" autocomplete="off" spellcheck="false">
      </label>
      <label>VARIASI NARASI
        <select id="sel-narasi">
          <option value="asli">ASLI (TANPA PERUBAHAN)</option>
          <option value="A">VARIASI A</option>
          <option value="B">VARIASI B</option>
          <option value="C">VARIASI C</option>
          <option value="acak" selected>ACAK A/B/C PER FILE</option>
        </select>
      </label>
    </div>
    <div class="actions">
      <div id="status"></div>
      <button id="btn-generate" disabled>Buat</button>
    </div>
  </div>
</section>

</main>

<div id="lamp-modal" hidden>
  <div class="lamp-box">
    <div class="lamp-head">
      <div>
        <h3 id="lamp-title">LAMPIRAN</h3>
        <div class="sub" id="lamp-sub"></div>
      </div>
      <button class="lamp-x" id="lamp-close">&#10005;</button>
    </div>
    <div class="lamp-grid-wrap" id="lamp-grid-wrap"><table id="lamp-grid"></table></div>
    <div class="lamp-desk">
      <label for="lamp-deskripsi">DESKRIPSI PELAKSANAAN (OPSIONAL)</label>
      <textarea id="lamp-deskripsi" rows="3" spellcheck="false"
        placeholder="Kalimat di sini ditambahkan ke bagian 3. PELAKSANAAN KEGIATAN pada laporan. Terisi sendiri dari berkas yang diunggah, boleh disunting atau diketik langsung."></textarea>
      <label id="lamp-foto-label" hidden>GAMBAR LAMPIRAN</label>
      <div class="lamp-foto-bar" id="lamp-foto-bar" hidden></div>
    </div>
    <div class="lamp-foot">
      <button id="lamp-impor">Unggah dokumen</button>
      <input type="file" id="lamp-impor-file"
        accept=".pdf,.docx,.xlsx,.csv,.txt,.jpg,.jpeg,.png,.webp,.bmp,.gif,.tif,.tiff" style="display:none">
      <button id="lamp-foto">+ Gambar lampiran</button>
      <input type="file" id="lamp-foto-file" multiple
        accept=".jpg,.jpeg,.png,.webp,.bmp,.gif,.tif,.tiff" style="display:none">
      <button id="lamp-add">+ Baris</button>
      <button id="lamp-reset">Kembalikan asli</button>
      <span class="lamp-periode" id="lamp-pilih" hidden>TABEL
        <select id="lamp-tabel"></select>
      </span>
      <span class="lamp-periode" id="lamp-periode" hidden>BULAN KOLOM TANGGAL
        <select id="lamp-bulan"></select>
        <input type="number" id="lamp-tahun" min="2024" max="2099">
      </span>
      <span class="lamp-hint" id="lamp-hint"></span>
      <span class="spacer"></span>
      <button id="lamp-cancel">Batal</button>
      <button id="lamp-save" class="primary">Simpan</button>
    </div>
  </div>
</div>
<script>
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI_EN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const lastDay = (y, m) => new Date(y, m + 1, 0).getDate(); // m = 0-11
const escHtml = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// teks polos dokumen: tag dibuang tanpa pemisah supaya kata yang terbelah
// antar-run menyatu kembali, tetapi batas paragraf/tab/baris tetap jadi spasi
// agar kata paragraf berbeda tidak berdempet ("Otting" + "LAMPIRAN")
const flatText = xml => xml
  .replace(/<\/w:p>|<w:p[^>]*\/>|<w:tab\/>|<w:br\/>/g, ' ')
  .replace(/<[^>]+>/g, '');

// ===== deteksi bulan & tahun sumber dari isi dokumen (fallback: nama file) =====
// Deteksi jalan di teks polos: angka hex di atribut markup (rsid dsb.) tidak
// ikut terhitung sebagai "tahun".
function detectSource(xml, filename){
  const flat = flatText(xml);
  const up = flat.toUpperCase();
  let mIdx = -1, year = null;
  for(let i = 0; i < 12; i++){
    if(up.includes('BULAN ' + BULAN[i].toUpperCase())){ mIdx = i; break; }
  }
  if(mIdx < 0){
    for(let i = 0; i < 12; i++) if(filename.toLowerCase().includes(BULAN[i].toLowerCase())){ mIdx = i; break; }
  }
  const most = freq => {
    let best = null, bn = 0;
    Object.keys(freq).forEach(y => { if(freq[y] > bn){ bn = freq[y]; best = y; } });
    return best ? parseInt(best, 10) : null;
  };
  if(mIdx >= 0){
    // tahun yang paling sering menyertai nama bulan (tahan terhadap angka
    // tahun lain di teks, mis. kutipan undang-undang)
    const freq = {};
    for(const m of flat.matchAll(new RegExp(BULAN[mIdx] + '\\s+(20\\d\\d)', 'gi')))
      freq[m[1]] = (freq[m[1]] || 0) + 1;
    year = most(freq);
  }
  if(year === null){
    const freq = {};
    (flat.match(/20\d\d/g) || []).forEach(y => freq[y] = (freq[y] || 0) + 1);
    year = most(freq);
  }
  return (mIdx >= 0 && year) ? { mIdx, year } : null;
}

// ===== transformasi isi document.xml dari periode sumber ke periode target =====
// Urutan penting: operasi baris tabel & tanggal dd/mm/yyyy memakai tanggal
// SUMBER, jadi harus jalan sebelum nama bulan/tahun ditukar.
// Tabel harian (lampiran LTT): jumlah baris <w:tr> dan tanggal dd/mm/yyyy (Www)
// dipindahkan dari periode src ke periode dst. Dipisah dari transformXml supaya
// bulan tabel dapat ditetapkan sendiri, terlepas dari periode laporan.
function setTabelHarian(xml, src, dst){
  const sLast = lastDay(src.year, src.mIdx), dLast = lastDay(dst.year, dst.mIdx);
  const sMM = String(src.mIdx + 1).padStart(2, '0'), dMM = String(dst.mIdx + 1).padStart(2, '0');
  if(sMM === dMM && src.year === dst.year) return xml;
  const dateTag = dd => String(dd).padStart(2, '0') + '/' + sMM + '/' + src.year;
  // cari awal tag baris; '<w:tr' saja juga cocok dengan '<w:trPr' — pastikan
  // karakter berikutnya spasi atau '>'
  function trStart(before){
    let i = before;
    while((i = xml.lastIndexOf('<w:tr', i - 1)) >= 0){
      const c = xml[i + 5];
      if(c === ' ' || c === '>') return i;
    }
    return -1;
  }
  function trBounds(needle){
    const at = xml.indexOf(needle);
    if(at < 0) return null;
    const start = trStart(at);
    const end = xml.indexOf('</w:tr>', at);
    if(start < 0 || end < 0) return null;
    return { start, end: end + 7 };
  }
  if(dLast < sLast){
    for(let dd = dLast + 1; dd <= sLast; dd++){
      const b = trBounds(dateTag(dd));
      if(b) xml = xml.slice(0, b.start) + xml.slice(b.end);
    }
  } else if(dLast > sLast){
    const b = trBounds(dateTag(sLast));
    if(b){
      const rowTpl = xml.slice(b.start, b.end);
      let extra = '';
      for(let dd = sLast + 1; dd <= dLast; dd++)
        extra += rowTpl.split(dateTag(sLast)).join(dateTag(dd));
      xml = xml.slice(0, b.end) + extra + xml.slice(b.end);
    }
  }
  return xml.replace(/(\d{2})\/(\d{2})\/(\d{4})(\s*\((?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\))?/g,
    (all, dd, mm, yyyy, wd) => {
      if(mm !== sMM || parseInt(yyyy, 10) !== src.year) return all;
      const d = parseInt(dd, 10);
      if(d < 1 || d > dLast) return all;
      const nw = wd ? ' (' + HARI_EN[new Date(dst.year, dst.mIdx, d).getDay()] + ')' : '';
      return dd + '/' + dMM + '/' + dst.year + nw;
    });
}

// lewatiTabel: tabel harian sudah diatur sendiri (bulan tabel dipilih pengguna)
function transformXml(xml, src, dst, lewatiTabel){
  const sName = BULAN[src.mIdx], dName = BULAN[dst.mIdx];
  const sLast = lastDay(src.year, src.mIdx), dLast = lastDay(dst.year, dst.mIdx);

  // -- 1&2. tabel harian: jumlah baris + tanggal dd/mm/yyyy --
  if(!lewatiTabel) xml = setTabelHarian(xml, src, dst);

  // -- 3. nama bulan & tahun: lintas-run (nama bulan bisa terbelah antar-run) --
  xml = swapRunText(xml, sName, dName);
  xml = swapRunText(xml, sName.toUpperCase(), dName.toUpperCase());
  // sebagian dokumen menulis bulan menempel tahun tanpa spasi ("Juni2026"),
  // sehingga batas kata di sisi kanan tidak terbentuk
  [[sName, dName], [sName.toUpperCase(), dName.toUpperCase()]].forEach(([s, d]) => {
    xml = swapRunRegex(xml, new RegExp('\\b' + s + '(?=\\d)', 'g'), d);
  });
  if(src.year !== dst.year){
    xml = swapRunText(xml, String(src.year), String(dst.year));
    [[dName, dName], [dName.toUpperCase(), dName.toUpperCase()]].forEach(([s, d]) => {
      xml = swapRunRegex(xml, new RegExp(s + String(src.year), 'g'), d + String(dst.year));
    });
  }

  // -- 4. hari terakhir periode (01-30 -> 01-31, "Pitu Riawa, 30 ..." -> 31).
  // Word memecah teks jadi run kecil — bahkan angkanya bisa terbelah ("3"|"0"),
  // jadi pola dicari di teks GABUNGAN per-paragraf, lalu kedua digitnya
  // diganti karakter-per-karakter lewat peta indeks gabungan→run. Panjang
  // selalu 2 digit (28–31) sehingga struktur run tidak berubah.
  if(sLast !== dLast){
    const sStr = String(sLast), dStr = String(dLast);
    const finders = [
      new RegExp('01\\s*[-–]\\s*' + sStr + '(?=\\s+' + dName + ')', 'g'),
      new RegExp('s/d\\s+' + sStr + '(?=\\s+' + dName + ')', 'g'),
      new RegExp(',\\s*' + sStr + '(?=\\s+' + dName + '\\s+' + dst.year + ')', 'g')
    ];
    xml = xml.replace(/<w:p[ >][\s\S]*?<\/w:p>/g, para => {
      const runs = [];
      let joined = '';
      for(const m of para.matchAll(/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>/g)){
        runs.push({ t: m[1], at: joined.length });
        joined += m[1];
      }
      const hits = [];
      finders.forEach(re => {
        let m; re.lastIndex = 0;
        while((m = re.exec(joined))) hits.push(m.index + m[0].length - sStr.length);
      });
      if(!hits.length) return para;
      hits.forEach(pos => {
        for(let i = 0; i < dStr.length; i++){
          const g = pos + i;
          const r = runs.find(q => g >= q.at && g < q.at + q.t.length);
          if(r) r.t = r.t.slice(0, g - r.at) + dStr[i] + r.t.slice(g - r.at + 1);
        }
      });
      let k = 0;
      return para.replace(/(<w:t(?:\s[^>]*)?>)([\s\S]*?)(<\/w:t>)/g,
        (a, o, t, c) => o + runs[k++].t + c);
    });
  }

  return xml;
}

  'Mendokumentasikan kegiatan verifikasi dan pengawalan CPCL bantuan pemerintah selama {B};',

  'Menyiapkan kelompok tani penerima agar mampu memanfaatkan bantuan secara benar dan akuntabel.'

 kesimpulan: [
  'Pengawalan CPCL pada {B} terlaksana sesuai jadwal meliputi verifikasi berkas dan peninjauan lapangan calon lokasi,',

  'Kendala yang ditemui adalah kelengkapan dokumen sebagian calon penerima yang belum memenuhi syarat serta perubahan data lapangan yang menuntut pemutakhiran usulan.'

 saran: [
  'Sosialisasi kriteria dan kelengkapan dokumen CPCL perlu dilakukan lebih awal sebelum periode pengusulan dibuka,',

 ],

 upaya: [

  ['Data lapangan berubah', 'Melakukan pengecekan lapangan ulang dan memutakhirkan data usulan sebelum diteruskan secara berjenjang.', 'Penyuluh Pertanian, Tim Verifikasi BPP, Dinas Pertanian']

statistik_pangan: {
